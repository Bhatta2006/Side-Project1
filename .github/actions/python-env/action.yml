name: Python environment
description: Python 3.12 and uv with the locked dependencies installed

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      with:
        version: "0.12.20"
        enable-cache: true
    - run: uv sync --frozen
      shell: bash
