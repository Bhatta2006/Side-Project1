name: native-development-execution
on:
  pull_request:
    paths: &native_paths
      - 'services/execution/**'
      - 'services/api/src/socrat/execution/**'
      - 'services/api/tests/test_local_backend.py'
      - 'services/api/tests/test_execution_worker.py'
      - 'tests/editor-diagnostics*'
      - 'scripts/dev/**'
      - 'uv.lock'
      - '.github/workflows/native-demo.yml'
  push:
    branches: [main, sathish, ramkrsna1]
    paths: *native_paths
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.12.20'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Ensure GNU C++20 toolchain on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command g++ -ErrorAction SilentlyContinue)) {
            choco install mingw --yes --no-progress
            if ($LASTEXITCODE) { throw 'MinGW installation failed' }
            $env:PATH = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ';' + [Environment]::GetEnvironmentVariable('Path', 'User') + ';' + $env:PATH
          }
          $compilerPath = (Get-Command g++ -ErrorAction Stop).Source
          (Split-Path $compilerPath) | Out-File -FilePath $env:GITHUB_PATH -Append
          "SOCRAT_CPP_COMPILER=$compilerPath" | Out-File -FilePath $env:GITHUB_ENV -Append
          g++ --version
      - name: Ensure GNU C++20 toolchain on Linux
        if: runner.os == 'Linux'
        run: |
          command -v g++ || (sudo apt-get update && sudo apt-get install -y g++)
          g++ --version
      - run: uv sync --frozen
      - run: npm ci
      - name: Prepare native test and stack directories
        run: python -c "from pathlib import Path; Path('.cache').mkdir(exist_ok=True)"
      - run: node --experimental-strip-types --test tests/editor-diagnostics.test.mjs
      - run: uv run pytest services/api/tests/test_local_backend.py services/api/tests/test_execution_worker.py --basetemp=.cache/ci-native-tests
      # The v1 demo journeys (playwright.demo.config.ts) and reference bundles (scripts/demo/) were
      # removed with the v2 backend; learner journeys run in ci.yml (npm run test:e2e). This job
      # proves the native stack itself boots and serves on each OS.
      - name: Verify native Windows stack
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .cache | Out-Null
          ./scripts/dev/doctor.ps1
          $process = Start-Process -FilePath (Get-Command node).Source -ArgumentList 'scripts/dev/run-demo.mjs' -WindowStyle Hidden -PassThru -RedirectStandardOutput .cache/ci-stack.log -RedirectStandardError .cache/ci-stack-error.log
          try {
            $deadline = (Get-Date).AddMinutes(10)
            do {
              try { $ready = (Invoke-WebRequest http://localhost:3000 -UseBasicParsing -TimeoutSec 5).StatusCode -eq 200 } catch { $ready = $false }
              if ((Get-Date) -gt $deadline) { Get-Content .cache/ci-stack-error.log; throw 'Native stack health failed' }
              if ($process.HasExited) { Get-Content .cache/ci-stack-error.log; throw 'Native stack exited' }
              Start-Sleep -Seconds 2
            } until ($ready)
            $api = Invoke-RestMethod http://127.0.0.1:8000/api/health/ready -TimeoutSec 10
            if ($api.status -ne 'ready') { Get-Content .cache/ci-stack-error.log; throw 'Native API is not ready' }
          } finally {
            # Cleanup is best effort: taskkill can fail on one already-exiting child, and its exit
            # code must not become this step's result after the checks above passed.
            if (-not $process.HasExited) { taskkill.exe /PID $process.Id /T /F; $global:LASTEXITCODE = 0 }
          }
      - name: Start native Linux stack
        if: runner.os == 'Linux'
        run: |
          bash scripts/dev/doctor.sh
          bash scripts/dev/start-demo.sh >.cache/ci-stack.log 2>&1 &
          echo $! >.cache/ci-stack.pid
          for n in $(seq 1 600); do curl -fsS http://localhost:3000 >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://localhost:3000 >/dev/null || { cat .cache/ci-stack.log; exit 1; }
          curl -fsS http://127.0.0.1:8000/api/health/ready | grep -q '"ready"' || { cat .cache/ci-stack.log; exit 1; }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-demo-${{ runner.os }}
          include-hidden-files: true
          path: |
            .cache/*stack*.log
            .cache/native-*.log
