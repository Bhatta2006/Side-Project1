name: tutor-eval-nightly

# Real tutor turns against the configured provider, graded by deterministic rules (no leaks,
# no invented links, never claiming a plan change, adapts to stuck and cruising learners).
# A prompt, model or tool change that regresses the tutor shows up here the next morning.
on:
  schedule:
    - cron: "07 4 * * *"  # daily 04:07 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tutor:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Forks and clones without the secret skip instead of failing.
    if: ${{ vars.TUTOR_EVAL_PROVIDER != '' }}
    env:
      SOCRAT_AI_PROVIDER: ${{ vars.TUTOR_EVAL_PROVIDER }}
      SOCRAT_AI_MODEL: ${{ vars.TUTOR_EVAL_MODEL }}
      SOCRAT_ANTHROPIC_API_KEY: ${{ secrets.TUTOR_EVAL_ANTHROPIC_KEY }}
      SOCRAT_OPENAI_API_KEY: ${{ secrets.TUTOR_EVAL_OPENAI_KEY }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: "0.12.20"
      - run: uv sync --frozen
      - name: Build course content
        run: uv run python scripts/content/build.py
      - name: Run the tutor scenarios
        run: uv run python scripts/evals/tutor_eval.py --require-provider --json | tee tutor-eval.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tutor-eval-report
          path: tutor-eval.json
