name: continuous-integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request replaces its running checks. Every push to main has its own
# group, so none is cancelled or dropped from the queue and each one reaches the deploy.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The checks run side by side instead of one after another. Branch protection requires the
# `secret-scan` and `verify` checks, so `verify` is the gate that waits for all the others.
jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/python-env
      - run: uv run ruff format --check services/api services/execution
      - run: uv run ruff check services/api services/execution
      - run: uv run mypy services/api/src services/execution/src

  content:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/python-env
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Validate authored content atoms in Python, C++20 and Java
        run: uv run python scripts/content/validate_atoms.py
      - name: Verify generated quiz items in Python, C++20 and Java
        run: uv run python scripts/content/validate_quiz.py --check
      - name: Lint pattern packs and run their templates
        run: uv run python scripts/content/lint_patterns.py

  tests:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/python-env
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: ./.github/actions/node-env
      # Needed by the explainer browser-checker tests (services/api), not only by e2e.
      - run: npx playwright install --with-deps chromium
      - name: Start the CI database
        run: docker compose up --detach --wait postgres
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor, which Chromium's
      # sandbox needs. The playground checker keeps its sandbox on, so allow them here rather
      # than launching Chromium without it.
      - name: Allow Chromium's sandbox for the playground browser check
        run: |
          if [ -e /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
      # Judge tests are generated from each problem's reference solution into the untracked
      # .cache/content-tests; the catalog refuses to load without them.
      - name: Build course content and judge tests
        run: uv run python scripts/content/build.py
      - run: uv run pytest --cov=socrat --cov-report=term-missing --cov-fail-under=85
        env:
          SOCRAT_TEST_POSTGRES_URL: postgresql+psycopg://socrat:ci-only-password@127.0.0.1:5432/socrat
      - run: uv run alembic upgrade head
        env:
          SOCRAT_DATABASE_URL: postgresql+psycopg://socrat:ci-only-password@127.0.0.1:5432/socrat
      - name: Stop the CI database
        if: always()
        run: docker compose down --volumes --remove-orphans

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/node-env
      - run: npm run typecheck
      - run: npm run build
      - name: First-load JS budget per route (gzip)
        run: node scripts/web/bundle-report.mjs --budget-kb 250
      - run: npm run test:m0
      # scripts/validation/test-m0-contracts.ps1 is not run here: it checks the M0 delivery docs,
      # which the v2 rewrite moved to docs/archive/, and ~200 links those moves broke. Re-enable it
      # once the docs and their links are reconciled.

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: ./.github/actions/python-env
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "24"
      - run: uv run pip-audit
      - run: npm audit --audit-level=high # reads package-lock.json, so no install is needed

  # Pull requests prove the Dockerfiles still build. On main the publish job builds the same
  # images for the deploy target, so building them here as well would only repeat the work.
  images:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: services/api/Dockerfile
          tags: socrat-api:ci
          cache-from: type=gha,scope=ci-api
          cache-to: type=gha,mode=max,scope=ci-api
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: apps/web/Dockerfile
          tags: socrat-web:ci
          cache-from: type=gha,scope=ci-web
          cache-to: type=gha,mode=max,scope=ci-web

  # Infra checks only run when infra files changed; otherwise this job ends after the diff.
  infra:
    runs-on: ubuntu-latest
    env:
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Detect infra and operations changes
        id: infra
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          changed=true
          if [[ -n "$base" ]] && git fetch --depth=1 origin "$base" 2>/dev/null; then
            git diff --quiet "$base" HEAD -- infra scripts/operations docker-compose.yml && changed=false
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        if: steps.infra.outputs.changed == 'true'
        with:
          terraform_version: "1.16.4"
      - uses: ./.github/actions/python-env
        if: steps.infra.outputs.changed == 'true'
      - name: Start the CI database
        if: steps.infra.outputs.changed == 'true'
        run: docker compose up --detach --wait postgres
      - name: Migrate the CI database
        if: steps.infra.outputs.changed == 'true'
        run: uv run alembic upgrade head
        env:
          SOCRAT_DATABASE_URL: postgresql+psycopg://socrat:ci-only-password@127.0.0.1:5432/socrat
      - name: Exercise PostgreSQL backup and restore
        if: steps.infra.outputs.changed == 'true'
        shell: bash
        run: |
          archive="$(bash scripts/operations/backup-postgres.sh --output-directory .cache/ci-backups)"
          bash scripts/operations/restore-smoke.sh --archive "$archive"
      - name: Create non-secret staging validation fixtures
        if: steps.infra.outputs.changed == 'true'
        shell: bash
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.cache/ci-secrets"
          printf '%s' 'ci-database-password' > "$GITHUB_WORKSPACE/.cache/ci-secrets/postgres_password"
          printf '%s' 'ci-session-secret-at-least-thirty-two-characters' > "$GITHUB_WORKSPACE/.cache/ci-secrets/session_secret"
          printf '%s' 'ci-oidc-client-secret' > "$GITHUB_WORKSPACE/.cache/ci-secrets/oidc_client_secret"
          printf '%s' 'ci-metrics-token' > "$GITHUB_WORKSPACE/.cache/ci-secrets/metrics_token"
          printf '%s' 'ci-grafana-password' > "$GITHUB_WORKSPACE/.cache/ci-secrets/grafana_admin_password"
      - name: Validate the staging Compose model
        if: steps.infra.outputs.changed == 'true'
        env:
          SOCRAT_API_IMAGE: ghcr.io/bhatta2006/socrat-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SOCRAT_WEB_IMAGE: ghcr.io/bhatta2006/socrat-web@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          SOCRAT_SECRETS_DIR: ${{ github.workspace }}/.cache/ci-secrets
          STAGING_HOST: staging.example.test
          TLS_EMAIL: operations@example.test
          SOCRAT_OIDC_ISSUER: https://identity.example.test
          SOCRAT_OIDC_CLIENT_ID: ci-client
        run: docker compose -f infra/runtime/staging/compose.yaml config --quiet
      - name: Validate the production Compose model
        if: steps.infra.outputs.changed == 'true'
        env:
          SOCRAT_API_IMAGE: ghcr.io/example/socrat-api@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          SOCRAT_WEB_IMAGE: ghcr.io/example/socrat-web@sha256:bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          SOCRAT_EXPLAINER_IMAGE: ghcr.io/example/socrat-explainer@sha256:cccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccccc
          SOCRAT_SECRETS_DIR: ${{ github.workspace }}/.cache/ci-secrets
          APP_HOST: app.example.test
          SANDBOX_HOST: visuals.example.invalid
          TLS_EMAIL: operations@example.test
          SOCRAT_OIDC_ISSUER: https://identity.example.test
          SOCRAT_OIDC_CLIENT_ID: ci-client
        run: |
          printf '%s' 'ci-ai-key' > "$GITHUB_WORKSPACE/.cache/ci-secrets/ai_api_key"
          printf '%s' 'ci-explainer-checker-secret-0123456789' > "$GITHUB_WORKSPACE/.cache/ci-secrets/explainer_checker_secret"
          docker compose -f infra/runtime/production/compose.yaml config --quiet
          docker run --rm --env APP_HOST=app.example.test --env SANDBOX_HOST=visuals.example.invalid --env TLS_EMAIL=operations@example.test             --volume "$PWD/infra/runtime/production/Caddyfile:/etc/caddy/Caddyfile:ro"             caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b             caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          bash -n scripts/operations/deploy-production.sh
      - name: Validate Prometheus configuration and alert rules
        if: steps.infra.outputs.changed == 'true'
        shell: bash
        run: |
          docker run --rm \
            --entrypoint /bin/promtool \
            --volume "$PWD/infra/runtime/staging:/etc/prometheus:ro" \
            --volume "$PWD/.cache/ci-secrets:/run/secrets:ro" \
            prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e \
            check config /etc/prometheus/prometheus.yml
          docker run --rm \
            --entrypoint /bin/promtool \
            --volume "$PWD/infra/runtime/staging:/etc/prometheus:ro" \
            prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e \
            check rules /etc/prometheus/alerts.yml
      - name: Validate the TLS reverse-proxy configuration
        if: steps.infra.outputs.changed == 'true'
        run: >-
          docker run --rm
          --env STAGING_HOST=staging.example.test
          --env TLS_EMAIL=operations@example.test
          --volume "${{ github.workspace }}/infra/runtime/staging/Caddyfile:/etc/caddy/Caddyfile:ro"
          caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - run: terraform fmt -check -recursive infra/oci
        if: steps.infra.outputs.changed == 'true'
      - run: terraform -chdir=infra/oci/environments/staging init -backend=false
        if: steps.infra.outputs.changed == 'true'
      - run: terraform -chdir=infra/oci/environments/staging validate
        if: steps.infra.outputs.changed == 'true'
      - run: terraform -chdir=infra/oci/modules/staging-foundation init -backend=false
        if: steps.infra.outputs.changed == 'true'
      - run: terraform -chdir=infra/oci/modules/staging-foundation test
        if: steps.infra.outputs.changed == 'true'
      - name: Stop the CI database
        if: always() && steps.infra.outputs.changed == 'true'
        run: docker compose down --volumes --remove-orphans

  # The one check branch protection asks for: green only when every check above is green.
  verify:
    if: always()
    needs: [lint, content, tests, web, audit, images, infra]
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed (the images check is skipped on main)
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "A required check did not pass: ${{ join(needs.*.result, ', ') }}" >&2
          exit 1

  # Images are only built from a commit whose checks passed. The three builds run side by side.
  publish-images:
    # The images job is skipped on main, and a skipped job anywhere up the chain skips everything
    # below it unless the condition names the results it needs. So `always()` plus explicit results.
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main'
      && needs.secret-scan.result == 'success' && needs.verify.result == 'success'
    needs: [secret-scan, verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: services/api/Dockerfile
          - name: web
            file: apps/web/Dockerfile
            # Baked into the CSP frame-src of the web app: the Playground sandbox host for this deployment.
            args: NEXT_PUBLIC_EXPLAINER_SANDBOX_ORIGIN=${{ vars.SOCRAT_SANDBOX_ORIGIN || 'https://socrat.dathcodes.dev' }}
          - name: explainer
            file: services/explainer/Dockerfile
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Resolve the lowercase image namespace
        id: owner
        run: echo "name=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish the ${{ matrix.name }} image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/arm64  # Oracle Ampere (ARM) is the only deploy target
          push: true
          build-args: ${{ matrix.args }}
          tags: ghcr.io/${{ steps.owner.outputs.name }}/socrat-${{ matrix.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=publish-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=publish-${{ matrix.name }}
      # GitHub artifact attestations are unavailable for private, user-owned repositories.
      # Keep image publishing enabled there and attest images when the repository is public.
      - name: Attest the ${{ matrix.name }} image
        if: ${{ github.event.repository.private == false }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/${{ steps.owner.outputs.name }}/socrat-${{ matrix.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
