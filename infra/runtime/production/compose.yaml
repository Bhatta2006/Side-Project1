name: socrat

# Single-host production runtime for an Oracle Cloud VM (Ampere A1 or AMD).
# Derived from the reviewed staging runtime: immutable image references, private back-end network,
# secrets mounted as files, one-shot migrations, health-gated ingress. Additions over staging:
# the visual checker (Playground), the AI provider, and a second public host for sandboxed frames.
# Code execution stays disabled here: it needs the separate gVisor runner host (infra/execution).

x-logging: &bounded-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-database-environment: &database-environment
  SOCRAT_DATABASE_HOST: postgres
  SOCRAT_DATABASE_PORT: "5432"
  SOCRAT_DATABASE_NAME: socrat
  SOCRAT_DATABASE_USER: socrat
  SOCRAT_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password

services:
  postgres:
    image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    environment:
      POSTGRES_DB: socrat
      POSTGRES_USER: socrat
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U socrat -d socrat"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 2G }
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logging

  migrate:
    image: "${SOCRAT_API_IMAGE:?Set SOCRAT_API_IMAGE to the published ghcr.io API image}"
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    environment: *database-environment
    secrets:
      - postgres_password
    networks:
      - backend
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    logging: *bounded-logging

  api:
    image: "${SOCRAT_API_IMAGE:?Set SOCRAT_API_IMAGE to the published ghcr.io API image}"
    restart: unless-stopped
    environment: &api-environment
      <<: *database-environment
      SOCRAT_ENVIRONMENT: production
      SOCRAT_PUBLIC_ORIGIN: "https://${APP_HOST:?Set APP_HOST to the owned application DNS name}"
      SOCRAT_DEV_LOGIN_ENABLED: "false"
      SOCRAT_SESSION_SECRET_FILE: /run/secrets/session_secret
      SOCRAT_OIDC_ISSUER: "${SOCRAT_OIDC_ISSUER:?Set the OIDC issuer URL}"
      SOCRAT_OIDC_CLIENT_ID: "${SOCRAT_OIDC_CLIENT_ID:?Set the OIDC client ID}"
      SOCRAT_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
      SOCRAT_METRICS_TOKEN_FILE: /run/secrets/metrics_token
      SOCRAT_CONTENT_ADMIN_IDENTITIES: "${SOCRAT_CONTENT_ADMIN_IDENTITIES:-[]}"
      SOCRAT_ADMIN_SUBJECTS: "${SOCRAT_ADMIN_SUBJECTS:-[]}"
      SOCRAT_ONBOARDING_ENABLED: "true"
      SOCRAT_DIAGNOSTICS_ENABLED: "true"
      SOCRAT_PLANNING_ENABLED: "true"
      SOCRAT_LEARNING_SESSIONS_ENABLED: "true"
      SOCRAT_ASSESSMENTS_ENABLED: "true"
      SOCRAT_DASHBOARD_ENABLED: "true"
      SOCRAT_REMINDERS_ENABLED: "true"
      SOCRAT_TUTOR_ENABLED: "true"
      SOCRAT_TUTOR_MODEL_ENABLED: "${SOCRAT_TUTOR_MODEL_ENABLED:-false}"
      SOCRAT_TUTOR_ADVISOR_SHADOW_ENABLED: "false"
      SOCRAT_EXECUTION_ENABLED: "false"
      # Python and C++ run in the learner's browser and are judged here by output digest.
      SOCRAT_BROWSER_RUNTIMES: '${SOCRAT_BROWSER_RUNTIMES:-["python","cpp"]}'
      # AI provider (any OpenAI-compatible endpoint, or anthropic). The key is a mounted file.
      SOCRAT_AI_PROVIDER: "${SOCRAT_AI_PROVIDER:-openai}"
      SOCRAT_OPENAI_BASE_URL: "${SOCRAT_OPENAI_BASE_URL:-}"
      SOCRAT_OPENAI_MODEL: "${SOCRAT_OPENAI_MODEL:-}"
      SOCRAT_OPENAI_API_KEY_FILE: /run/secrets/ai_api_key
      SOCRAT_AI_TIMEOUT_SECONDS: "${SOCRAT_AI_TIMEOUT_SECONDS:-60}"
      # LLM cost guardrails: SOCRAT_AI_ENABLED=false is the kill switch. Set the prices to your
      # provider's per-million-token prices so budgets and the /admin spend card are accurate.
      # Defaults: GPT-5.4 mini ($0.75 input, $4.50 output).
      SOCRAT_AI_ENABLED: "${SOCRAT_AI_ENABLED:-true}"
      SOCRAT_SENTRY_DSN: "${SOCRAT_SENTRY_DSN:-}"
      SOCRAT_RELEASE: "${SOCRAT_RELEASE:-}"
      SOCRAT_AI_PRICE_INPUT_PER_MTOK: "${SOCRAT_AI_PRICE_INPUT_PER_MTOK:-0.75}"
      SOCRAT_AI_PRICE_OUTPUT_PER_MTOK: "${SOCRAT_AI_PRICE_OUTPUT_PER_MTOK:-4.5}"
      SOCRAT_AI_USER_DAILY_BUDGET_USD: "${SOCRAT_AI_USER_DAILY_BUDGET_USD:-0.5}"
      SOCRAT_AI_DAILY_BUDGET_USD: "${SOCRAT_AI_DAILY_BUDGET_USD:-25}"
      SOCRAT_AI_MONTHLY_BUDGET_USD: "${SOCRAT_AI_MONTHLY_BUDGET_USD:-400}"
      # Playground (AI visual explainer): frames are served from a second, unrelated registrable domain.
      SOCRAT_EXPLAINER_ENABLED: "${SOCRAT_EXPLAINER_ENABLED:-true}"
      SOCRAT_EXPLAINER_MODEL: "${SOCRAT_EXPLAINER_MODEL:-}"
      # vLLM/Nebius only (ignored for api.openai.com): a reasoning model there can spend the 12k-token
      # output limit thinking and truncate visuals; for Qwen3 set {"enable_thinking":false}.
      SOCRAT_EXPLAINER_CHAT_TEMPLATE_KWARGS: "${SOCRAT_EXPLAINER_CHAT_TEMPLATE_KWARGS:-{}}"
      SOCRAT_EXPLAINER_DAILY_MESSAGES: "${SOCRAT_EXPLAINER_DAILY_MESSAGES:-20}"
      SOCRAT_EXPLAINER_SANDBOX_ORIGIN: "https://${SANDBOX_HOST:?Set SANDBOX_HOST to a DNS name on a different registrable domain}"
      SOCRAT_EXPLAINER_CHECKER_URL: http://explainer-checker:8010/check
      SOCRAT_EXPLAINER_CHECKER_SECRET_FILE: /run/secrets/explainer_checker_secret
      # Paid plans (Razorpay Subscriptions). The key id is public; the secrets are mounted files.
      SOCRAT_BILLING_ENABLED: "${SOCRAT_BILLING_ENABLED:-false}"
      # Launch offer: the first N learners to reach the dashboard get Plus free for a month. 0 = off
      # (closed 2026-11-14 after the first 20 signups; grants already given run their 30 days).
      SOCRAT_LAUNCH_PROMO_SLOTS: "${SOCRAT_LAUNCH_PROMO_SLOTS:-0}"
      SOCRAT_LAUNCH_PROMO_DAYS: "${SOCRAT_LAUNCH_PROMO_DAYS:-30}"
      SOCRAT_RAZORPAY_KEY_ID: "${SOCRAT_RAZORPAY_KEY_ID:-}"
      SOCRAT_RAZORPAY_KEY_SECRET_FILE: /run/secrets/razorpay_key_secret
      SOCRAT_RAZORPAY_WEBHOOK_SECRET_FILE: /run/secrets/razorpay_webhook_secret
      # Email-and-password accounts: one-time codes are sent through Resend from a verified domain.
      SOCRAT_EMAIL_FROM: "${SOCRAT_EMAIL_FROM:-}"
      SOCRAT_RESEND_API_KEY_FILE: /run/secrets/resend_api_key
    secrets: &api-secrets
      - postgres_password
      - session_secret
      - oidc_client_secret
      - metrics_token
      - ai_api_key
      - explainer_checker_secret
      - razorpay_key_secret
      - razorpay_webhook_secret
      - resend_api_key
    networks:
      - backend
      # Outbound HTTPS for OIDC discovery and the AI provider. Not a destination allow-list.
      - egress
    depends_on:
      migrate:
        condition: service_completed_successfully
      explainer-checker:
        condition: service_healthy
    expose: ["8000"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready')"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits: { cpus: "1.50", memory: 3G }
    logging: *bounded-logging

  # Also runs Playground generations, so it shares the API's AI and checker configuration.
  worker:
    image: "${SOCRAT_API_IMAGE:?Set SOCRAT_API_IMAGE to the published ghcr.io API image}"
    command: ["python", "-m", "socrat.worker"]
    restart: unless-stopped
    environment:
      <<: *api-environment
      PYTHONPATH: services/api/src
    secrets: *api-secrets
    networks:
      - backend
      # Outbound HTTPS for the AI provider.
      - egress
    depends_on:
      migrate:
        condition: service_completed_successfully
      explainer-checker:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=32m,noexec,nosuid
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 512M }
    logging: *bounded-logging

  web:
    image: "${SOCRAT_WEB_IMAGE:?Set SOCRAT_WEB_IMAGE to the published ghcr.io web image}"
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
    networks:
      - backend
    depends_on:
      api:
        condition: service_healthy
    expose: ["3000"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000',{signal:AbortSignal.timeout(4000)}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
      - /app/apps/web/.next/cache:size=64m,noexec,nosuid
    cap_drop: ["ALL"]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 1G }
    logging: *bounded-logging

  # Headless browser that validates generated visuals. No outbound network: it only answers the API.
  explainer-checker:
    image: "${SOCRAT_EXPLAINER_IMAGE:?Set SOCRAT_EXPLAINER_IMAGE to the published ghcr.io checker image}"
    restart: unless-stopped
    init: true
    shm_size: 256mb
    environment:
      SOCRAT_EXPLAINER_CHECKER_SECRET_FILE: /run/secrets/explainer_checker_secret
      # Docker's default seccomp profile blocks the user namespaces Chromium's own sandbox needs, so
      # the browser cannot launch with it on. The container is the boundary here.
      SOCRAT_EXPLAINER_NO_SANDBOX: "1"
    secrets:
      - explainer_checker_secret
    networks:
      - backend
    expose: ["8010"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8010/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits: { cpus: "1.00", memory: 1G }
    logging: *bounded-logging

  caddy:
    image: caddy:2.11.4-alpine@sha256:6aeddd44c3078b0f9a35206472a11420648a79c184603ef95957d0a20044cb2b
    restart: unless-stopped
    environment:
      APP_HOST: "${APP_HOST:?Set APP_HOST}"
      SANDBOX_HOST: "${SANDBOX_HOST:?Set SANDBOX_HOST}"
      TLS_EMAIL: "${TLS_EMAIL:?Set TLS_EMAIL for certificate expiry notices}"
    ports:
      - 80:80
      - 443:443
      - 443:443/udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - edge
      - backend
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q --spider --no-check-certificate --header=Host:$${APP_HOST} https://127.0.0.1/api/health/live"
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["NET_BIND_SERVICE"]
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits: { cpus: "0.50", memory: 256M }
    logging: *bounded-logging

secrets:
  postgres_password:
    file: "${SOCRAT_SECRETS_DIR:?Set SOCRAT_SECRETS_DIR}/postgres_password"
  session_secret:
    file: "${SOCRAT_SECRETS_DIR:?Set SOCRAT_SECRETS_DIR}/session_secret"
  oidc_client_secret:
    file: "${SOCRAT_SECRETS_DIR:?Set SOCRAT_SECRETS_DIR}/oidc_client_secret"
  metrics_token:
    file: "${SOCRAT_SECRETS_DIR:?Set SOCRAT_SECRETS_DIR}/metrics_token"
  ai_api_key:
    file: "${SOCRAT_SECRETS_DIR:?Set SOCRAT_SECRETS_DIR}/ai_api_key"
  explainer_checker_secret:
    file: "${SOCRAT_SECRETS_DIR:?Set SOCRAT_SECRETS_DIR}/explainer_checker_secret"
  razorpay_key_secret:
    file: "${SOCRAT_SECRETS_DIR:?Set SOCRAT_SECRETS_DIR}/razorpay_key_secret"
  razorpay_webhook_secret:
    file: "${SOCRAT_SECRETS_DIR:?Set SOCRAT_SECRETS_DIR}/razorpay_webhook_secret"
  resend_api_key:
    file: "${SOCRAT_SECRETS_DIR:?Set SOCRAT_SECRETS_DIR}/resend_api_key"

networks:
  edge:
  egress:
    driver: bridge
  backend:
    internal: true

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
