items:
- id: foundation-1
  band: 1
  pool: practice
  prompt: A while condition is false before the first iteration. How many times does its body run?
  options:
  - '0'
  - '1'
  - '2'
  - Forever
  answer: 0
  explanation: A while loop checks its condition before executing its body.
- id: foundation-2
  band: 1
  pool: practice
  prompt: A counter starts at 0. While it is less than 3, the body increases it by 1. What is its value
    when the loop ends?
  options:
  - '3'
  - '2'
  - '4'
  - '0'
  answer: 0
  explanation: The loop visits starting counter values 0, 1 and 2, then stops with the counter at 3.
- id: foundation-3
  band: 2
  pool: practice
  prompt: A loop should stop when a counter reaches 5. Which change can prevent termination?
  options:
  - "Removing the counter update while its condition stays true"
  - "Checking the loop condition before every single iteration"
  - "Starting the counter at some value that is below 5"
  - "Increasing the counter by one each time toward 5"
  answer: 0
  explanation: Without an update or another exit, a true condition can remain true forever.
- id: foundation-4
  band: 2
  pool: practice
  prompt: A loop removes one item while a queue is nonempty. Starting with 4 items and adding none, how
    many removals occur?
  options:
  - '4'
  - '3'
  - '5'
  - '0'
  answer: 0
  explanation: Each iteration removes one of the four items and the empty queue stops the loop.
