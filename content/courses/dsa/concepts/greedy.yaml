id: greedy
title: Greedy algorithms
summary: Make the locally best choice at each step — and learn to prove when that is globally optimal.
module: ordering
prerequisites: [sorting, intervals]
difficulty: 4
estimated_minutes: 55
lesson: |
  ## The big idea

  A **greedy algorithm** builds a solution step by step, always taking the choice that
  looks best right now, and never reconsidering. When it works, it is simple and fast
  (often "sort, then one pass"). The catch: greedy is frequently **wrong**, so the real
  skill is knowing *why* a greedy choice is safe.

  ## Example: activity selection

  Choose the maximum number of non-overlapping meetings. Candidate greedy rules:

  - shortest meeting first? ✗ (a short meeting can block two others)
  - earliest start first? ✗ (an early, very long meeting blocks everything)
  - **earliest end first** ✓

  ```python
  def max_meetings(meetings):
      meetings.sort(key=lambda m: m[1])     # by end time
      count, last_end = 0, float("-inf")
      for start, end in meetings:
          if start >= last_end:             # compatible with what we kept
              count += 1
              last_end = end
      return count
  ```

  ```cpp
  int maxMeetings(vector<pair<long long,long long>> m) {   // (start, end)
      sort(m.begin(), m.end(), [](auto& a, auto& b) { return a.second < b.second; });
      int count = 0;
      long long lastEnd = LLONG_MIN;
      for (auto [s, e] : m) if (s >= lastEnd) { count++; lastEnd = e; }
      return count;
  }
  ```

  ```java
  static int maxMeetings(long[][] m) {                    // {start, end}
      Arrays.sort(m, (a, b) -> Long.compare(a[1], b[1]));
      int count = 0;
      long lastEnd = Long.MIN_VALUE;
      for (long[] x : m) if (x[0] >= lastEnd) { count++; lastEnd = x[1]; }
      return count;
  }
  ```

  ## Proving it: the exchange argument

  Take any optimal schedule. Its first meeting ends no earlier than the meeting with the
  earliest end, so **swap** it for that meeting — the schedule stays valid and the same
  size. Repeat for the rest. So greedy is never worse than optimal. This "exchange"
  argument is the standard way to justify greedy in interviews.

  ## Example: can you reach the end?

  Jump Game — each position `i` lets you jump up to `a[i]` steps. Track the **farthest
  reachable index** while scanning; if you ever stand beyond it, you are stuck.

  ## When greedy fails

  Coin change with coins {1, 3, 4} for amount 6: greedy takes 4 + 1 + 1 (three coins), but
  3 + 3 uses two. When local choices can block better global ones, you need **dynamic
  programming**. A quick way to test a greedy idea is to brute-force tiny cases and compare.

  ## Signals that greedy might work

  - "Maximum number of ..." with a natural ordering (end time, deadline, size).
  - Choices that never make future options worse (exchange argument possible).
  - Problems that become obvious after sorting.

  ## Worked walkthrough

  Schedule intervals (1,3), (2,5), (4,6). Choosing finish 3 permits the interval beginning at 4, yielding two. A rule such as longest-first has no equivalent guarantee. Search for a tiny counterexample whenever a local rule has no proof.

  ### Why this works

  An exchange proof replaces a choice in an optimal solution with the greedy choice without reducing quality or feasibility. Repeat that argument for the remaining decisions.

  ### Boundary cases and cost

  Coins [1,3,4] and target 6 disprove largest-coin-first: 4+1+1 loses to 3+3. Greedy needs structural assumptions.

  Many greedy methods sort and cost O(n log n). Their complexity follows their operations, not the greedy label.

  ### Check your understanding

  What must stay true during an exchange argument?

  Try it on paper before reading the reasoning below.

  > Remaining choices must remain feasible and the objective must be no worse. Otherwise the exchange proves nothing.

key_points:
  - Greedy takes the locally best choice and never reconsiders.
  - Usually - sort by the right key, then one pass.
  - Justify with an exchange argument — swapping into the greedy choice never hurts.
  - Test greedy ideas against brute force on small cases; if it fails, think DP.
pitfalls:
  - Picking an intuitive but wrong ordering (shortest, earliest start).
  - Assuming greedy works for general coin systems.
  - Skipping the proof and missing a counterexample.
