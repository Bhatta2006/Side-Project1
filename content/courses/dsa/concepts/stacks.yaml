quiz:
  - id: lifo
    kind: mcq
    prompt: 'Starting empty: push 1, push 2, push 3, pop, push 4, pop. What is now on top of the stack?'
    options:
    - '2'
    - '4'
    - '3'
    - '1'
    answer: 0
    explanation: After the pushes the stack is 1 2 3. The first pop removes 3, push 4 gives 1 2 4, the second
      pop removes 4. The top is 2.
    difficulty: 1
  - id: bracket-output
    kind: output
    prompt: What does this bracket checker print for "([)]" (1 means balanced, 0 means not)?
    code:
      python: "s = \"([)]\"\npairs = {\")\": \"(\", \"]\": \"[\"}\nst = []\nok = 1\nfor ch in s:\n    if\
        \ ch in \"([\":\n        st.append(ch)\n    elif not st or st.pop() != pairs[ch]:\n        ok =\
        \ 0\n        break\nprint(ok)\n"
      cpp: "string s = \"([)]\";\nstack<char> st;\nint ok = 1;\nfor (char ch : s) {\n    if (ch == '(' ||\
        \ ch == '[') st.push(ch);\n    else {\n        char need = ch == ')' ? '(' : '[';\n        if (st.empty()\
        \ || st.top() != need) { ok = 0; break; }\n        st.pop();\n    }\n}\ncout << ok;\n"
      java: "String s = \"([)]\";\nDeque<Character> st = new ArrayDeque<>();\nint ok = 1;\nfor (char ch\
        \ : s.toCharArray()) {\n    if (ch == '(' || ch == '[') st.push(ch);\n    else {\n        char need\
        \ = ch == ')' ? '(' : '[';\n        if (st.isEmpty() || st.peek() != need) { ok = 0; break; }\n\
        \        st.pop();\n    }\n}\nSystem.out.println(ok);\n"
    options:
    - '0'
    - '1'
    - '2'
    - '-1'
    answer: 0
    explanation: ( and [ are pushed. The ) then finds [ on top, which is the wrong opener, so the string
      is not balanced even though the counts match.
    difficulty: 2
  - id: rpn-output
    kind: output
    prompt: What does this postfix (RPN) evaluator print?
    code:
      python: "tokens = [\"10\", \"6\", \"-\", \"2\", \"*\"]\nst = []\nfor t in tokens:\n    if t in \"\
        +-*\":\n        b = st.pop()\n        a = st.pop()\n        st.append(a + b if t == \"+\" else a\
        \ - b if t == \"-\" else a * b)\n    else:\n        st.append(int(t))\nprint(st[0])\n"
      cpp: "vector<string> tokens = {\"10\", \"6\", \"-\", \"2\", \"*\"};\nstack<int> st;\nfor (auto& t\
        \ : tokens) {\n    if (t == \"+\" || t == \"-\" || t == \"*\") {\n        int b = st.top(); st.pop();\n\
        \        int a = st.top(); st.pop();\n        st.push(t == \"+\" ? a + b : t == \"-\" ? a - b :\
        \ a * b);\n    } else st.push(stoi(t));\n}\ncout << st.top();\n"
      java: "String[] tokens = {\"10\", \"6\", \"-\", \"2\", \"*\"};\nDeque<Integer> st = new ArrayDeque<>();\n\
        for (String t : tokens) {\n    if (t.equals(\"+\") || t.equals(\"-\") || t.equals(\"*\")) {\n  \
        \      int b = st.pop();\n        int a = st.pop();\n        st.push(t.equals(\"+\") ? a + b : t.equals(\"\
        -\") ? a - b : a * b);\n    } else st.push(Integer.parseInt(t));\n}\nSystem.out.println(st.peek());\n"
    options:
    - '8'
    - −8
    - '14'
    - −4
    answer: 0
    explanation: 10 6 − gives 4 (the first popped value b is the right operand, a the left). Then 4 · 2
      = 8. Swapping a and b would give −4 for the subtraction and −8 overall.
    difficulty: 3
  - id: amortized
    kind: mcq
    prompt: The monotonic-stack 'next greater element' has a while loop inside a for loop. Why is it O(n)
      overall?
    options:
    - Each index is pushed once and popped at most once, so total pops are at most n
    - The inner while loop runs at most once per outer step of the for loop
    - The array is sorted first, so every pop is a constant-time operation
    - It is O(n²) in the worst case; the nesting cannot be avoided at all
    answer: 0
    explanation: A single iteration can pop many elements, but the pops across all iterations cannot exceed
      the pushes. Amortised, each index costs O(1).
    difficulty: 3
  - id: min-stack
    kind: mcq
    prompt: A min-stack supports push, pop and getMin in O(1) by storing (value, minimum so far) on each
      push. Push 5, 3, 7, 3, then pop twice, then getMin. What is returned?
    options:
    - '3'
    - '5'
    - '7'
    - 'No minimum: the stack is empty'
    answer: 0
    explanation: After the pops, the stack holds 5 and 3, whose stored minimum entries are 5 and 3. The
      top entry says the minimum is 3. Each element remembers the minimum of everything beneath it.
    difficulty: 3
  - id: nge-output
    kind: output
    prompt: What does this next-greater-element code print (−1 when none exists)?
    code:
      python: "a = [2, 1, 2, 4, 3]\nres = [-1] * len(a)\nst = []\nfor i, x in enumerate(a):\n    while st\
        \ and a[st[-1]] < x:\n        res[st.pop()] = x\n    st.append(i)\nprint(*res)\n"
      cpp: "int a[5] = {2, 1, 2, 4, 3};\nint res[5] = {-1, -1, -1, -1, -1};\nvector<int> st;\nfor (int i\
        \ = 0; i < 5; i++) {\n    while (!st.empty() && a[st.back()] < a[i]) { res[st.back()] = a[i]; st.pop_back();\
        \ }\n    st.push_back(i);\n}\nfor (int i = 0; i < 5; i++) cout << res[i] << (i < 4 ? \" \" : \"\"\
        );\n"
      java: "int[] a = {2, 1, 2, 4, 3};\nint[] res = {-1, -1, -1, -1, -1};\nDeque<Integer> st = new ArrayDeque<>();\n\
        for (int i = 0; i < 5; i++) {\n    while (!st.isEmpty() && a[st.peek()] < a[i]) res[st.pop()] =\
        \ a[i];\n    st.push(i);\n}\nStringBuilder sb = new StringBuilder();\nfor (int i = 0; i < 5; i++)\
        \ sb.append(res[i]).append(i < 4 ? \" \" : \"\");\nSystem.out.println(sb);\n"
    options:
    - 4 2 4 -1 -1
    - 4 2 4 -1 3
    - 2 2 4 4 -1
    - 4 -1 4 -1 -1
    answer: 0
    explanation: The 1 is popped by the 2 (so its answer is 2). The 4 pops both the second 2 and the first
      2. The 3 never meets a larger value. The equal 2 does not pop the first 2 because the test is strictly
      less.
    difficulty: 4
  - id: temperatures
    kind: mcq
    prompt: For daily temperatures [73, 74, 75, 71, 69, 72, 76, 73], how many days must you wait for a warmer
      day (0 if never)? Pick the full result.
    options:
    - 1 1 4 2 1 1 0 0
    - 1 1 3 2 1 1 0 0
    - 1 1 4 2 2 1 0 0
    - 1 2 4 2 1 1 0 0
    answer: 0
    explanation: Keep a stack of indices with decreasing temperatures. When a warmer day arrives, pop every
      colder index and record the index difference. The 75 waits 4 days for 76.
    difficulty: 4
  - id: monotonic-direction
    kind: mcq
    prompt: To find the next SMALLER element to the right for every index, which order does the stack (bottom
      to top) hold?
    options:
    - 'Values that are increasing: a smaller newcomer pops the larger tops and answers them'
    - 'Values that are decreasing: a smaller newcomer pushes on top of them'
    - All equal values, grouped together
    - Indices sorted descending, whatever the values
    answer: 0
    explanation: The stack keeps indices still waiting for a smaller value. A newcomer smaller than the
      top resolves it, so the waiting values must be in increasing order from bottom to top.
    difficulty: 4
  - id: largest-rectangle
    kind: mcq
    prompt: In the largest-rectangle-in-a-histogram method, when a bar is popped, how far does its rectangle
      extend?
    options:
    - From just after the new stack top to just before the current index, at the popped height
    - From index 0 to just before the current index, at the popped bar's height
    - Only over the popped bar itself, one unit wide, at the popped bar's height
    - From the popped bar to the last index of the array, at the popped bar's height
    answer: 0
    explanation: The new top is the nearest shorter bar on the left, and the current bar is the nearest
      shorter bar on the right. Everything strictly between them is at least as tall as the popped bar.
    difficulty: 5
  - id: leftover-openers
    kind: bug
    prompt: The string '(()' is NOT balanced because one opener is never closed. This checker reports a
      failure only when a closer meets an empty stack. What does it print?
    code:
      python: "s = \"(()\"\nst = []\nok = True\nfor ch in s:\n    if ch == \"(\":\n        st.append(ch)\n\
        \    elif st:\n        st.pop()\n    else:\n        ok = False\n        break\nprint(\"balanced\"\
        \ if ok else \"unbalanced\")\n"
      cpp: "string s = \"(()\";\nvector<char> st;\nbool ok = true;\nfor (char ch : s) {\n    if (ch == '(')\
        \ st.push_back(ch);\n    else if (!st.empty()) st.pop_back();\n    else { ok = false; break; }\n\
        }\ncout << (ok ? \"balanced\" : \"unbalanced\");\n"
      java: "String s = \"(()\";\nDeque<Character> st = new ArrayDeque<>();\nboolean ok = true;\nfor (char\
        \ ch : s.toCharArray()) {\n    if (ch == '(') st.push(ch);\n    else if (!st.isEmpty()) st.pop();\n\
        \    else { ok = false; break; }\n}\nSystem.out.println(ok ? \"balanced\" : \"unbalanced\");\n"
    options:
    - balanced
    - unbalanced
    - crashes
    - empty
    answer: 0
    explanation: After the loop one '(' is still on the stack. The final verdict must also require the stack
      to be EMPTY, otherwise strings with only extra openers are accepted.
    difficulty: 2
