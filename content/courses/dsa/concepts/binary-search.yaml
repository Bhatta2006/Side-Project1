id: binary-search
title: Binary search
summary: Halve the search space each step — on sorted arrays and on the answer itself.
module: linear-patterns
prerequisites: [complexity, arrays-hashing]
difficulty: 3
estimated_minutes: 60
lesson: |
  ## The big idea

  In a sorted array, look at the middle: if the target is larger, it must be in the right
  half; otherwise the left half. Each step discards half the remaining range, so a million
  elements need only ~20 steps: **O(log n)**.

  ## The one template to rely on

  Off-by-one bugs make binary search notorious. Avoid them with a single, precise
  template: **find the first index where a condition becomes true**, where the condition
  is false…false, true…true across the array.

  ```python
  def first_true(lo, hi, ok):
      # Smallest x in [lo, hi] with ok(x) true; returns hi + 1 if none.
      while lo <= hi:
          mid = (lo + hi) // 2
          if ok(mid):
              hi = mid - 1      # mid works; look for an earlier one
          else:
              lo = mid + 1      # mid fails; answer is to the right
      return lo

  # lower bound: first index with a[i] >= x
  i = first_true(0, len(a) - 1, lambda m: a[m] >= x)
  ```

  ```cpp
  // first index with a[i] >= x (returns n if none)
  int lowerBound(const vector<long long>& a, long long x) {
      int lo = 0, hi = (int)a.size() - 1;
      while (lo <= hi) {
          int mid = lo + (hi - lo) / 2;
          if (a[mid] >= x) hi = mid - 1; else lo = mid + 1;
      }
      return lo;
  }
  // The standard library does the same: lower_bound(a.begin(), a.end(), x) - a.begin()
  ```

  ```java
  // first index with a[i] >= x (returns n if none)
  static int lowerBound(long[] a, long x) {
      int lo = 0, hi = a.length - 1;
      while (lo <= hi) {
          int mid = lo + (hi - lo) / 2;
          if (a[mid] >= x) hi = mid - 1; else lo = mid + 1;
      }
      return lo;
  }
  ```

  Everything else derives from it:

  - **Exists?** `i < n and a[i] == x` after lower bound.
  - **Count of x** = (first index with `a[i] > x`) − (first index with `a[i] >= x`).
  - **Count ≤ x** = first index with `a[i] > x`.

  Use `mid = lo + (hi − lo) / 2` in C++/Java to avoid integer overflow.

  ## Binary search on the answer

  The most powerful version searches over **possible answers**, not array positions. It
  works when feasibility is **monotonic**: if speed `k` is fast enough, every faster speed
  is too.

  *Koko eats bananas*: piles must be finished in `h` hours at speed `k` per hour (each pile
  takes `ceil(pile / k)` hours). Find the minimum `k`.

  ```python
  def hours(piles, k):
      return sum((p + k - 1) // k for p in piles)

  k = first_true(1, max(piles), lambda k: hours(piles, k) <= h)
  ```

  Total time: O(n log(max)). Recognise this shape whenever a problem says "minimum value
  such that..." or "maximum value such that...".

  ## Rotated arrays

  In a sorted array rotated at an unknown pivot, at least one half around `mid` is always
  sorted; check whether the target lies inside that sorted half to decide which way to go.

  ## Worked walkthrough

  Find the first value at least 5 in [1,3,5,5,8] using [0,5). Probe index 2: it qualifies, so hi becomes 2. Probe index 1: it fails, so lo becomes 2. The bounds meet at the first matching index.

  ### Why this works

  The predicate is false before a boundary and true from that boundary onward. Each update preserves the possible boundary and strictly shrinks the interval. An arbitrary matching index is insufficient when the first occurrence is required.

  ### Boundary cases and cost

  Test empty, all-true and all-false ranges, duplicates and targets beyond both ends. A result of n is not an index you may read.

  There are O(log n) predicate evaluations. If each predicate scans n items, include that cost rather than calling the entire algorithm logarithmic.

  ### Check your understanding

  For [2,2,2], what are lower and upper bounds of 2?

  Try it on paper before reading the reasoning below.

  > Lower bound is 0 and upper bound is 3. Their difference is the count, three.

key_points:
  - Binary search halves the range each step — O(log n).
  - Use one template - the first index where a monotonic condition becomes true.
  - Lower/upper bounds give existence, counts and insertion positions.
  - Binary search on the answer when feasibility is monotonic.
  - mid = lo + (hi − lo) / 2 avoids overflow.
pitfalls:
  - Infinite loops from lo = mid instead of mid + 1.
  - Using it on unsorted data, or on a non-monotonic condition.
  - Forgetting the "not found" case (index n).
