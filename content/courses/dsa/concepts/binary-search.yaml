quiz:
  - id: steps
    kind: mcq
    prompt: About how many comparisons does binary search need for 1,000,000 sorted items?
    options: ["20", "1,000", "500,000", "1,000,000"]
    answer: 0
    explanation: 2^20 ≈ 10^6, so about 20 halvings.
    difficulty: 1
  - id: count-x
    kind: mcq
    prompt: How do you count occurrences of x in a sorted array with binary search?
    options:
      - "(first index with a[i] > x) − (first index with a[i] >= x)"
      - "Find x once with binary search and return 1 if it is present"
      - "Scan the whole array once and count every element equal to x"
      - "(last index of the array) − (first index with a[i] >= x)"
    answer: 0
    explanation: The two bounds bracket exactly the block of x values.
    difficulty: 2
  - id: answer-search
    kind: mcq
    prompt: Binary search on the answer requires feasibility to be...
    options: ["Monotonic (false...false then true...true)", "Random, as long as some answer is feasible", "Sorted by index, like the input array itself", "Always true for every value in the range"]
    answer: 0
    explanation: Only a monotonic condition lets you discard half the candidates safely.
    difficulty: 2
  - id: overflow
    kind: mcq
    prompt: In Java, why write mid = lo + (hi - lo) / 2 instead of (lo + hi) / 2?
    options: ["lo + hi can overflow int", "It is faster", "It rounds up", "It avoids negative indexes"]
    answer: 0
    explanation: For large lo and hi their sum can exceed 2^31 − 1.
    difficulty: 2
  - id: midpoint-overflow
    kind: mcq
    prompt: "In a language with fixed-size integers (like C++ or Java), why write mid = lo + (hi - lo) / 2?"
    options:
      - "Monotonic (false...false then true...true)"
      - "Random, as long as some answer is feasible"
      - "Sorted by index, like the input array itself"
      - "Always true for every value in the range"
    answer: 0
    explanation: "lo + hi can exceed the int range for large bounds; lo + (hi - lo) / 2 stays in range."
    difficulty: 4
  - id: infinite-search
    kind: bug
    prompt: "This search for the last x with ok(x) can loop forever. Why?"
    code:
      python: |
        while lo < hi:
            mid = (lo + hi) // 2
            if ok(mid):
                lo = mid
            else:
                hi = mid - 1
    options:
      - "When hi = lo + 1 and ok(lo), mid = lo and nothing changes"
      - "ok must be monotone decreasing, not increasing, for this loop"
      - "hi should start at n instead of n − 1, so the range is wrong"
      - "// should be /, because integer division loses the midpoint"
    answer: 0
    explanation: "Rounding down makes mid = lo; with lo = mid the interval never shrinks. Use mid = (lo + hi + 1) // 2."
    difficulty: 5
