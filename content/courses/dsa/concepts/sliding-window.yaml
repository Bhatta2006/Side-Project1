quiz:
  - id: fixed-update
    kind: mcq
    prompt: A fixed window of size k moves one step to the right. How should its running sum be updated?
    options:
    - Add the element that entered and subtract the element that left
    - Recompute the sum of all k elements in the window
    - Multiply the old sum by k and divide by k − 1
    - Add the entering element only; the leaving one is removed at the end
    answer: 0
    explanation: 'Two operations per step instead of k: total O(n) rather than O(nk).'
    difficulty: 1
  - id: left-moves
    kind: mcq
    prompt: In the expand-right, shrink-left template, how many times can the left pointer move in total
      over the whole array of n elements?
    options:
    - 'At most n times: it only moves forward'
    - Up to n² times, once per right step
    - About log n times, like a binary search
    - Exactly k times, where k is the window size
    answer: 0
    explanation: left never moves backwards and never passes right, so it advances at most n times overall.
      Together with n moves of right, the loop is O(n) even though a while sits inside a for.
    difficulty: 2
  - id: fixed-output
    kind: output
    prompt: What does this fixed-window code print?
    code:
      python: "a = [2, 1, 5, 1, 3, 2]\nk = 3\ns = sum(a[:k])\nbest = s\nfor i in range(k, len(a)):\n   \
        \ s += a[i] - a[i - k]\n    best = max(best, s)\nprint(best)\n"
      cpp: 'int a[6] = {2, 1, 5, 1, 3, 2};

        int k = 3, s = 0;

        for (int i = 0; i < k; i++) s += a[i];

        int best = s;

        for (int i = k; i < 6; i++) { s += a[i] - a[i - k]; best = max(best, s); }

        cout << best;

        '
      java: 'int[] a = {2, 1, 5, 1, 3, 2};

        int k = 3, s = 0;

        for (int i = 0; i < k; i++) s += a[i];

        int best = s;

        for (int i = k; i < 6; i++) { s += a[i] - a[i - k]; best = Math.max(best, s); }

        System.out.println(best);

        '
    options:
    - '9'
    - '8'
    - '10'
    - '7'
    answer: 0
    explanation: The window sums are 8, 7, 9 and 6. The best is 9, from 5 + 1 + 3.
    difficulty: 2
  - id: negatives-fail
    kind: mcq
    prompt: Why can a shrink-while-too-big sliding window not find the longest subarray with sum exactly
      k when values may be negative?
    options:
    - Adding an element can lower the sum, so a window that is too big may become valid again
    - Sliding windows only work on strings, so numeric arrays need another method entirely
    - Negative numbers overflow the running sum once the window grows long enough
    - 'It works: shrink whenever the sum exceeds k, exactly as it does for positives'
    answer: 0
    explanation: 'The template relies on monotonicity: more elements means a bigger sum. Negatives break
      that, so use prefix sums with a hash map instead.'
    difficulty: 3
  - id: min-length
    kind: mcq
    prompt: Find the minimal length of a contiguous subarray of [2, 3, 1, 2, 4, 3] with sum at least 7,
      using a variable window. What is it?
    options:
    - '2'
    - '3'
    - '4'
    - '1'
    answer: 0
    explanation: The subarray [4, 3] sums to 7 with length 2. The window grows until the sum is at least
      7, then shrinks from the left while it stays at least 7, recording the length each time.
    difficulty: 3
  - id: last-seen-bug
    kind: output
    prompt: This longest-substring-without-repeats code is missing a safeguard. What does it print for "abba"
      (the correct answer is 2)?
    code:
      python: "s = \"abba\"\nlast = {}\nleft = 0\nbest = 0\nfor r, ch in enumerate(s):\n    if ch in last:\n\
        \        left = last[ch] + 1\n    last[ch] = r\n    best = max(best, r - left + 1)\nprint(best)\n"
      cpp: "string s = \"abba\";\nunordered_map<char, int> last;\nint left = 0, best = 0;\nfor (int r =\
        \ 0; r < (int)s.size(); r++) {\n    char ch = s[r];\n    if (last.count(ch)) left = last[ch] + 1;\n\
        \    last[ch] = r;\n    best = max(best, r - left + 1);\n}\ncout << best;\n"
      java: "String s = \"abba\";\nMap<Character, Integer> last = new HashMap<>();\nint left = 0, best =\
        \ 0;\nfor (int r = 0; r < s.length(); r++) {\n    char ch = s.charAt(r);\n    if (last.containsKey(ch))\
        \ left = last.get(ch) + 1;\n    last.put(ch, r);\n    best = Math.max(best, r - left + 1);\n}\n\
        System.out.println(best);\n"
    options:
    - '3'
    - '2'
    - '4'
    - '1'
    answer: 0
    explanation: 'At the final ''a'' the old position 0 sends left back to 1, so the window [1, 3] = ''bba''
      is counted. The fix is left = max(left, last[ch] + 1): left must never move backwards.'
    difficulty: 4
  - id: exactly-k
    kind: mcq
    prompt: How many subarrays of [1, 2, 1, 2, 3] contain exactly 2 distinct values?
    options:
    - '7'
    - '6'
    - '8'
    - '5'
    answer: 0
    explanation: 'Windows are easiest for ''at most K''. Exactly K equals atMost(K) − atMost(K − 1): here
      12 − 5 = 7.'
    difficulty: 4
  - id: char-replace
    kind: mcq
    prompt: You may change at most k = 1 character of "AABABBA". What is the length of the longest substring
      that can be made all one letter?
    options:
    - '4'
    - '3'
    - '5'
    - '6'
    answer: 0
    explanation: A window is valid when its length minus its most common letter count is at most k. For
      example 'AABA' becomes 'AAAA' with one change. The window only ever needs to grow, so it stays O(n).
    difficulty: 4
  - id: deque-indices
    kind: mcq
    prompt: Sliding window maximum keeps a deque. Why does the deque store indices instead of values?
    options:
    - An index gives the position (to drop expired fronts) and the value via a[idx]
    - Equal values cannot be stored twice in a deque, so positions are needed instead
    - Indices are smaller numbers, so the deque takes less memory than it would with values
    - It keeps the deque sorted by position instead of by value, which the method requires
    answer: 0
    explanation: 'An index gives both: its value is a[idx], and idx ≤ i − k tells you to pop it from the
      front. Each index is pushed and popped once, so the total is O(n).'
    difficulty: 5
  - id: window-complexity
    kind: mcq
    prompt: A variable-size window has a while loop nested in a for loop. Why is the total time still O(n)?
    options:
    - Each index enters and leaves the window at most once, so the bodies run at most 2n times
    - The while loop runs at most once per step of the for loop, so it is O(n)
    - n is small enough in practice that the nested loops do not really matter here
    - It is actually O(n²) in theory, but the constant factor stays small in practice
    answer: 0
    explanation: 'This is amortised analysis: the inner loop''s total work across all outer iterations is
      bounded by the number of left-pointer moves, which is at most n.'
    difficulty: 5
