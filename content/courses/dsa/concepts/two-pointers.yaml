id: two-pointers
title: Two pointers
summary: Move two indexes through sorted or structured data to replace an O(n²) pair search with one O(n) sweep.
module: linear-patterns
prerequisites: [arrays-hashing]
difficulty: 3
estimated_minutes: 50
lesson: |
  ## The big idea

  Many pair problems have structure — usually **sortedness** — that lets you rule out many
  pairs at once. Keep two indexes and move one of them each step based on what you see.
  Each pointer moves at most n times, so the whole sweep is **O(n)**.

  ## Shape 1 — opposite ends

  Find two numbers in a **sorted** array that sum to `t`:

  ```python
  def pair_sum_sorted(a, t):
      i, j = 0, len(a) - 1
      while i < j:
          s = a[i] + a[j]
          if s == t:
              return i, j
          if s < t:
              i += 1      # need a bigger sum: only moving i right can help
          else:
              j -= 1      # need a smaller sum: only moving j left can help
      return None
  ```

  ```cpp
  pair<int,int> pairSumSorted(const vector<long long>& a, long long t) {
      int i = 0, j = (int)a.size() - 1;
      while (i < j) {
          long long s = a[i] + a[j];
          if (s == t) return {i, j};
          if (s < t) i++; else j--;
      }
      return {-1, -1};
  }
  ```

  ```java
  static int[] pairSumSorted(long[] a, long t) {
      int i = 0, j = a.length - 1;
      while (i < j) {
          long s = a[i] + a[j];
          if (s == t) return new int[]{i, j};
          if (s < t) i++; else j--;
      }
      return new int[]{-1, -1};
  }
  ```

  **Why it is correct:** if `a[i] + a[j] < t`, then `a[i]` paired with *any* index ≤ j is
  also too small (the array is sorted), so `a[i]` can never be part of the answer — safely
  discard it. Every move discards a whole row or column of candidate pairs. Being able to
  *explain* this argument is what interviewers look for.

  ## Shape 2 — same direction (fast/slow)

  A **write** pointer and a **read** pointer move left to right, for in-place filtering:
  remove duplicates from a sorted array, move zeros to the end, partition by a condition.

  ```python
  def dedupe_sorted(a):
      write = 0
      for read in range(len(a)):
          if read == 0 or a[read] != a[read - 1]:
              a[write] = a[read]
              write += 1
      return write           # new length
  ```

  ## Shape 3 — fix one, two-pointer the rest

  **3Sum** (triples summing to 0): sort, fix `a[i]`, then run opposite-end pointers on the
  rest for `−a[i]`. O(n²) instead of O(n³). Skip equal neighbours to avoid duplicate
  triples.

  ## Container With Most Water

  Lines at both ends; area = width × min(height). Move the pointer at the **shorter**
  line: keeping it can never produce a larger area, because width only shrinks.

  ## When to reach for two pointers

  - Input is sorted (or you can sort it without losing what you need).
  - You are looking for a pair/triple meeting a condition.
  - In-place rearrangement with O(1) extra space.
  - Palindromes and symmetric checks.

  ## Worked walkthrough

  Search for target 11 in sorted [1,3,4,7,9]. Endpoints 1+9 are too small, so advance left. Now 3+9 is too large, so retreat right. The next pair 3+7 is too small, and advancing left finds 4+7. Record which endpoint each comparison safely discards.

  ### Why this works

  Sorted order proves that when a sum is too small, keeping that left value with any smaller right value cannot work. The symmetric argument handles a sum that is too large.

  ### Boundary cases and cost

  Test duplicates, negatives, no answer and one item. Preserve original indices before sorting if the answer needs them.

  The scan is O(n) with O(1) working space. Include O(n log n) sorting when the input is not already sorted.

  ### Check your understanding

  Can either pointer move backwards in this scan? How many total moves occur?

  Try it on paper before reading the reasoning below.

  > Left only increases and right only decreases. Together they move at most O(n) times.

key_points:
  - Two indexes, each moving at most n times, give an O(n) sweep.
  - Opposite ends on sorted data — move the pointer that cannot be part of an answer.
  - Read/write pointers filter or partition in place with O(1) space.
  - Sort, fix one element, two-pointer the rest for triples (3Sum).
  - Always be able to justify why a discarded element can never be in the answer.
pitfalls:
  - Using opposite-end pointers on unsorted data.
  - Infinite loops when neither pointer moves in some branch.
  - Producing duplicate triples by not skipping equal values.
