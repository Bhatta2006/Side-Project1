quiz:
  - id: range-formula
    kind: mcq
    prompt: With p[0] = 0 and p[i + 1] = p[i] + a[i], the sum of a[2..5] (both ends inclusive) is...
    options:
    - p[6] − p[2]
    - p[5] − p[2]
    - p[5] − p[1]
    - p[6] − p[3]
    answer: 0
    explanation: p[6] is the sum of a[0..5], and p[2] is the sum of a[0..1]. Their difference is exactly
      a[2..5]. Inclusive ends mean the upper prefix index is r + 1.
    difficulty: 2
  - id: seed-zero
    kind: mcq
    prompt: 'When counting subarrays with sum k using a prefix-sum map, why does the map start as {0: 1}?'
    options:
    - Subarrays beginning at index 0 equal a prefix minus the empty prefix, which must be present
    - To avoid a division by zero when the first element of the array is zero
    - Because the hash map implementation refuses to look up a key in an empty map
    - To handle negative numbers in the array, which would otherwise go missing
    answer: 0
    explanation: A subarray a[l..r] has sum prefix[r + 1] − prefix[l]. When l = 0 the 'before' prefix is
      the empty prefix with sum 0, which must be present once.
    difficulty: 3
  - id: why-map
    kind: mcq
    prompt: Count subarrays with sum exactly k when the array can contain negative numbers. Why do prefix
      sums with a hash map succeed where a sliding window fails?
    options:
    - Negatives break 'extend to grow, shrink to reduce', but equal prefix sums still identify a subarray
    - Sliding windows are always slower than hashing, so the map is preferred in general
    - A hash map uses less memory than keeping two moving window pointers around
    - Prefix sums sort the array first, which a sliding window also needs to work
    answer: 0
    explanation: With negatives, adding an element can lower the sum, so you cannot tell when to shrink.
      The prefix-sum identity needs no monotonicity.
    difficulty: 3
  - id: k-output
    kind: output
    prompt: What does this subarray-sum counter print?
    code:
      python: "nums = [1, 1, 1]\nk = 2\ncount = {0: 1}\ns = 0\nans = 0\nfor x in nums:\n    s += x\n   \
        \ ans += count.get(s - k, 0)\n    count[s] = count.get(s, 0) + 1\nprint(ans)\n"
      cpp: "vector<int> nums = {1, 1, 1};\nint k = 2, s = 0, ans = 0;\nunordered_map<int, int> cnt;\ncnt[0]\
        \ = 1;\nfor (int x : nums) {\n    s += x;\n    if (cnt.count(s - k)) ans += cnt[s - k];\n    cnt[s]++;\n\
        }\ncout << ans;\n"
      java: "int[] nums = {1, 1, 1};\nint k = 2, s = 0, ans = 0;\nMap<Integer, Integer> cnt = new HashMap<>();\n\
        cnt.put(0, 1);\nfor (int x : nums) {\n    s += x;\n    ans += cnt.getOrDefault(s - k, 0);\n    cnt.merge(s,\
        \ 1, Integer::sum);\n}\nSystem.out.println(ans);\n"
    options:
    - '2'
    - '1'
    - '3'
    - '0'
    answer: 0
    explanation: The subarrays with sum 2 are the first two ones and the last two ones. Prefix sums go 1,
      2, 3; at s = 2 the earlier prefix 0 matches, and at s = 3 the earlier prefix 1 matches.
    difficulty: 3
  - id: rect-2d
    kind: mcq
    prompt: A 3 × 3 grid of ones has 2D prefix table P (P[i][j] = sum of the top-left i × j block, 1-indexed,
      P[0][*] = P[*][0] = 0). What is the sum of the bottom-right 2 × 2 block (rows 2..3, columns 2..3)?
    options:
    - '4'
    - '5'
    - '3'
    - '6'
    answer: 0
    explanation: P[3][3] − P[1][3] − P[3][1] + P[1][1] = 9 − 3 − 3 + 1 = 4. The corner P[1][1] was subtracted
      twice, so it is added back.
    difficulty: 3
  - id: overflow-type
    kind: mcq
    prompt: An array holds 10^5 values, each up to 10^9. In a fixed-width-integer language, what type must
      the prefix sums use?
    options:
    - '64-bit: the largest prefix is up to 10^14'
    - '32-bit: each element fits'
    - '32-bit unsigned: sums are non-negative'
    - A float, which holds 10^14 exactly
    answer: 0
    explanation: The prefix sum, not the element, must fit. 10^14 exceeds 2^32 ≈ 4.3·10^9. (Python integers
      never overflow.)
    difficulty: 2
  - id: product-except
    kind: output
    prompt: This computes, for each position, the product of all the other elements without division. What
      does it print?
    code:
      python: "a = [1, 2, 3, 4]\nn = len(a)\nout = [1] * n\nleft = 1\nfor i in range(n):\n    out[i] = left\n\
        \    left *= a[i]\nright = 1\nfor i in range(n - 1, -1, -1):\n    out[i] *= right\n    right *=\
        \ a[i]\nprint(*out)\n"
      cpp: 'int a[4] = {1, 2, 3, 4};

        int n = 4;

        int out[4];

        int left = 1;

        for (int i = 0; i < n; i++) { out[i] = left; left *= a[i]; }

        int right = 1;

        for (int i = n - 1; i >= 0; i--) { out[i] *= right; right *= a[i]; }

        for (int i = 0; i < n; i++) cout << out[i] << (i + 1 < n ? " " : "");

        '
      java: 'int[] a = {1, 2, 3, 4};

        int n = 4;

        int[] out = new int[n];

        int left = 1;

        for (int i = 0; i < n; i++) { out[i] = left; left *= a[i]; }

        int right = 1;

        for (int i = n - 1; i >= 0; i--) { out[i] *= right; right *= a[i]; }

        StringBuilder sb = new StringBuilder();

        for (int i = 0; i < n; i++) sb.append(out[i]).append(i + 1 < n ? " " : "");

        System.out.println(sb);

        '
    options:
    - 24 12 8 6
    - 24 24 24 24
    - 1 2 6 24
    - 6 8 12 24
    answer: 0
    explanation: The first pass stores the product of everything to the left (1, 1, 2, 6). The second multiplies
      in everything to the right (24, 12, 4, 1), giving 24, 12, 8, 6. It is a prefix product times a suffix
      product.
    difficulty: 4
  - id: divisible-subarrays
    kind: mcq
    prompt: How many non-empty subarrays of [5, 10, −5, 3, 2] have a sum divisible by 5?
    options:
    - '10'
    - '7'
    - '5'
    - '15'
    answer: 0
    explanation: 'Two prefix sums with the same remainder mod 5 delimit such a subarray. The prefix sums
      0, 5, 15, 10, 13, 15 have remainders 0, 0, 0, 0, 3, 0: five share remainder 0, giving C(5, 2) = 10
      subarrays. Count remainders in a map, and normalise negative remainders into [0, 5).'
    difficulty: 4
  - id: balanced-binary
    kind: mcq
    prompt: Find the longest subarray of [0, 1, 0, 0, 1, 1, 0] with equally many 0s and 1s. What is its
      length, and what transformation makes prefix sums work?
    options:
    - 6; treat each 0 as −1, then equal prefix sums delimit a balanced subarray
    - 7; the whole array is balanced if you ignore the last element
    - 4; treat each 0 as +1 and each 1 as −1 instead
    - 6; sort the array first and take the middle
    answer: 0
    explanation: Mapping 0 to −1 turns 'equal counts' into 'sum 0', which equal prefix sums detect. Store
      the earliest index of each prefix sum to maximise the length. Sorting destroys the subarray structure.
    difficulty: 5
  - id: no-leading-zero
    kind: bug
    prompt: The prefix array is built as p = [1, 3, 6] for a = [1, 2, 3], WITHOUT a leading 0. The code
      then answers 'sum of a[0..1]' with p[r + 1] - p[l], which should be 3. What does it print?
    code:
      python: "a = [1, 2, 3]\np = []\nrun = 0\nfor x in a:\n    run += x\n    p.append(run)\nl, r = 0, 1\n\
        print(p[r + 1] - p[l])\n"
      cpp: "int a[3] = {1, 2, 3};\nint p[3];\nint run = 0;\nfor (int i = 0; i < 3; i++) {\n    run += a[i];\n\
        \    p[i] = run;\n}\nint l = 0, r = 1;\ncout << p[r + 1] - p[l];\n"
      java: "int[] a = {1, 2, 3};\nint[] p = new int[3];\nint run = 0;\nfor (int i = 0; i < 3; i++) {\n\
        \    run += a[i];\n    p[i] = run;\n}\nint l = 0, r = 1;\nSystem.out.println(p[r + 1] - p[l]);\n"
    options:
    - '5'
    - '3'
    - '6'
    - '1'
    answer: 0
    explanation: The formula p[r + 1] - p[l] expects p[0] = 0 and p[i + 1] = sum of the first i + 1 elements.
      Without that leading zero every index is shifted by one, and the query returns 6 - 1 = 5.
    difficulty: 3
