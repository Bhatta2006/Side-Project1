quiz:
  - id: range-formula
    kind: mcq
    prompt: With p[0] = 0 and p[i+1] = p[i] + a[i], the sum of a[2..5] (inclusive) is...
    options: ["p[6] − p[2]", "p[5] − p[2]", "p[5] − p[1]", "p[6] − p[3]"]
    answer: 0
    explanation: Sum of a[l..r] is p[r+1] − p[l] with l = 2, r = 5.
    difficulty: 2
  - id: seed
    kind: mcq
    prompt: "When counting subarrays with sum k using a prefix-sum map, why start the map with {0: 1}?"
    options:
      - "To count subarrays that start at index 0"
      - "To avoid a division by zero in the loop"
      - "Because a hash map is not allowed to be empty"
      - "To handle negative numbers in the array"
    answer: 0
    explanation: A subarray starting at 0 has sum equal to the current prefix, matching an earlier prefix of 0.
    difficulty: 3
  - id: query-cost
    kind: mcq
    prompt: After building prefix sums, what is the cost of each range-sum query?
    options: ["O(1)", "O(log n)", "O(n)", "O(r − l)"]
    answer: 0
    explanation: A single subtraction of two stored values.
    difficulty: 1
  - id: negatives
    kind: mcq
    prompt: Why does "count subarrays with sum k" use prefix sums + hashing rather than a sliding window?
    options:
      - "Negative numbers break the sliding window's monotonic behaviour"
      - "Sliding windows are always slower than prefix sums with hashing"
      - "Hash maps use less memory than the window's two pointer indices"
      - "Prefix sums sort the array, which the sliding window then needs"
    answer: 0
    explanation: With negatives, extending a window can decrease the sum, so you cannot decide when to shrink.
    difficulty: 3
  - id: count-k
    kind: mcq
    prompt: "Counting subarrays with sum exactly k, why must the map start with {0: 1}?"
    options:
      - "Subarrays that start at index 0 need the empty prefix"
      - "To avoid a KeyError on the very first lookup"
      - "Because k may be 0, which needs a special entry"
      - "It is only needed when the array has negatives"
    answer: 0
    explanation: "A subarray a[0..r] has sum P[r+1] - P[0]; the empty prefix P[0] = 0 must already be counted once."
    difficulty: 5
  - id: inclusive-range
    kind: mcq
    prompt: "With P[0] = 0 and P[i] = a[0] + … + a[i-1], the sum of a[l..r] (inclusive) is"
    options:
      - "P[r + 1] - P[l]"
      - "P[r] - P[l]"
      - "P[r] - P[l - 1]"
      - "P[r + 1] - P[l + 1]"
    answer: 0
    explanation: "P[r + 1] covers a[0..r] and P[l] covers a[0..l-1]; their difference is exactly a[l..r]."
    difficulty: 4
