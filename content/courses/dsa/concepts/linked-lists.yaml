id: linked-lists
title: Linked lists
summary: Nodes connected by pointers — O(1) insertion and removal anywhere, and the pointer-juggling interviewers love.
module: recursive-structures
prerequisites: [complexity, zero:classes-and-objects]
difficulty: 3
estimated_minutes: 55
lesson: |
  ## The big idea

  An array stores elements side by side, so inserting in the middle shifts everything:
  O(n). A **linked list** stores each element in a **node** that also holds a reference to
  the **next** node. Inserting or removing next to a node you already hold is **O(1)** —
  just rewire a couple of pointers. The trade-off: no indexing; reaching the k-th element
  takes O(k).

  ```python
  class Node:
      def __init__(self, val, next=None):
          self.val = val
          self.next = next

  head = Node(1, Node(2, Node(3)))     # 1 -> 2 -> 3
  node = head
  while node:                          # traverse
      print(node.val)
      node = node.next
  ```

  ```cpp
  struct Node {
      int val;
      Node* next;
      Node(int v, Node* n = nullptr) : val(v), next(n) {}
  };

  Node* head = new Node(1, new Node(2, new Node(3)));
  for (Node* node = head; node != nullptr; node = node->next) cout << node->val << "\n";
  ```

  ```java
  class Node {
      int val; Node next;
      Node(int val, Node next) { this.val = val; this.next = next; }
  }

  Node head = new Node(1, new Node(2, new Node(3, null)));
  for (Node node = head; node != null; node = node.next) System.out.println(node.val);
  ```

  ## Core operations

  - **Insert after** node `p`: `new.next = p.next; p.next = new`. Order matters — set the
    new node's pointer first, or you lose the rest of the list.
  - **Delete after** `p`: `p.next = p.next.next`.
  - **Dummy head**: start with a fake node before the real head so inserting or deleting
    at the front needs no special case.

  ## Reverse a list (the classic)

  Walk once, flipping each pointer to point backwards:

  ```python
  def reverse(head):
      prev = None
      while head:
          nxt = head.next      # remember the rest
          head.next = prev     # flip
          prev, head = head, nxt
      return prev
  ```

  ```cpp
  Node* reverse(Node* head) {
      Node* prev = nullptr;
      while (head) {
          Node* nxt = head->next;
          head->next = prev;
          prev = head;
          head = nxt;
      }
      return prev;
  }
  ```

  ```java
  static Node reverse(Node head) {
      Node prev = null;
      while (head != null) {
          Node nxt = head.next;
          head.next = prev;
          prev = head;
          head = nxt;
      }
      return prev;
  }
  ```

  ## Fast and slow pointers

  Move `slow` one step and `fast` two steps:

  - When `fast` reaches the end, `slow` is at the **middle**.
  - If there is a **cycle**, `fast` eventually laps `slow` and they meet (Floyd's
    algorithm) — O(1) extra space.

  ## Doubly linked lists

  Each node also points to its **previous** node, enabling O(1) removal of any node you
  hold. Combined with a hash map from key to node, this gives the famous **LRU cache** with
  O(1) get and put.

  ## Simulating linked lists with arrays

  In competitive settings, nodes are often stored in arrays: `nxt[i]` and `prv[i]` hold
  the neighbours of element `i`. Same ideas, no objects — and you will practise exactly that
  in the problem here.

  ## Worked walkthrough

  Reverse A→B→C. Set prev=null and curr=A. Save next=B before replacing A.next with null; advance prev=A and curr=B. Repeating transfers B and C to the reversed prefix. Finally prev is the new head.

  ### Why this works

  Maintain a reversed prefix headed by prev and an untouched suffix headed by curr. Saving the forward edge prevents losing access to the suffix during mutation.

  ### Boundary cases and cost

  Test null, one-node and two-node lists. Dummy heads simplify removing the first real node. Compare object identity for intersection.

  Iterative reversal is O(n) time and O(1) extra space. Recursive reversal uses O(n) stack space.

  ### Check your understanding

  Do two lists intersect merely because they contain equal values?

  Try it on paper before reading the reasoning below.

  > No. Intersection means sharing the same node object, not different nodes storing the same value.

key_points:
  - Nodes hold a value and a pointer to the next node; no random access.
  - Insert/delete next to a known node in O(1); finding a node is O(n).
  - Rewire pointers in the right order; a dummy head removes edge cases.
  - Reverse in place with prev/curr/next in one pass.
  - Fast/slow pointers find the middle and detect cycles in O(1) space.
pitfalls:
  - Losing the rest of the list by overwriting next too early.
  - Null pointer access at the end of the list.
  - Forgetting to update head when the first node changes.
