quiz:
  - id: square-state
    kind: mcq
    prompt: In the maximal-square DP, what does dp[i][j] mean?
    options:
    - The side of the largest all-ones square whose bottom-right corner is cell (i, j)
    - The number of ones found in the column above cell (i, j), counting from the top
    - The area of the largest all-ones square found anywhere in the grid so far
    - Whether cell (i, j) holds a one, stored as 1 for yes and 0 for no
    answer: 0
    explanation: Anchoring the state to a corner is what makes the transition local. The answer to the whole
      problem is the maximum over all cells, and the area is that side squared.
    difficulty: 1
  - id: square-cell
    kind: mcq
    prompt: The current cell holds 1. The dp value above it is 2, to its left is 3, and diagonally up-left
      is 1. What is dp[i][j]?
    options:
    - '2'
    - '3'
    - '4'
    - '1'
    answer: 0
    explanation: dp[i][j] = 1 + min(up, left, up-left) = 1 + 1 = 2. The weakest of the three neighbouring
      squares limits how far the new square can reach.
    difficulty: 2
  - id: histogram-height
    kind: mcq
    prompt: To find the largest all-ones rectangle you build, for each row, a histogram of column heights.
      How is each height updated when moving down one row?
    options:
    - Add one if the cell is 1, otherwise reset the height to zero
    - Set it to the count of ones in that whole column, wherever they are
    - Set it to the index of the row that is currently being processed
    - Set it to the side of the largest square that ends in that cell
    answer: 0
    explanation: The height of a column in row r is the number of consecutive ones ending at row r. A zero
      breaks the run, so it resets. Each row then becomes a largest-rectangle-in-a-histogram problem.
    difficulty: 2
  - id: squares-output
    kind: output
    prompt: This computes dp over a grid of characters and prints the area of the largest all-ones square,
