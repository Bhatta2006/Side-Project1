  - id: rolling-output
    kind: output
    prompt: This maximal-square solution keeps only a single row of dp plus a saved diagonal value. What
      side length does it print for the grid below?
    code:
      python: "g = [\"1111\", \"1111\", \"1110\", \"1111\"]\nm = 4\ndp = [0] * (m + 1)\nbest = 0\nfor row\
        \ in g:\n    prev = 0\n    for j in range(1, m + 1):\n        tmp = dp[j]\n        if row[j - 1]\
        \ == \"1\":\n            dp[j] = 1 + min(dp[j], dp[j - 1], prev)\n            best = max(best, dp[j])\n\
        \        else:\n            dp[j] = 0\n        prev = tmp\nprint(best)\n"
      cpp: "string g[4] = {\"1111\", \"1111\", \"1110\", \"1111\"};\nint m = 4;\nvector<int> dp(m + 1, 0);\n\
