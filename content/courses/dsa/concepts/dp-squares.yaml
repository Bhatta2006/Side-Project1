        \    if i == 0 or j == 0:\n                dp[i][j] = 1\n            else:\n                dp[i][j]\
        \ = 1 + min(dp[i - 1][j], dp[i][j - 1], dp[i - 1][j - 1])\n            best = max(best, dp[i][j])\n\
