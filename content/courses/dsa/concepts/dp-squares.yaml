        \ dp[i][j] = 1 + Math.min(dp[i - 1][j], Math.min(dp[i][j - 1], dp[i - 1][j - 1]));\n           \
        \ best = Math.max(best, dp[i][j]);\n            total += dp[i][j];\n        }\nSystem.out.println(best\
        \ * best + \" \" + total);\n"
    options:
