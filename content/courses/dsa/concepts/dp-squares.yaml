  - id: why-not-dp
    kind: mcq
    prompt: Why can't a single number per cell, like the square side, describe the largest all-ones rectangle
      ending at that cell?
    options:
    - A rectangle has two free sides, and the best pair of sides can change for the cells that follow it
    - Every rectangle is a square, so one side length per cell would already be enough to describe it
    - 'It can: take the minimum of the same three neighbours, exactly as is done for the squares'
    - Storing areas per cell overflows 32-bit integers for large grids, so a pair is needed instead
    answer: 0
    explanation: A 1 x 5 and a 5 x 1 rectangle ending at a cell have the same area but extend to different
      later cells, so no single value captures what a future cell needs. That is why rectangles use per-row
      histograms and a stack instead of a one-number-per-cell DP.
