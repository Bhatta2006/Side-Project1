quiz:
  - id: two-sum-complexity
    kind: mcq
    prompt: Two Sum with a hash map runs in what time?
    options: ["O(n)", "O(n²)", "O(n log n)", "O(1)"]
    answer: 0
    explanation: One pass, with an O(1) average lookup per element.
    difficulty: 1
  - id: anagram-key
    kind: mcq
    prompt: To group anagrams, which key works for every word?
    options: ["The word's letters sorted", "The word's length alone", "The word's first letter", "The word spelled reversed"]
    answer: 0
    explanation: Anagrams have exactly the same sorted letters, so they share that key.
    difficulty: 2
  - id: check-before-insert
    kind: mcq
    prompt: In Two Sum, why check for target − x before inserting x?
    options:
      - "The word's letters sorted"
      - "The word's length alone"
      - "The word's first letter"
      - "The word spelled reversed"
    answer: 0
    explanation: If target = 2x, inserting first would let x match itself.
    difficulty: 2
  - id: counting-array
    kind: mcq
    prompt: You must count lowercase letters in a string. What is the simplest O(1)-space structure?
    options: ["An array of 26 counters", "A sorted list", "A hash map of strings", "A 2D grid"]
    answer: 0
    explanation: With a fixed small key range, index = letter − 'a' into a 26-slot array.
    difficulty: 2
  - id: hash-worst-case
    kind: mcq
    prompt: "When can a hash-set lookup take O(n) time?"
    options:
      - "When many keys collide in the same bucket"
      - "Whenever the keys being looked up are strings"
      - "After the set has been sorted into key order"
      - "Never; a hash lookup is always O(1) time"
    answer: 0
    explanation: "O(1) is the expected cost; with heavy collisions (bad hashing or adversarial keys) a lookup may scan many entries."
    difficulty: 4
  - id: two-sum-one-pass
    kind: mcq
    prompt: "One-pass pair sum with a hash set: for each x you check whether target - x is in the set, then add x. Why add x only after checking?"
    options:
      - "So x is not paired with itself"
      - "To keep the set in sorted order"
      - "Because adding first is slower"
      - "It makes no difference at all"
    answer: 0
    explanation: "If you add x first and target = 2x, the check would wrongly find x as its own partner."
    difficulty: 5
