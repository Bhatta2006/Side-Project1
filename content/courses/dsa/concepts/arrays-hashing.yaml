id: arrays-hashing
title: Arrays and hashing
summary: Use hash maps and sets to turn repeated searching into instant lookups — the #1 interview pattern.
module: foundations
prerequisites: [complexity, zero:maps]
difficulty: 2
estimated_minutes: 60
lesson: |
  ## The big idea

  Many brute-force solutions spend their time **searching**: "is there an earlier element
  that...?", "how many times have I seen...?". A **hash map** or **hash set** answers those
  questions in O(1) on average, turning O(n²) scans into a single O(n) pass.

  ## How hashing works (just enough)

  A hash table computes a number from each key (the *hash*) and uses it to pick a bucket in
  an array. Lookup jumps straight to the bucket instead of scanning. Collisions (two keys,
  one bucket) are handled internally, so operations are O(1) **on average**.

  ## Pattern 1 — complement lookup (Two Sum)

  For each x, the partner you need is `target − x`. Store what you have seen, mapped to
  where you saw it.

  ```python
  def two_sum(nums, target):
      index_of = {}
      for i, x in enumerate(nums):
          if target - x in index_of:
              return [index_of[target - x], i]
          index_of[x] = i
      return []
  ```

  ```cpp
  vector<int> twoSum(const vector<int>& nums, int target) {
      unordered_map<int, int> indexOf;
      for (int i = 0; i < (int)nums.size(); i++) {
          auto it = indexOf.find(target - nums[i]);
          if (it != indexOf.end()) return {it->second, i};
          indexOf[nums[i]] = i;
      }
      return {};
  }
  ```

  ```java
  static int[] twoSum(int[] nums, int target) {
      HashMap<Integer, Integer> indexOf = new HashMap<>();
      for (int i = 0; i < nums.length; i++) {
          Integer j = indexOf.get(target - nums[i]);
          if (j != null) return new int[]{j, i};
          indexOf.put(nums[i], i);
      }
      return new int[0];
  }
  ```

  Checking **before** inserting guarantees you never pair an element with itself.

  ## Pattern 2 — frequency counting

  Count occurrences, then reason about the counts: anagrams (equal letter counts),
  majority element, top-k frequent, first unique character.

  ## Pattern 3 — canonical keys (grouping)

  Group things that are "the same" under some view by mapping each to a **canonical key**:
  sorted letters for anagrams (`"eat"` → `"aet"`), a tuple of counts, or a normalised
  form. Items with the same key land in the same group.

  ## Arrays: the in-place toolkit

  Hashing is not always needed. Arrays support O(1) access by index, so when values are in
  a small known range (like 26 letters or 0..n), a **counting array** beats a hash map in
  speed and simplicity. Other array tricks: precomputing from the left and right (product
  of array except self), and using the array itself as a marker when values are in 1..n.

  ## Interview checklist

  1. State the brute force and its complexity.
  2. Ask: *what am I repeatedly searching for?*
  3. Store exactly that in a map/set as you scan.
  4. Re-state the new complexity: usually O(n) time, O(n) space.

  ## Worked walkthrough

  Detect repeats in [6, 2, 6, 3]. Before each item, seen contains earlier values only. Insert the first 6 and then 2 after finding each absent. The next 6 is present, proving repetition. For two-sum, check the complement before inserting the current value to preserve the distinct-index rule.

  ### Why this works

  State exactly what the table contains and when an item becomes eligible for lookup. Use a frequency map when multiplicity matters; a set intentionally loses counts.

  ### Boundary cases and cost

  Test duplicates and a target equal to twice one value. Inserting before checking can reuse the same index.

  Expected time is O(n), space O(n). Sorting plus two pointers is an O(n log n) alternative when hashing is unsuitable.

  ### Check your understanding

  For [3, 3] and target 6, how does checking before insertion find a pair?

  Try it on paper before reading the reasoning below.

  > The first 3 is inserted after finding no match. The second finds that earlier position, so the equal values still have distinct indices.

key_points:
  - Hash maps/sets give O(1) average lookup, turning repeated searches into one pass.
  - Complement lookup — store what you've seen, look for target − x.
  - Frequency counting solves anagram, majority and top-k style questions.
  - Canonical keys group equivalent items.
  - For small known ranges, a counting array beats a hash map.
pitfalls:
  - Inserting before checking, and pairing an element with itself.
  - Forgetting that hash maps are unordered when output order matters.
  - Using mutable lists as Python dict keys (use tuples or strings).
