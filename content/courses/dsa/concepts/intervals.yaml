id: intervals
title: Intervals
summary: Sort intervals by start, then sweep once to merge, insert, or detect overlaps.
module: ordering
prerequisites: [sorting]
difficulty: 3
estimated_minutes: 45
lesson: |
  ## The big idea

  Meetings, bookings, time ranges, ranges of numbers — interval problems are everywhere.
  Almost all of them start the same way: **sort by start time**. After sorting, any
  interval can only overlap the ones right around it, so a single left-to-right sweep
  suffices.

  ## Overlap test

  Intervals `[a, b]` and `[c, d]` (closed) overlap when **`a ≤ d` and `c ≤ b`** — each starts
  before the other ends. Ask whether touching endpoints (`b == c`) count as overlapping;
  problems differ, and interviewers love that clarification.

  ## Merge overlapping intervals

  ```python
  def merge(intervals):
      intervals.sort()
      merged = []
      for start, end in intervals:
          if merged and start <= merged[-1][1]:
              merged[-1][1] = max(merged[-1][1], end)   # extend the current block
          else:
              merged.append([start, end])                # start a new block
      return merged
  ```

  ```cpp
  vector<pair<long long,long long>> mergeIntervals(vector<pair<long long,long long>> v) {
      sort(v.begin(), v.end());
      vector<pair<long long,long long>> out;
      for (auto [s, e] : v) {
          if (!out.empty() && s <= out.back().second)
              out.back().second = max(out.back().second, e);
          else
              out.push_back({s, e});
      }
      return out;
  }
  ```

  ```java
  static List<long[]> merge(long[][] v) {
      Arrays.sort(v, (x, y) -> Long.compare(x[0], y[0]));
      List<long[]> out = new ArrayList<>();
      for (long[] it : v) {
          if (!out.isEmpty() && it[0] <= out.get(out.size() - 1)[1])
              out.get(out.size() - 1)[1] = Math.max(out.get(out.size() - 1)[1], it[1]);
          else out.add(new long[]{it[0], it[1]});
      }
      return out;
  }
  ```

  Note `max`: a later interval may be entirely inside the current block, e.g. `[1, 10]`
  then `[2, 3]`.

  ## Other classic interval questions

  - **Insert an interval** into a sorted non-overlapping list: copy the ones entirely
    before, merge everything that overlaps, copy the rest.
  - **Can one person attend all meetings?** Sort by start; any `start < previous end`
    means a conflict.
  - **Minimum meeting rooms** — sweep line: turn each interval into a +1 event at start and
    a −1 event at end, sort events, and track the running count; the peak is the answer.
  - **Remove the fewest intervals to make the rest non-overlapping** — that is a greedy
    problem: sort by **end** and keep each interval that starts after the last kept end.

  ## Sweep line in one sentence

  Turn intervals into sorted events and walk through time keeping a running state. It
  solves overlap counting, union length, and skyline-style problems.

  ## Worked walkthrough

  Merge [1,4], [2,3], [6,8] after sorting starts. Hold [1,4]. The contained [2,3] overlaps without extending the end. Start 6 proves the current interval can be emitted, then begin [6,8]. Always take the maximum end.

  ### Why this works

  Sorted starts guarantee that no future interval can overlap an interval already separated from the next start. Decide between closed and half-open intervals before defining overlap.

  ### Boundary cases and cost

  Closed [1,2] and [2,3] share a point; their half-open versions do not. Test containment, duplicates and touching endpoints.

  Sorting costs O(n log n), scanning O(n). Output may occupy O(n) even when working state is constant.

  ### Check your understanding

  Why choose earliest finish when maximizing non-overlapping selections?

  Try it on paper before reading the reasoning below.

  > Replacing an optimal solution's first interval with the earliest-finishing choice leaves at least as much room for later selections.

key_points:
  - Sort by start; then overlaps involve only neighbours in the sweep.
  - Overlap of [a, b] and [c, d] ⇔ a ≤ d and c ≤ b — clarify whether touching counts.
  - Merge by extending the last block with max(end).
  - Sweep line - +1/−1 events sorted by time give concurrent counts.
  - Sorting by end time enables greedy selection.
pitfalls:
  - Forgetting max() when merging nested intervals.
  - Mis-ordering events at equal times (end before start or vice versa).
  - Not clarifying whether touching intervals overlap.
