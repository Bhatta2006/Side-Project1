id: bst
title: Binary search trees
summary: Keep keys ordered in a tree so search, insert and delete follow one root-to-leaf path.
module: trees
prerequisites: [binary-trees, binary-search, tree-patterns]
difficulty: 3
estimated_minutes: 50
lesson: |
  ## The big idea

  A **binary search tree (BST)** is a binary tree with one ordering rule:

  > every key in a node's **left** subtree is smaller than the node's key, and every key
  > in its **right** subtree is larger.

  Searching works like binary search: compare with the root and go left or right. Each
  step goes one level down, so search, insert and delete cost **O(h)** where h is the
  height.

  ```python
  def insert(node, key):
      if node is None:
          return TreeNode(key)
      if key < node.val:
          node.left = insert(node.left, key)
      elif key > node.val:
          node.right = insert(node.right, key)
      return node

  def contains(node, key):
      while node:
          if key == node.val:
              return True
          node = node.left if key < node.val else node.right
      return False
  ```

  ```cpp
  TreeNode* insert(TreeNode* node, int key) {
      if (!node) return new TreeNode(key);
      if (key < node->val) node->left = insert(node->left, key);
      else if (key > node->val) node->right = insert(node->right, key);
      return node;
  }
  ```

  ```java
  static TreeNode insert(TreeNode node, int key) {
      if (node == null) return new TreeNode(key);
      if (key < node.val) node.left = insert(node.left, key);
      else if (key > node.val) node.right = insert(node.right, key);
      return node;
  }
  ```

  ## The inorder property

  An **inorder traversal of a BST visits keys in sorted order**. Many BST questions reduce
  to this: the k-th smallest is the k-th node visited inorder; validating a BST means the
  inorder sequence is strictly increasing.

  ## Validate a BST — the classic trap

  Checking only `left.val < node.val < right.val` at each node is **wrong**: a node deep in
  the left subtree must be smaller than **every** ancestor it sits to the left of. Pass an
  allowed range down instead: `valid(node, low, high)`, narrowing the range at each step.

  ## Height and balance

  Inserting sorted keys creates a chain: height n, so every operation becomes O(n). Real
  systems use **self-balancing** trees (red-black, AVL) that keep height O(log n).
  You rarely implement them in interviews, but you must know the standard library gives
  them to you:

  - C++: `std::set`, `std::map` (ordered, O(log n), `lower_bound`)
  - Java: `TreeSet`, `TreeMap` (`floor`, `ceiling`, `higher`, `lower`)
  - Python: no built-in ordered set; use `bisect` on a sorted list, or the `sortedcontainers`
    package outside interviews.

  ## Lowest common ancestor in a BST

  Start at the root: if both keys are smaller, go left; if both are larger, go right;
  otherwise the current node splits them and is the LCA.

  ## Worked walkthrough

  Search for 6 under root 8 with left child 3 and its right child 6. Compare with 8 and go left, then compare with 3 and go right. This excludes entire subtrees only because all descendants respect the ordering bounds.

  ### Why this works

  The invariant is global, not merely parent-child ordering. Validate descendants with inherited lower and upper bounds under an explicit duplicate policy.

  ### Boundary cases and cost

  A descendant can violate an ancestor's bound despite correct immediate comparisons. Avoid overflow-prone bound±1 arithmetic.

  Search, insertion and deletion cost O(height). Quote O(log n) only when balance is maintained.

  ### Check your understanding

  Does any BST guarantee logarithmic search?

  Try it on paper before reading the reasoning below.

  > No. Sorted insertion into an unbalanced BST can produce a chain of height n.

key_points:
  - BST rule - left subtree keys < node < right subtree keys.
  - Search, insert and delete walk one path, costing O(height).
  - Inorder traversal of a BST yields sorted keys.
  - Validate with a (low, high) range passed down, not just parent-child checks.
  - Unbalanced BSTs degrade to O(n); library ordered sets/maps stay O(log n).
pitfalls:
  - Validating only against the immediate parent.
  - Assuming O(log n) without balance (sorted insertions make a chain).
  - Mishandling duplicate keys — define where equal keys go.
