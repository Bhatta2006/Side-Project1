id: heaps
title: Heaps and priority queues
summary: Always get the smallest (or largest) item in O(log n) — the engine behind top-k, scheduling and Dijkstra.
module: trees
prerequisites: [binary-trees]
difficulty: 3
estimated_minutes: 50
lesson: |
  ## The big idea

  A **priority queue** hands you the most important item first: the smallest deadline,
  the largest score, the closest node. A **binary heap** implements it as a complete binary
  tree stored in an array, where every parent is ≤ its children (a **min-heap**). The
  minimum is always at the root.

  | Operation | Cost |
  |---|---|
  | peek min | O(1) |
  | push | O(log n) |
  | pop min | O(log n) |
  | build from n items | O(n) |

  ## Using the library

  ```python
  import heapq
  h = []
  heapq.heappush(h, 5)
  heapq.heappush(h, 1)
  heapq.heappush(h, 3)
  print(heapq.heappop(h))      # 1  (min-heap)
  # Max-heap: push negatives, e.g. heappush(h, -x), and negate when popping.
  ```

  ```cpp
  #include <queue>
  priority_queue<int> maxHeap;                                  // max-heap by default!
  priority_queue<int, vector<int>, greater<int>> minHeap;       // min-heap
  minHeap.push(5); minHeap.push(1); minHeap.push(3);
  cout << minHeap.top() << "\n";  // 1
  minHeap.pop();
  ```

  ```java
  PriorityQueue<Integer> minHeap = new PriorityQueue<>();            // min-heap
  PriorityQueue<Integer> maxHeap = new PriorityQueue<>(Collections.reverseOrder());
  minHeap.add(5); minHeap.add(1); minHeap.add(3);
  System.out.println(minHeap.poll());   // 1
  ```

  Note the defaults: **Python and Java are min-heaps, C++ is a max-heap.**

  ## How it works inside

  In the array, node `i` has children `2i+1` and `2i+2` and parent `(i−1)/2`. **Push**
  appends at the end and *sifts up* while smaller than its parent. **Pop** moves the last
  element to the root and *sifts down*, swapping with the smaller child. Both walk one
  root-to-leaf path: O(log n) because the tree is always complete.

  ## Pattern: top-k with a size-k heap

  To keep the **k largest** values of a stream, keep a **min-heap of size k**: push each
  value, and if the heap grows beyond k, pop the smallest. The root is then the k-th
  largest. O(n log k) time, O(k) space — far better than sorting everything when k is small.

  ```python
  def kth_largest(stream, k):
      h = []
      for x in stream:
          heapq.heappush(h, x)
          if len(h) > k:
              heapq.heappop(h)
      return h[0]
  ```

  ## More heap patterns

  - **Merge k sorted lists**: heap of the current head of each list.
  - **Scheduling**: always run the task with the earliest deadline / highest priority.
  - **Median of a stream**: a max-heap for the lower half and a min-heap for the upper half.
  - **Dijkstra's shortest paths**: always expand the closest unvisited node.

  ## Worked walkthrough

  A min-heap holding 2,5,8 pops 2 and repairs the root. Its backing array need not be globally sorted. To retain the largest three values seen, use a size-three min-heap and replace its root only with a larger candidate.

  ### Why this works

  The parent-child invariant guarantees an extreme at the root. For top-k, that root is the smallest retained candidate, exactly the item to evict.

  ### Boundary cases and cost

  Test empty pop, ties, k=0 and k greater than input size. Records may need a deterministic tie-break.

  Peek is O(1), push/pop O(log n), heap construction O(n). Streaming top-k costs O(n log k).

  ### Check your understanding

  Why use a min-heap when retaining the largest k values?

  Try it on paper before reading the reasoning below.

  > The smallest retained value is the replacement boundary. Cheap access to it makes each admission decision efficient.

key_points:
  - Heaps give O(1) peek and O(log n) push/pop of the min (or max).
  - Python and Java default to min-heaps; C++ priority_queue defaults to max.
  - Array layout - children at 2i+1, 2i+2; sift up on push, sift down on pop.
  - Top-k - keep a min-heap of size k for the k largest.
  - Two heaps maintain a running median.
pitfalls:
  - Forgetting C++'s default max-heap behaviour.
  - Sorting everything when a size-k heap suffices.
  - Searching a heap for arbitrary elements (O(n)) — heaps only make the top fast.
