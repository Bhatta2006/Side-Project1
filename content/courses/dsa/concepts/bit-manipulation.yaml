id: bit-manipulation
title: Bit manipulation
summary: Treat integers as arrays of bits — XOR tricks, masks, and counting set bits.
module: dynamic-programming
prerequisites: [complexity]
difficulty: 3
estimated_minutes: 40
lesson: |
  ## The big idea

  Every integer is stored in binary. Operating on its bits directly is extremely fast and
  unlocks elegant solutions: finding the one unpaired number, enumerating subsets, checking
  powers of two.

  | Operator | Meaning | 6 (110) op 3 (011) |
  |---|---|---|
  | `&` | AND: 1 if both bits 1 | 2 (010) |
  | `\|` | OR: 1 if either bit 1 | 7 (111) |
  | `^` | XOR: 1 if bits differ | 5 (101) |
  | `~` | NOT: flip every bit | |
  | `<<` / `>>` | shift left / right | `1 << 3` = 8 |

  ## Essential tricks

  - **Test bit k**: `(x >> k) & 1`
  - **Set bit k**: `x | (1 << k)`; **clear**: `x & ~(1 << k)`; **toggle**: `x ^ (1 << k)`
  - **Lowest set bit**: `x & -x`
  - **Remove lowest set bit**: `x & (x − 1)`
  - **Power of two?** `x > 0 and (x & (x − 1)) == 0`
  - **Count set bits**: Python `bin(x).count("1")` or `x.bit_count()`, C++
    `__builtin_popcountll(x)`, Java `Long.bitCount(x)`

  ## XOR's superpower

  XOR is its own inverse: `a ^ a = 0` and `a ^ 0 = a`, and order doesn't matter. So XOR-ing
  a list where every value appears twice except one leaves exactly that one:

  ```python
  def single(nums):
      result = 0
      for x in nums:
          result ^= x
      return result
  ```

  ```cpp
  long long single(const vector<long long>& nums) {
      long long r = 0;
      for (long long x : nums) r ^= x;
      return r;
  }
  ```

  ```java
  static long single(long[] nums) {
      long r = 0;
      for (long x : nums) r ^= x;
      return r;
  }
  ```

  O(n) time, O(1) space — no hash set needed.

  ## Bitmasks as sets

  A number from `0` to `2^n − 1` can represent a **subset** of n items: bit i set means item
  i is included. Looping `mask` over that range enumerates every subset, which is a compact
  alternative to recursion and the basis of **bitmask DP** (common in competitive
  programming for n ≤ 20).

  ```python
  items = [3, 5, 7]
  for mask in range(1 << len(items)):
      subset = [items[i] for i in range(len(items)) if mask >> i & 1]
  ```

  ## Language notes

  - Python integers are unbounded; `~x` is `−x − 1`.
  - In C++ and Java, shifting `1 << 40` overflows an `int`; write `1LL << 40` (C++) or
    `1L << 40` (Java).
  - Java's `>>>` shifts in zeros (unsigned); `>>` keeps the sign.

  ## Worked walkthrough

  Write 13 as 1101. AND with 0100 tests bit two. Clearing that bit gives 1001. Repeated x & (x−1) clears the lowest set bit: 1101→1100→1000→0000. Trace bits rather than only decimal results.

  ### Why this works

  A mask selects positions an operation may affect. XOR cancels equal values, but the surrounding frequency assumptions must still be established.

  ### Boundary cases and cost

  Use a sufficiently wide mask before shifting. Signed and out-of-range shifts differ by language; Python needs an explicit width to emulate bounded words.

  Bit operations are O(1) for bounded words. Enumerating all subsets of k bits still costs O(2ᵏ).

  ### Check your understanding

  Which positive values satisfy x & (x−1) == 0?

  Try it on paper before reading the reasoning below.

  > Powers of two have exactly one set bit. Also check x>0, because zero satisfies the AND expression too.

key_points:
  - AND, OR, XOR, NOT and shifts manipulate bits directly.
  - x & (x − 1) removes the lowest set bit; power of two ⇔ x > 0 and x & (x − 1) == 0.
  - XOR cancels pairs - a ^ a = 0, so XOR of all values finds the unpaired one.
  - Masks from 0 to 2^n − 1 enumerate all subsets.
  - Use 64-bit shifts (1LL, 1L) for large bit positions.
pitfalls:
  - Operator precedence — wrap bit expressions in parentheses (in C++/Java & binds weaker than ==).
  - Overflow from 1 << k with 32-bit ints.
  - Python's ~ producing negative numbers unexpectedly.
