id: backtracking
title: Backtracking
summary: Explore every choice recursively — choose, explore, un-choose — and prune branches that cannot succeed.
module: recursive-structures
prerequisites: [zero:recursion, complexity, recursion-patterns]
difficulty: 4
estimated_minutes: 60
lesson: |
  ## The big idea

  Some problems ask for **all** solutions, or need trying combinations: subsets,
  permutations, placing N queens, solving a Sudoku, finding a word in a grid. **Backtracking**
  builds a solution one decision at a time; whenever a partial solution cannot lead to a
  valid answer, it **undoes** the last decision and tries the next option.

  ## The template: choose → explore → un-choose

  ```python
  def subsets(nums):
      result, current = [], []
      def go(i):
          if i == len(nums):
              result.append(current[:])   # record a COPY
              return
          current.append(nums[i])         # choose: include nums[i]
          go(i + 1)                       # explore
          current.pop()                   # un-choose
          go(i + 1)                       # explore without nums[i]
      go(0)
      return result
  ```

  ```cpp
  void go(int i, const vector<int>& nums, vector<int>& cur, vector<vector<int>>& res) {
      if (i == (int)nums.size()) { res.push_back(cur); return; }
      cur.push_back(nums[i]);           // choose
      go(i + 1, nums, cur, res);        // explore
      cur.pop_back();                   // un-choose
      go(i + 1, nums, cur, res);
  }
  ```

  ```java
  static void go(int i, int[] nums, List<Integer> cur, List<List<Integer>> res) {
      if (i == nums.length) { res.add(new ArrayList<>(cur)); return; }
      cur.add(nums[i]);                 // choose
      go(i + 1, nums, cur, res);        // explore
      cur.remove(cur.size() - 1);       // un-choose
      go(i + 1, nums, cur, res);
  }
  ```

  The recursion forms a **decision tree**: each level decides one thing. Subsets have 2^n
  leaves; permutations have n! leaves. That is why backtracking is used when n is small
  (roughly ≤ 20 for subsets, ≤ 10 for permutations).

  ## Pruning: cut dead branches early

  The art is stopping early. In **N-Queens**, place one queen per row; before recursing,
  check that no queen already shares the column or a diagonal. Keep three boolean arrays —
  columns, `row + col` diagonals and `row − col` diagonals — so each check is O(1).

  ```python
  def n_queens(n):
      cols, d1, d2 = set(), set(), set()
      def place(r):
          if r == n:
              return 1
          count = 0
          for c in range(n):
              if c in cols or r + c in d1 or r - c in d2:
                  continue                  # prune: attacked square
              cols.add(c); d1.add(r + c); d2.add(r - c)
              count += place(r + 1)
              cols.remove(c); d1.remove(r + c); d2.remove(r - c)
          return count
      return place(0)
  ```

  Other pruning ideas: stop when the running sum already exceeds the target (with
  non-negative numbers), sort candidates so you can `break` early, and skip equal
  neighbours to avoid duplicate results.

  ## Bugs to watch for

  - Appending `current` itself instead of a copy — later changes overwrite every saved
    result.
  - Forgetting to undo state, so choices leak into sibling branches.
  - Not handling duplicates in input (sort, then skip equal values at the same level).

  ## Worked walkthrough

  Enumerate subsets of [a,b]. Exclude/include a, then exclude/include b, obtaining [], [b], [a], [a,b]. With a shared path, append before descending and remove after returning. Copy accepted paths so later mutations cannot overwrite previous answers.

  ### Why this works

  State identifies remaining choices and the partial candidate. Restoring state makes sibling branches start from the same parent. Prune only when no continuation can become valid.

  ### Boundary cases and cost

  Define whether duplicate-valued outputs count separately. Skipping equal sibling choices differs from banning repeated values everywhere.

  All subsets require Ω(2ⁿ) outputs; copying paths may cost O(n2ⁿ) time. Working recursion depth is O(n).

  ### Check your understanding

  Why skip equal choices at the same depth rather than globally?

  Try it on paper before reading the reasoning below.

  > Sibling branches may be equivalent, but choosing equal values from different positions can still be a valid combination.

key_points:
  - Backtracking explores a decision tree - choose, explore, un-choose.
  - Record copies of the current state, never the shared object.
  - Prune branches that can no longer succeed — this is what makes it fast enough.
  - Expect exponential growth; check n is small (≤ ~20 subsets, ≤ ~10 permutations).
pitfalls:
  - Saving a reference to the mutable current list instead of a copy.
  - Missing the un-choose step.
  - Generating duplicate results from duplicate input values.
