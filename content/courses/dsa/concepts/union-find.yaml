id: union-find
title: Union-Find (Disjoint Set Union)
summary: Merge groups and ask "same group?" in near-constant time — connectivity, cycles and Kruskal's MST.
module: graphs
prerequisites: [graph-traversal]
difficulty: 4
estimated_minutes: 50
lesson: |
  ## The big idea

  Suppose friendships arrive one by one and you must keep answering "are these two people
  in the same friend group?". Re-running BFS each time is too slow. **Union-Find** (Disjoint
  Set Union, DSU) maintains groups as trees: each element points to a **parent**, and the
  root names the group.

  - `find(x)`: follow parents to the root.
  - `union(a, b)`: attach one root under the other.

  ## Two optimisations make it near O(1)

  - **Path compression**: during `find`, point every visited node directly at the root.
  - **Union by size (or rank)**: attach the smaller tree under the larger.

  Together, operations cost O(α(n)) amortised — the inverse Ackermann function, which is
  at most 4 for any realistic n. Treat it as constant.

  ```python
  class DSU:
      def __init__(self, n):
          self.parent = list(range(n))
          self.size = [1] * n

      def find(self, x):
          root = x
          while self.parent[root] != root:
              root = self.parent[root]
          while self.parent[x] != root:          # path compression
              self.parent[x], x = root, self.parent[x]
          return root

      def union(self, a, b):
          a, b = self.find(a), self.find(b)
          if a == b:
              return False                       # already connected
          if self.size[a] < self.size[b]:
              a, b = b, a
          self.parent[b] = a                     # smaller under larger
          self.size[a] += self.size[b]
          return True
  ```

  ```cpp
  struct DSU {
      vector<int> p, sz;
      DSU(int n) : p(n), sz(n, 1) { iota(p.begin(), p.end(), 0); }
      int find(int x) { return p[x] == x ? x : p[x] = find(p[x]); }
      bool unite(int a, int b) {
          a = find(a); b = find(b);
          if (a == b) return false;
          if (sz[a] < sz[b]) swap(a, b);
          p[b] = a; sz[a] += sz[b];
          return true;
      }
  };
  ```

  ```java
  static int[] parent, size;
  static int find(int x) {
      while (parent[x] != x) { parent[x] = parent[parent[x]]; x = parent[x]; }  // path halving
      return x;
  }
  static boolean union(int a, int b) {
      a = find(a); b = find(b);
      if (a == b) return false;
      if (size[a] < size[b]) { int t = a; a = b; b = t; }
      parent[b] = a; size[a] += size[b];
      return true;
  }
  ```

  (The recursive C++ `find` is fine in practice because union by size keeps trees shallow.)

  ## Classic uses

  - **Number of components** as edges arrive: start at n, decrement on each successful union.
  - **Cycle detection** in an undirected graph: an edge whose endpoints are already
    connected closes a cycle (*Redundant Connection*).
  - **Kruskal's minimum spanning tree**: sort edges by weight; take each edge that joins two
    different components.

  ## Limits

  DSU only **merges** — it cannot split groups. If edges are deleted, process offline in
  reverse, or use other techniques.

  ## Worked walkthrough

  Start with four singleton sets. Union 0 with 1, then 2 with 3. Union 1 with 3 joins their representatives. Later, connectivity of 0 and 2 depends on their roots, not their immediate parent values.

  ### Why this works

  Roots represent components. Union by size/rank limits growth; path compression shortens future searches without changing component membership. Root numeric identity is incidental.

  ### Boundary cases and cost

  Repeated union of already-connected vertices must not decrease the component count. Ordinary union-find cannot split a set after deleting an edge.

  With both standard optimizations, operations cost amortized O(α(n)) and storage is O(n).

  ### Check your understanding

  Why is comparing immediate parent values insufficient?

  Try it on paper before reading the reasoning below.

  > Different immediate parents can lead to the same ultimate root. Find follows the complete chain.

key_points:
  - DSU keeps groups as trees; the root identifies the group.
  - Path compression + union by size give near-constant amortised operations.
  - union returns whether a merge happened — that detects cycles.
  - Track component count by decrementing on successful unions.
  - Kruskal's MST = sorted edges + DSU.
pitfalls:
  - Comparing elements instead of their roots.
  - Skipping both optimisations, leading to O(n) chains.
  - Expecting DSU to support splitting groups.
