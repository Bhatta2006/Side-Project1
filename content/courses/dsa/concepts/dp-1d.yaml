id: dp-1d
title: Dynamic programming (1D)
summary: Define a state, write the recurrence, fill a table — and turn exponential recursion into linear time.
module: dynamic-programming
prerequisites: [zero:recursion, complexity, dp-introduction]
difficulty: 4
estimated_minutes: 70
lesson: |
  ## The big idea

  **Dynamic programming (DP)** solves problems whose answer is built from answers to
  smaller **overlapping** subproblems. Plain recursion recomputes them exponentially; DP
  computes each **once** and stores it.

  Every DP comes down to four decisions:

  1. **State** — what does `dp[i]` mean, in one precise sentence?
  2. **Transition** — how is `dp[i]` built from smaller states?
  3. **Base cases** — the smallest states, answered directly.
  4. **Answer** — which state (or combination) is the final answer?

  ## Example: house robber

  Houses in a row hold `a[i]` money; you cannot rob two adjacent houses. Maximise the loot.

  - State: `dp[i]` = best loot using houses `0..i`.
  - Transition: either skip house i (`dp[i−1]`) or rob it (`dp[i−2] + a[i]`):
    `dp[i] = max(dp[i−1], dp[i−2] + a[i])`.
  - Base: `dp[0] = a[0]`, `dp[1] = max(a[0], a[1])`.

  ```python
  def rob(a):
      prev2, prev1 = 0, 0            # dp[i-2], dp[i-1]
      for x in a:
          prev2, prev1 = prev1, max(prev1, prev2 + x)
      return prev1
  ```

  ```cpp
  long long rob(const vector<long long>& a) {
      long long prev2 = 0, prev1 = 0;
      for (long long x : a) {
          long long cur = max(prev1, prev2 + x);
          prev2 = prev1; prev1 = cur;
      }
      return prev1;
  }
  ```

  ```java
  static long rob(long[] a) {
      long prev2 = 0, prev1 = 0;
      for (long x : a) {
          long cur = Math.max(prev1, prev2 + x);
          prev2 = prev1; prev1 = cur;
      }
      return prev1;
  }
  ```

  Because each state only needs the previous two, memory drops to O(1).

  ## Example: coin change (minimum coins)

  `dp[x]` = fewest coins to make amount x. For each coin c ≤ x:
  `dp[x] = min(dp[x], dp[x − c] + 1)`, with `dp[0] = 0` and everything else ∞ initially.
  This is the fix for greedy's failure with coins {1, 3, 4}: DP considers *every* last coin.

  ```python
  def min_coins(coins, amount):
      INF = float("inf")
      dp = [0] + [INF] * amount
      for x in range(1, amount + 1):
          for c in coins:
              if c <= x and dp[x - c] + 1 < dp[x]:
                  dp[x] = dp[x - c] + 1
      return dp[amount] if dp[amount] != INF else -1
  ```

  ## Top-down vs bottom-up

  - **Top-down (memoization)**: write the natural recursion, cache results. Easy to derive.
  - **Bottom-up (tabulation)**: fill the table in an order where dependencies are ready. No
    recursion limits, easy to optimise memory.

  Derive top-down, ship bottom-up when inputs are large.

  ## Recognising DP

  Phrases like "number of ways", "minimum/maximum ... such that", "can you reach / make
  ...", with choices at each step whose effects combine, signal DP. If brute force is
  "try every sequence of choices" and subproblems repeat, it is DP.

  ## Counting problems and modulo

  "Number of ways" answers grow fast; take everything modulo 1,000,000,007 at every
  addition.

  ## Worked walkthrough

  Count ways to climb four steps using jumps of one or two. Define dp[i] as ways to reach exactly i. Starting dp[0]=1 gives 1,2,3,5 for heights one through four. Every way ends with one of the two allowed jumps.

  ### Why this works

  Define state in a sentence and partition the final decisions. Counting partitions must be exhaustive and disjoint; optimization combines with min or max instead of addition.

  ### Boundary cases and cost

  Test zero-size input and unreachable states. Zero initialization can look like a free solution in a minimum-cost recurrence.

  This recurrence costs O(n) time and O(n) table space, or O(1) after valid compression.

  ### Check your understanding

  When may the table be reduced to two variables?

  Try it on paper before reading the reasoning below.

  > When each new state needs only the preceding two and reconstruction does not need earlier values. Preserve old values before overwriting.

key_points:
  - DP = state + transition + base cases + answer.
  - Each state is computed once, so exponential recursion becomes polynomial.
  - Top-down (memo) to derive; bottom-up (table) to scale.
  - Often only the last few states are needed — reduce memory to O(1).
  - Counting DPs take results modulo 1e9+7.
pitfalls:
  - A vague state definition — write it as a full sentence.
  - Wrong iteration order so a state is used before it's computed.
  - Forgetting unreachable states (∞ or −1) and printing them as answers.
