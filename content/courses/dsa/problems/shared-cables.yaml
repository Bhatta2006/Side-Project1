  def cases(rng):
      for _ in range(40):
          n = rng.randint(1, 5)
          m = rng.randint(1, 9)
          lines = [f"{n} {m}"]
          for _ in range(m):
              if n == 1:
                  u = v = 1
              else:
                  u, v = rng.sample(range(1, n + 1), 2)
              lines.append(f"{rng.randint(1, 3)} {u} {v}")
          if n == 1:
              lines = ["2 1", "3 1 2"]
          yield "\n".join(lines)
