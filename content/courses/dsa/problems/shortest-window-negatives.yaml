id: shortest-window-negatives
title: Shortest run that pays off
concepts: [sliding-window]
difficulty: hard
statement: |
  A shop logs its daily profit, which can be negative on bad days. Find the length of the
  shortest block of consecutive days whose total profit is at least `S`. If no block reaches
  `S`, print -1.
input_format: |
  The first line contains n and S. The second line contains n integers, the daily profits.
output_format: The shortest valid block length, or -1.
constraints:
  - 1 ≤ n ≤ 200000
  - -10^4 ≤ profit ≤ 10^4
  - 1 ≤ S ≤ 10^9
examples:
  - input: "5 3\n2 -1 2 1 -4"
    output: "2"
    explanation: Days 3 and 4 give 2 + 1 = 3 in just two days.
  - input: "2 5\n1 1"
    output: "-1"
hints:
  - A normal two-pointer window needs non-negative values, because adding a day must never shrink the total. Here it can, so that approach fails.
  - Switch to prefix sums P. A block (i, j] works when P[j] − P[i] ≥ S. For a fixed j, you want the largest i with P[i] ≤ P[j] − S.
  - Keep a deque of candidate start indexes with increasing prefix values. Pop from the front while the block works (that start can never help a later j), and pop from the back any start whose prefix is not smaller than the new one.
approach: |
  Prefix sums P[0..n]. Maintain a deque of indexes with strictly increasing P. For each j:
  while the front i satisfies P[j] − P[i] ≥ S, record j − i and pop it (any later j only makes
  the block longer). Then pop back entries with P ≥ P[j] and push j. Every index enters and
  leaves once, so it is O(n).
reference: |
  import sys
  from collections import deque
  data = sys.stdin.read().split()
  n, S = int(data[0]), int(data[1])
  P = [0]
  for x in map(int, data[2:2 + n]):
      P.append(P[-1] + x)
  dq = deque()
  best = n + 1
  for j in range(n + 1):
      while dq and P[j] - P[dq[0]] >= S:
          best = min(best, j - dq.popleft())
      while dq and P[dq[-1]] >= P[j]:
          dq.pop()
      dq.append(j)
  print(best if best <= n else -1)
brute: |
  import sys
  data = sys.stdin.read().split()
  n, S = int(data[0]), int(data[1])
  a = list(map(int, data[2:2 + n]))
  best = -1
  for i in range(n):
      s = 0
      for j in range(i, n):
          s += a[j]
          if s >= S and (best == -1 or j - i + 1 < best):
              best = j - i + 1
  print(best)
