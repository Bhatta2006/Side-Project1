  def cases(rng):
      for _ in range(40):
          n, q = rng.randint(1, 5), rng.randint(1, 5)
          lines = [f"{n} {q}"]
          for _ in range(n):
              l = rng.randint(1, 10)
              lines.append(f"{l} {rng.randint(l, 12)}")
          lines.append(" ".join(str(rng.randint(1, 13)) for _ in range(q)))
          yield "\n".join(lines)
