  def cases(rng):
      yield "1 1\n1 1\n1"
      yield "1 2\n1 1000000000\n1 1000000000"
      yield "3 3\n5 5\n5 5\n1 9\n5 4 6"
      for n, q, top, span in ((50000, 50000, 10**9, 10**9), (100000, 100000, 1000, 50), (50000, 50000, 10**9, 10)):
          lines = [f"{n} {q}"]
          for _ in range(n):
              l = rng.randint(1, top)
              lines.append(f"{l} {min(10**9, l + rng.randint(0, span))}")
          lines.append(" ".join(str(rng.randint(1, top)) for _ in range(q)))
          yield "\n".join(lines)
      for _ in range(5):
          n, q = rng.randint(1, 10), rng.randint(1, 10)
          lines = [f"{n} {q}"]
          for _ in range(n):
              l = rng.randint(1, 30)
              lines.append(f"{l} {rng.randint(l, 35)}")
          lines.append(" ".join(str(rng.randint(1, 36)) for _ in range(q)))
          yield "\n".join(lines)
