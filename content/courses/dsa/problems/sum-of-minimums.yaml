id: sum-of-minimums
title: Every window's weakest link
concepts: [monotonic-stack]
difficulty: hard
statement: |
  For every contiguous block of an array, take its smallest value. Add up those minimums over
  all blocks and print the total modulo 1 000 000 007.
input_format: |
  The first line contains n. The second line contains n integers.
output_format: The sum of the minimum of every subarray, modulo 1000000007.
constraints:
  - 1 ≤ n ≤ 100000
  - 1 ≤ a[i] ≤ 10^9
examples:
  - input: "4\n3 1 2 4"
    output: "17"
    explanation: The ten blocks have minimums 3, 1, 2, 4, 1, 1, 2, 1, 1, 1.
  - input: "3\n5 5 5"
    output: "30"
hints:
  - There are about n²/2 blocks, which is 2·10^10 for the largest input. Count blocks per element instead of listing them.
  - For each element, count the blocks where it is the minimum, which is (how far it can stretch left) × (how far it can stretch right).
  - Find both stretches with a monotonic stack. To avoid counting a block twice when values tie, use a strict comparison on one side and a non-strict one on the other.
approach: |
  For each i find L[i], the distance to the previous strictly smaller element, and R[i], the
  distance to the next smaller-or-equal element, both with a monotonic stack. Element i is the
  minimum of L[i] · R[i] blocks (ties broken consistently), so the answer is the sum of
  a[i] · L[i] · R[i] mod 1e9+7. O(n).
reference: |
  import sys
  data = sys.stdin.read().split()
  n = int(data[0])
  a = list(map(int, data[1:1 + n]))
  left = [0] * n
  right = [0] * n
  st = []
  for i in range(n):
      while st and a[st[-1]] > a[i]:
          st.pop()
      left[i] = i - (st[-1] if st else -1)
      st.append(i)
  st = []
  for i in range(n - 1, -1, -1):
      while st and a[st[-1]] >= a[i]:
          st.pop()
      right[i] = (st[-1] if st else n) - i
      st.append(i)
  print(sum(a[i] * left[i] * right[i] for i in range(n)) % (10**9 + 7))
brute: |
  import sys
  data = sys.stdin.read().split()
  n = int(data[0])
  a = list(map(int, data[1:1 + n]))
  total = 0
  for i in range(n):
      m = a[i]
      for j in range(i, n):
          m = min(m, a[j])
          total += m
  print(total % (10**9 + 7))
