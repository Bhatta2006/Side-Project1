id: running-median
title: Median on the fly
concepts: [heaps]
difficulty: hard
statement: |
  Numbers arrive one at a time. After each arrival, report the median of everything seen so
  far. When the count is even, report the smaller of the two middle values.
input_format: |
  The first line contains n. The second line contains the n numbers in arrival order.
output_format: n lines, the i-th being the median after the first i numbers.
constraints:
  - 1 ≤ n ≤ 50000
  - -10^9 ≤ x ≤ 10^9
examples:
  - input: "5\n5 2 8 1 9"
    output: "5\n2\n5\n2\n5"
    explanation: "Sorted prefixes: [5], [2,5], [2,5,8], [1,2,5,8], [1,2,5,8,9]. The medians are 5, 2, 5, 2, 5."
  - input: "3\n4 4 4"
    output: "4\n4\n4"
hints:
  - Sorting after every arrival is far too slow. What do you really need — all the values in order, or only the middle one?
  - Split the numbers into a smaller half and a larger half. The median sits at the boundary, so you only need the biggest of the small half.
  - Keep a max-heap for the smaller half and a min-heap for the larger half, with the small half allowed one extra element. After each insert, move one element across if the sizes drift.
approach: |
  Two heaps. `lo` is a max-heap holding the smaller ceil(k/2) values, `hi` is a min-heap with
  the rest. Insert into `lo`, then move lo's top to `hi`, then if `hi` is bigger than `lo`
  move hi's top back. The answer after each step is lo's top. Each step is O(log n).
reference: |
  import sys, heapq
  data = sys.stdin.read().split()
  n = int(data[0])
  lo, hi, out = [], [], []
  for x in map(int, data[1:1 + n]):
      heapq.heappush(lo, -x)
      heapq.heappush(hi, -heapq.heappop(lo))
      if len(hi) > len(lo):
          heapq.heappush(lo, -heapq.heappop(hi))
      out.append(-lo[0])
  print("\n".join(map(str, out)))
brute: |
  import sys
  data = sys.stdin.read().split()
  n = int(data[0])
  a = list(map(int, data[1:1 + n]))
  out = []
  for i in range(1, n + 1):
      s = sorted(a[:i])
      out.append(s[(i - 1) // 2])
  print("\n".join(map(str, out)))
small_generator: |
  def cases(rng):
      for _ in range(60):
          n = rng.randint(1, 12)
          hi = rng.choice([3, 20, 10**9])
          yield f"{n}\n" + " ".join(str(rng.randint(-hi, hi)) for _ in range(n))
