id: four-array-zero-sums
title: Balanced quadruples
concepts: [hashing]
difficulty: hard
statement: |
  You have four lists A, B, C and D, each with `n` integers. Count the quadruples of positions
  (i, j, k, l) with A[i] + B[j] + C[k] + D[l] = 0. Positions are counted separately even if the
  values repeat.
input_format: |
  The first line contains n. The next four lines contain the lists A, B, C and D.
output_format: The number of quadruples with sum zero.
constraints:
  - 1 ≤ n ≤ 1500
  - -10^8 ≤ each value ≤ 10^8
examples:
  - input: "2\n1 2\n-2 -1\n-1 2\n0 2"
    output: "2"
    explanation: The quadruples at positions (0,0,0,1) and (1,1,0,0) both sum to zero.
  - input: "1\n0\n0\n0\n0"
    output: "1"
hints:
  - Four nested loops are n^4, about 5·10^12. Split the four lists into two pairs.
  - All sums A[i] + B[j] number n² ≈ 2·10^6. Likewise for C and D. You need a sum from the first group plus a sum from the second to equal zero.
  - Count the A + B sums in a hash map, then for every C + D sum add the count stored under its negative.
approach: |
  Meet in the middle. Build a counter of all n² sums A[i] + B[j]. For each of the n² sums
  C[k] + D[l], add counter[-(C[k] + D[l])]. Time and memory O(n²), about 2.25·10^6 entries
  at the limit. The answer can reach n^4 so it needs 64-bit (Python is fine).
reference: |
  import sys
  from collections import Counter
  data = sys.stdin.read().split()
  n = int(data[0])
  v = list(map(int, data[1:1 + 4 * n]))
  A, B, C, D = v[:n], v[n:2 * n], v[2 * n:3 * n], v[3 * n:]
  cnt = Counter(a + b for a in A for b in B)
  print(sum(cnt.get(-(c + d), 0) for c in C for d in D))
brute: |
  import sys
  data = sys.stdin.read().split()
  n = int(data[0])
  v = list(map(int, data[1:1 + 4 * n]))
  A, B, C, D = v[:n], v[n:2 * n], v[2 * n:3 * n], v[3 * n:]
  print(sum(1 for a in A for b in B for c in C for d in D if a + b + c + d == 0))
small_generator: |
  def cases(rng):
      for _ in range(60):
          n = rng.randint(1, 6)
          hi = rng.choice([1, 3, 10**8])
          rows = [" ".join(str(rng.randint(-hi, hi)) for _ in range(n)) for _ in range(4)]
          yield f"{n}\n" + "\n".join(rows)
generator: |
  def cases(rng):
      yield "2\n1 2\n-2 -1\n-1 2\n0 2"
      yield "1\n0\n0\n0\n0"
      n = 1500
      row = lambda: " ".join(str(rng.randint(-10**8, 10**8)) for _ in range(n))
      yield f"{n}\n" + "\n".join(row() for _ in range(4))
      zeros = " ".join("0" for _ in range(n))
      yield f"{n}\n" + "\n".join([zeros] * 4)
      small = lambda: " ".join(str(rng.randint(-3, 3)) for _ in range(n))
      yield f"{n}\n" + "\n".join(small() for _ in range(4))
      for _ in range(5):
          m = rng.randint(1, 120)
          rows = [" ".join(str(rng.randint(-20, 20)) for _ in range(m)) for _ in range(4)]
          yield f"{m}\n" + "\n".join(rows)
