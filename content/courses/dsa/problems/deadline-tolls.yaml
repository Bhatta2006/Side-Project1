  def cases(rng):
      for _ in range(40):
          n = rng.randint(2, 4)
          m = rng.randint(1, 5)
          T = rng.randint(1, 8)
          lines = [f"{n} {m} {T}", " ".join(str(rng.randint(1, 9)) for _ in range(n))]
          for _ in range(m):
              u, v = rng.sample(range(n), 2)
              lines.append(f"{u} {v} {rng.randint(2, 5)}")
          yield "\n".join(lines)
