id: deadline-tolls
title: Tolls before the deadline
concepts: [shortest-paths]
difficulty: hard
statement: |
  There are `n` cities numbered `0..n-1` and `m` two-way roads; road `i` joins `u` and `v` and
  takes `w` minutes. Every city charges an entry toll `fee[c]`, paid each time you are in it
  (including the start city 0 and the destination `n-1`). Two cities may be joined by several
  roads.

  You must get from city 0 to city `n-1` within `T` minutes in total. Print the smallest total
  toll you can pay, or `-1` if no route arrives in time. Revisiting cities is allowed but you
  pay the toll again.
input_format: |
  The first line contains n, m and T. The second line contains fee[0..n-1].
  Each of the next m lines contains u, v and w.
output_format: The smallest total toll, or -1.
constraints:
  - 2 ≤ n ≤ 1000
  - 1 ≤ m ≤ 1000
  - 1 ≤ T ≤ 1000
  - 1 ≤ w ≤ 1000, 1 ≤ fee[c] ≤ 1000
examples:
  - input: "4 4 10\n5 1 2 3\n0 1 5\n1 3 5\n0 2 2\n2 3 9\n"
    output: "9"
    explanation: "0 → 1 → 3 takes 10 minutes and costs 5 + 1 + 3. 0 → 2 → 3 costs 10 and takes 11."
  - input: "4 4 9\n5 1 2 3\n0 1 5\n1 3 5\n0 2 2\n2 3 9\n"
    output: "-1"
  - input: "3 3 6\n1 50 1\n0 1 1\n1 2 1\n0 2 6\n"
    output: "2"
hints:
  - The cheapest route may be slow and the quickest route may be expensive. Can a single distance per city capture both?
  - A city reached at minute 4 for 20 coins is not comparable with the same city at minute 7 for 10 coins. Add time to the state.
  - "best[t][c] = the smallest toll to stand in city c at exactly minute t. Fill t = 0..T in order: each road moves you from (t, u) to (t + w, v), paying fee[v]. The answer is min over t ≤ T of best[t][n-1]."
approach: |
  Two quantities compete (time and toll), so a plain Dijkstra on cities fails: settling a
  city at its cheapest toll can throw away a dearer but quicker way in that is the only one
  meeting the deadline. With T ≤ 1000 make time part of the state: best[t][c] = cheapest toll
  to be at c at minute t, best[0][0] = fee[0]. Process t increasing (every road takes ≥ 1
  minute, so all ways into minute t come from earlier minutes) and relax each road both ways.
  O(T · (n + m)). (Dijkstra over (city, time) with a heap is the same idea.)
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n, m, T = int(data[0]), int(data[1]), int(data[2])
  fee = [int(x) for x in data[3:3 + n]]
  pos = 3 + n
  roads = []
  for _ in range(m):
      u, v, w = int(data[pos]), int(data[pos + 1]), int(data[pos + 2])
      pos += 3
      roads.append((u, v, w))
      roads.append((v, u, w))
  INF = float("inf")
  best = [[INF] * n for _ in range(T + 1)]
  best[0][0] = fee[0]
  for t in range(T + 1):
      row = best[t]
      for u, v, w in roads:
          cost = row[u]
          if cost < INF and t + w <= T:
              c = cost + fee[v]
              if c < best[t + w][v]:
                  best[t + w][v] = c
  answer = min(best[t][n - 1] for t in range(T + 1))
  print(answer if answer < INF else -1)
brute: |
  import sys
  sys.setrecursionlimit(10000)
  data = sys.stdin.read().split()
  n, m, T = int(data[0]), int(data[1]), int(data[2])
  fee = [int(x) for x in data[3:3 + n]]
  adj = [[] for _ in range(n)]
  pos = 3 + n
  for _ in range(m):
      u, v, w = int(data[pos]), int(data[pos + 1]), int(data[pos + 2])
      pos += 3
      adj[u].append((v, w))
      adj[v].append((u, w))
  best = [float("inf")]
  def walk(c, t, cost):
      if c == n - 1:
          best[0] = min(best[0], cost)
      for v, w in adj[c]:
          if t + w <= T:
              walk(v, t + w, cost + fee[v])
  walk(0, 0, fee[0])
  print(best[0] if best[0] < float("inf") else -1)
