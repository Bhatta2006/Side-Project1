  def cases(rng):
      yield "1 1 0\n."
      yield "1 5 0\n.....\n"
      yield "1 5 2\n.###.\n"
      yield "1 5 3\n.###.\n"
      for density, k in ((0.3, 0), (0.45, 2), (0.6, 5), (0.75, 30), (0.5, 1)):
          R, C = 40, 40
          rows = ["".join("#" if rng.random() < density else "." for _ in range(C)) for _ in range(R)]
          rows[0] = "." + rows[0][1:]
          rows[-1] = rows[-1][:-1] + "."
          yield f"{R} {C} {k}\n" + "\n".join(rows)
      # A long snake corridor: going around is far longer than breaking through.
      rows = []
      for r in range(39):
          if r % 2 == 0:
              rows.append("." * 40)
          else:
              rows.append(("#" * 39 + ".") if r % 4 == 1 else ("." + "#" * 39))
      rows.append("." * 40)
      for k in (0, 3, 30):
          yield f"40 40 {k}\n" + "\n".join(rows)
      for density, k in ((0.35, 30), (0.5, 8)):
          rows = ["".join("#" if rng.random() < density else "." for _ in range(100)) for _ in range(100)]
          rows[0] = "." + rows[0][1:]
          rows[-1] = rows[-1][:-1] + "."
          yield f"100 100 {k}\n" + "\n".join(rows)
      for _ in range(6):
          R, C = rng.randint(2, 8), rng.randint(2, 8)
          rows = ["".join("#" if rng.random() < 0.5 else "." for _ in range(C)) for _ in range(R)]
          rows[0] = "." + rows[0][1:]
          rows[-1] = rows[-1][:-1] + "."
          yield f"{R} {C} {rng.randint(0, 4)}\n" + "\n".join(rows)
