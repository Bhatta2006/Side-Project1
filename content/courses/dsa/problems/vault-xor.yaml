id: vault-xor
title: Vault codes under a limit
concepts: [tries]
difficulty: hard
statement: |
  A vault accepts a code `a` from a list of `n` stored numbers. For each of `q` queries you are
  given a key `x` and a limit `m`: choose a stored number `a` with `a ≤ m` that makes
  `x XOR a` as large as possible, and print that value. If no stored number is `≤ m`, print `-1`.
input_format: |
  The first line contains n and q. The second line contains the n stored numbers.
  Each of the next q lines contains x and m.
output_format: One line per query.
constraints:
  - 1 ≤ n, q ≤ 20000
  - 0 ≤ stored numbers, x, m ≤ 10^9
examples:
  - input: "5 3\n0 1 2 3 4\n3 1\n1 3\n5 6\n"
    output: "3\n3\n7"
    explanation: "Query 1: only 0 and 1 are ≤ 1; 3 XOR 0 = 3. Query 3: 5 XOR 2 = 7."
  - input: "2 2\n6 9\n5 4\n12 100\n"
    output: "-1\n10"
hints:
  - Without the limit, a binary trie of the numbers answers each query greedily from the highest bit. Which branch do you prefer at each bit?
  - The limit is the hard part. What if the trie only ever contained numbers ≤ m?
  - Answer the queries offline in increasing m, inserting stored numbers into the trie as m grows. Each query then walks 30 bits, preferring the bit opposite to x's.
approach: |
  Sort the stored numbers and the queries by m. Sweep: before answering a query, insert every
  stored number ≤ m into a binary trie (30 levels). To maximise x XOR a, walk from the top bit
  and take the child whose bit differs from x's whenever it exists. An empty trie means -1.
  O((n + q) · 30) after sorting. The greedy is safe because a higher bit outweighs all lower
  bits together.
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  n, q = int(data[0]), int(data[1])
  nums = sorted(map(int, data[2:2 + n]))
  queries = []
  pos = 2 + n
  for i in range(q):
      queries.append((int(data[pos + 1]), int(data[pos]), i))
      pos += 2
  queries.sort()
  B = 30
  zero, one = [0], [0]
  out = [0] * q
  j = 0
  size = 0
  for m, x, i in queries:
      while j < n and nums[j] <= m:
          node = 0
          v = nums[j]
          for b in range(B - 1, -1, -1):
              if (v >> b) & 1:
                  if not one[node]:
                      zero.append(0); one.append(0)
                      one[node] = len(zero) - 1
                  node = one[node]
              else:
                  if not zero[node]:
                      zero.append(0); one.append(0)
                      zero[node] = len(zero) - 1
                  node = zero[node]
          j += 1
          size += 1
      if size == 0:
          out[i] = -1
          continue
      node = 0
      best = 0
      for b in range(B - 1, -1, -1):
          if (x >> b) & 1:
              if zero[node]:
                  best |= 1 << b
                  node = zero[node]
              else:
                  node = one[node]
          else:
              if one[node]:
                  best |= 1 << b
                  node = one[node]
              else:
                  node = zero[node]
      out[i] = best
  print("\n".join(map(str, out)))
brute: |
  import sys
  data = sys.stdin.read().split()
  n, q = int(data[0]), int(data[1])
  nums = list(map(int, data[2:2 + n]))
  pos = 2 + n
  out = []
  for _ in range(q):
      x, m = int(data[pos]), int(data[pos + 1])
      pos += 2
      fit = [a for a in nums if a <= m]
      out.append(max(x ^ a for a in fit) if fit else -1)
  print("\n".join(map(str, out)))
