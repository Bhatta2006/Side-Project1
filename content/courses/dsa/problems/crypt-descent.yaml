id: crypt-descent
title: Crypt descent
concepts: [dp-2d]
difficulty: hard
statement: |
  An explorer enters an `R × C` crypt at the top-left room and must reach the bottom-right
  room, moving only right or down. Room `(r, c)` changes their health by `g[r][c]` (negative
  is a trap, positive is a potion), including the first and last rooms.

  Health must stay **at least 1** at every moment, including right after entering each room.
  Print the smallest starting health that makes the trip possible.
input_format: |
  The first line contains R and C. The next R lines each contain C integers.
output_format: The smallest starting health.
constraints:
  - 1 ≤ R, C ≤ 500
  - -1000 ≤ g[r][c] ≤ 1000
examples:
  - input: "3 3\n-2 -3 3\n-5 -10 1\n10 30 -5\n"
    output: "7"
    explanation: "Right, right, down, down: health 7 → 5 → 2 → 5 → 6 → 1."
  - input: "1 1\n5\n"
    output: "1"
  - input: "2 2\n0 -5\n-1 0\n"
    output: "2"
hints:
  - Try filling a table from the top-left forwards. What do you store per room, and why is one number not enough?
  - Going forwards, a room needs both the health you have and the lowest point you passed. Going backwards from the exit, one number suffices. Which one?
  - "need[r][c] = the smallest health on entering (r, c) that still finishes. At the exit, need = max(1, 1 − g). Elsewhere need = max(1, min(need right, need below) − g[r][c])."
approach: |
  Forward DP fails: a path with more health now may have dipped lower earlier, so one value
  per cell can't decide. Backwards it works: need[r][c] is the smallest health you can walk
  into room (r, c) with and still finish. Leaving through the better neighbour you must arrive
  there with min(need right, need below), so before this room's change you need that minus
  g[r][c], and never below 1. The answer is need[0][0]. O(R · C), one row of memory if you like.
reference: |
  import sys
  data = sys.stdin.buffer.read().split()
  R, C = int(data[0]), int(data[1])
  g = [[int(data[2 + r * C + c]) for c in range(C)] for r in range(R)]
  INF = float("inf")
  nxt = [INF] * (C + 1)
  for r in range(R - 1, -1, -1):
      cur = [INF] * (C + 1)
      for c in range(C - 1, -1, -1):
          best = min(nxt[c], cur[c + 1])
          if best == INF:
              best = 1
          cur[c] = max(1, best - g[r][c])
      nxt = cur
  print(nxt[0])
brute: |
  import sys
  from itertools import combinations
  data = sys.stdin.read().split()
  R, C = int(data[0]), int(data[1])
  g = [[int(data[2 + r * C + c]) for c in range(C)] for r in range(R)]
  best = None
  for downs in combinations(range(R + C - 2), R - 1):
      r = c = 0
      total = g[0][0]
      low = total
      for step in range(R + C - 2):
          if step in downs:
              r += 1
          else:
              c += 1
          total += g[r][c]
          low = min(low, total)
      need = max(1, 1 - low)
      best = need if best is None else min(best, need)
  print(best)
