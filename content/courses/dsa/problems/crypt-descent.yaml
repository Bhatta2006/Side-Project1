  def cases(rng):
      yield "1 1\n-1000"
      yield "1 5\n-1 -1 -1 -1 -1"
      yield "2 2\n1000 -1000\n-1000 1000"
      for R, C, lo, hi in ((500, 500, -1000, 1000), (500, 500, -1000, 50), (1, 500, -5, 5), (500, 1, -1000, 1000)):
          rows = [" ".join(str(rng.randint(lo, hi)) for _ in range(C)) for _ in range(R)]
          yield f"{R} {C}\n" + "\n".join(rows)
      for _ in range(5):
          R, C = rng.randint(2, 6), rng.randint(2, 6)
          rows = [" ".join(str(rng.randint(-20, 15)) for _ in range(C)) for _ in range(R)]
          yield f"{R} {C}\n" + "\n".join(rows)
