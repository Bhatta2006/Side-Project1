quiz:
  - id: rounds
    kind: output
    prompt: How many times does the loop body run (what is printed)?
    code:
      python: "i = 0\nrounds = 0\nwhile i < 10:\n    i = i + 3\n    rounds += 1\nprint(rounds)\n"
      cpp: "int i = 0, rounds = 0;\nwhile (i < 10) {\n    i = i + 3;\n    rounds++;\n}\ncout << rounds;\n"
      java: "int i = 0, rounds = 0;\nwhile (i < 10) {\n    i = i + 3;\n    rounds++;\n}\nSystem.out.println(rounds);\n"
    options:
    - '4'
    - '3'
    - '10'
    - '5'
    answer: 0
    explanation: i goes 0, 3, 6, 9 at the start of each round (all below 10) and reaches 12 after the fourth,
      so the body runs 4 times. List the values rather than guessing from 10 / 3.
    difficulty: 2
  - id: halving-count
    kind: output
    prompt: Starting from 100, how many halvings (whole-number division) does it take to get down to 1?
      What is printed?
    code:
      python: "n = 100\ncount = 0\nwhile n > 1:\n    n //= 2\n    count += 1\nprint(count)\n"
      cpp: "int n = 100, count = 0;\nwhile (n > 1) {\n    n /= 2;\n    count++;\n}\ncout << count;\n"
      java: "int n = 100, count = 0;\nwhile (n > 1) {\n    n /= 2;\n    count++;\n}\nSystem.out.println(count);\n"
    options:
    - '6'
    - '7'
    - '50'
    - '5'
    answer: 0
    explanation: 100 → 50 → 25 → 12 → 6 → 3 → 1 is six steps. Each halving drops a fraction, so the answer
      is the floor of log base 2 of 100 — about 6.6 rounded down.
    difficulty: 3
  - id: zero-input
    kind: output
    prompt: This digit-sum loop is given 0. What is printed (the total, then the number of rounds)?
    code:
      python: "n = 0\ntotal = 0\nrounds = 0\nwhile n > 0:\n    total += n % 10\n    n //= 10\n    rounds\
        \ += 1\nprint(total, rounds)\n"
      cpp: "int n = 0, total = 0, rounds = 0;\nwhile (n > 0) {\n    total += n % 10;\n    n /= 10;\n   \
        \ rounds++;\n}\ncout << total << \" \" << rounds;\n"
      java: "int n = 0, total = 0, rounds = 0;\nwhile (n > 0) {\n    total += n % 10;\n    n /= 10;\n  \
        \  rounds++;\n}\nSystem.out.println(total + \" \" + rounds);\n"
    options:
    - 0 0
    - 0 1
    - Error
    - It never stops
    answer: 0
    explanation: 0 > 0 is false right away, so the body is skipped and total stays at its starting value,
      which happens to be the correct digit sum of 0.
    difficulty: 3
  - id: digit-sum
    kind: output
    prompt: Peeling off one digit per round. What is printed for 4821?
    code:
      python: "n = 4821\ntotal = 0\nwhile n > 0:\n    total += n % 10\n    n //= 10\nprint(total)\n"
      cpp: "int n = 4821, total = 0;\nwhile (n > 0) {\n    total += n % 10;\n    n /= 10;\n}\ncout << total;\n"
      java: "int n = 4821, total = 0;\nwhile (n > 0) {\n    total += n % 10;\n    n /= 10;\n}\nSystem.out.println(total);\n"
    options:
    - '15'
    - '14'
    - '4821'
    - '12'
    answer: 0
    explanation: The digits come out as 1, 2, 8, 4 (last to first) and add to 15. n % 10 reads the last
      digit and n / 10 removes it, so n shrinks every round.
    difficulty: 2
  - id: doubling-past
    kind: output
    prompt: Doubling a number until it reaches at least 100. What is printed (the value, then the number
      of doublings)?
    code:
      python: "x = 1\nsteps = 0\nwhile x < 100:\n    x *= 2\n    steps += 1\nprint(x, steps)\n"
      cpp: "int x = 1, steps = 0;\nwhile (x < 100) {\n    x *= 2;\n    steps++;\n}\ncout << x << \" \" <<\
        \ steps;\n"
      java: "int x = 1, steps = 0;\nwhile (x < 100) {\n    x *= 2;\n    steps++;\n}\nSystem.out.println(x\
        \ + \" \" + steps);\n"
    options:
    - 128 7
    - 100 7
    - 128 6
    - 64 6
    answer: 0
    explanation: 1, 2, 4, 8, 16, 32, 64 are all below 100, so one more doubling happens and gives 128. The
      loop overshoots the target, and 7 doublings were made.
    difficulty: 3
  - id: off-by-one
    kind: output
    prompt: Two loops count rounds for n = 5, one with <= and one with <. What is printed?
    code:
      python: "n = 5\na = 0\ni = 1\nwhile i <= n:\n    a += 1\n    i += 1\nb = 0\ni = 1\nwhile i < n:\n\
        \    b += 1\n    i += 1\nprint(a, b)\n"
      cpp: 'int n = 5, a = 0, b = 0, i = 1;

        while (i <= n) { a++; i++; }

        i = 1;

        while (i < n) { b++; i++; }

        cout << a << " " << b;

        '
      java: 'int n = 5, a = 0, b = 0, i = 1;

        while (i <= n) { a++; i++; }

        i = 1;

        while (i < n) { b++; i++; }

        System.out.println(a + " " + b);

        '
    options:
    - 5 4
    - 5 5
    - 4 4
    - 4 5
    answer: 0
    explanation: Starting from 1, i <= 5 allows the values 1 to 5 (five rounds), but i < 5 stops after 4
      (four rounds). One character in the condition changes the count by one.
    difficulty: 3
  - id: sentinel
    kind: output
    prompt: The loop adds numbers until it meets a 0, which marks the end of the data. What is printed?
    code:
      python: "data = [5, 3, 0, 9]\ni = 0\ntotal = 0\nwhile data[i] != 0:\n    total += data[i]\n    i +=\
        \ 1\nprint(total)\n"
      cpp: "int data[] = {5, 3, 0, 9};\nint i = 0, total = 0;\nwhile (data[i] != 0) {\n    total += data[i];\n\
        \    i++;\n}\ncout << total;\n"
      java: "int[] data = {5, 3, 0, 9};\nint i = 0, total = 0;\nwhile (data[i] != 0) {\n    total += data[i];\n\
        \    i++;\n}\nSystem.out.println(total);\n"
    options:
    - '8'
    - '17'
    - '5'
    - '3'
    answer: 0
    explanation: 5 and 3 are added; at the 0 the loop stops, so the 9 after it is never read. A special
      value that means 'stop' is called a sentinel.
    difficulty: 3
  - id: collatz
    kind: output
    prompt: If n is even halve it, otherwise do 3n + 1, until n is 1. How many steps does 6 take? What is
      printed?
    code:
      python: "n = 6\nsteps = 0\nwhile n != 1:\n    if n % 2 == 0:\n        n //= 2\n    else:\n       \
        \ n = 3 * n + 1\n    steps += 1\nprint(steps)\n"
      cpp: "int n = 6, steps = 0;\nwhile (n != 1) {\n    if (n % 2 == 0) n /= 2;\n    else n = 3 * n + 1;\n\
        \    steps++;\n}\ncout << steps;\n"
      java: "int n = 6, steps = 0;\nwhile (n != 1) {\n    if (n % 2 == 0) n /= 2;\n    else n = 3 * n +\
        \ 1;\n    steps++;\n}\nSystem.out.println(steps);\n"
    options:
    - '8'
    - '6'
    - '7'
    - '9'
    answer: 0
    explanation: 6 → 3 → 10 → 5 → 16 → 8 → 4 → 2 → 1 is eight steps. The path goes up before it comes down,
      so you cannot guess the count from the size of n.
    difficulty: 4
  - id: reverse-digits
    kind: output
    prompt: Reversing a number by moving its last digit onto a new number each round. What is printed for
      1230?
    code:
      python: "n = 1230\nrev = 0\nwhile n > 0:\n    rev = rev * 10 + n % 10\n    n //= 10\nprint(rev)\n"
      cpp: "int n = 1230, rev = 0;\nwhile (n > 0) {\n    rev = rev * 10 + n % 10;\n    n /= 10;\n}\ncout\
        \ << rev;\n"
      java: "int n = 1230, rev = 0;\nwhile (n > 0) {\n    rev = rev * 10 + n % 10;\n    n /= 10;\n}\nSystem.out.println(rev);\n"
    options:
    - '321'
    - '0321'
    - '3210'
    - '1230'
    answer: 0
    explanation: The trailing 0 becomes a leading 0 of the result, and a number cannot keep a leading zero,
      so the answer is 321. If you need the zero, treat the input as text instead.
    difficulty: 5
  - id: never-ends
    kind: mcq
    prompt: This loop is meant to print 10, 8, 6, 4 and 2, and then stop. Why does it never stop?
    options:
    - n goes 10, 8, 6, 4, 2, 0, -2 and skips over 1, so n != 1 is always true
    - print ends each round early, so n never gets a chance to change
    - n -= 2 makes a new n and leaves the loop's n unchanged
    - A while loop needs a separate counter to know when to stop
    answer: 0
    explanation: Subtracting 2 from an even number never lands on 1. Testing for an exact value is fragile;
      test with n > 0 (or n >= 2) so the loop also stops if the value steps past it.
    difficulty: 4
    code:
      python: "n = 10\nwhile n != 1:\n    print(n)\n    n -= 2\n"
      cpp: "int n = 10;\nwhile (n != 1) {\n    cout << n << endl;\n    n -= 2;\n}\n"
      java: "int n = 10;\nwhile (n != 1) {\n    System.out.println(n);\n    n -= 2;\n}\n"
