quiz:
  - id: pass-boundary
    kind: output
    prompt: A student needs at least 50 to pass. What is printed?
    code:
      python: "score = 50\nif score >= 50:\n    print(\"pass\")\nelse:\n    print(\"fail\")\n"
      cpp: 'int score = 50;

        if (score >= 50) cout << "pass";

        else cout << "fail";

        '
      java: 'int score = 50;

        if (score >= 50) System.out.println("pass");

        else System.out.println("fail");

        '
    options:
    - pass
    - fail
    - pass fail
    - Nothing
    answer: 0
    explanation: '>= includes the boundary value itself, so exactly 50 passes. With > the same score would
      fail, which is the classic off-by-one in conditions.'
    difficulty: 1
  - id: first-match-wins
    kind: output
    prompt: In an if / else-if chain only the first branch whose condition is true runs. What is printed?
    code:
      python: "x = 15\nif x > 5:\n    print(\"big\")\nelif x > 10:\n    print(\"huge\")\nelse:\n    print(\"\
        small\")\n"
      cpp: 'int x = 15;

        if (x > 5) cout << "big";

        else if (x > 10) cout << "huge";

        else cout << "small";

        '
      java: 'int x = 15;

        if (x > 5) System.out.println("big");

        else if (x > 10) System.out.println("huge");

        else System.out.println("small");

        '
    options:
    - big
    - huge
    - big huge
    - small
    answer: 0
    explanation: x > 5 is true, so that branch runs and the rest of the chain is skipped, even though x
      > 10 would also be true. Put the most specific test first.
    difficulty: 2
  - id: separate-ifs
    kind: output
    prompt: These are two separate if statements, not a chain. What is printed?
    code:
      python: "x = 15\nif x > 5:\n    print(\"big\")\nif x > 10:\n    print(\"huge\")\n"
      cpp: 'int x = 15;

        if (x > 5) cout << "big" << endl;

        if (x > 10) cout << "huge" << endl;

        '
      java: 'int x = 15;

        if (x > 5) System.out.println("big");

        if (x > 10) System.out.println("huge");

        '
    options:
    - big huge
    - big
    - huge
    - Nothing
    answer: 0
    explanation: Each if is checked on its own, so both conditions are true and both lines print. The else-if
      form is what makes the choices exclusive.
    difficulty: 3
  - id: adult-boundary
    kind: output
    prompt: A cinema lets in anyone older than 18 for the late show. What is printed for someone who is
      exactly 18?
    code:
      python: "age = 18\nif age > 18:\n    print(\"adult\")\nelse:\n    print(\"minor\")\n"
      cpp: 'int age = 18;

        if (age > 18) cout << "adult";

        else cout << "minor";

        '
      java: 'int age = 18;

        if (age > 18) System.out.println("adult");

        else System.out.println("minor");

        '
    options:
    - minor
    - adult
    - adult minor
    - Nothing
    answer: 0
    explanation: '> 18 is false for exactly 18, so the else branch runs. If the rule is ''at least 18'',
      the code must say >=. Always test the boundary value by hand.'
    difficulty: 2
  - id: leap-year
    kind: output
    prompt: A year is a leap year if it divides by 4, except centuries, which must divide by 400. This tests
      1900 and then 2000. What is printed?
    code:
      python: "for y in (1900, 2000):\n    leap = y % 4 == 0 and (y % 100 != 0 or y % 400 == 0)\n    print(\"\
        leap\" if leap else \"common\")\n"
      cpp: "for (int y : {1900, 2000}) {\n    bool leap = y % 4 == 0 && (y % 100 != 0 || y % 400 == 0);\n\
        \    cout << (leap ? \"leap\" : \"common\") << endl;\n}\n"
      java: "for (int y : new int[]{1900, 2000}) {\n    boolean leap = y % 4 == 0 && (y % 100 != 0 || y\
        \ % 400 == 0);\n    System.out.println(leap ? \"leap\" : \"common\");\n}\n"
    options:
    - common leap
    - leap leap
    - leap common
    - common common
    answer: 0
    explanation: '1900 divides by 4 and by 100 but not by 400, so it is common. 2000 divides by 400, so
      it is a leap year. The brackets matter: without them && would bind tighter than ||.'
    difficulty: 4
  - id: ordering-bug
    kind: bug
    prompt: This FizzBuzz check should print FizzBuzz for 15, but it does not. What does it print for 15?
    code:
      python: "n = 15\nif n % 3 == 0:\n    print(\"Fizz\")\nelif n % 5 == 0:\n    print(\"Buzz\")\nelif\
        \ n % 15 == 0:\n    print(\"FizzBuzz\")\nelse:\n    print(n)\n"
      cpp: 'int n = 15;

        if (n % 3 == 0) cout << "Fizz";

        else if (n % 5 == 0) cout << "Buzz";

        else if (n % 15 == 0) cout << "FizzBuzz";

        else cout << n;

        '
      java: 'int n = 15;

        if (n % 3 == 0) System.out.println("Fizz");

        else if (n % 5 == 0) System.out.println("Buzz");

        else if (n % 15 == 0) System.out.println("FizzBuzz");

        else System.out.println(n);

        '
    options:
    - Fizz
    - FizzBuzz
    - Buzz
    - '15'
    answer: 0
    explanation: 15 divides by 3, so the first branch wins and the n % 15 test is never reached. The most
      specific condition has to come first in a chain.
    difficulty: 4
  - id: guard-first
    kind: output
    prompt: The first test protects the second from dividing by zero. What is printed?
    code:
      python: "x = 0\nif x != 0 and 10 // x > 1:\n    print(\"big\")\nelse:\n    print(\"skip\")\n"
      cpp: 'int x = 0;

        if (x != 0 && 10 / x > 1) cout << "big";

        else cout << "skip";

        '
      java: 'int x = 0;

        if (x != 0 && 10 / x > 1) System.out.println("big");

        else System.out.println("skip");

        '
    options:
    - skip
    - big
    - 'Error: division by zero'
    - Nothing
    answer: 0
    explanation: The and stops as soon as the left side is false, so the division is never attempted. Put
      the safety check on the left, and the risky one on the right.
    difficulty: 3
  - id: python-truthiness
    kind: output
    languages:
    - python
    prompt: In Python, empty and zero values count as false in a condition, and everything else counts as
      true. What is printed?
    code:
      python: "for v in (0, \"\", [], \"0\"):\n    print(\"yes\" if v else \"no\", end=\" \")\n"
    options:
    - no no no yes
    - no no no no
    - yes yes yes yes
    - no yes no yes
    answer: 0
    explanation: 0, the empty string and the empty list are false. The text "0" is a non-empty string, so
      it is true. This is why `if items:` is a common way to test for a non-empty list.
    difficulty: 4
  - id: assignment-in-condition
    kind: output
    languages:
    - cpp
    prompt: A single = inside the brackets assigns instead of comparing, and C++ accepts it. What is printed?
    code:
      cpp: 'int x = 0;

        if (x = 5) cout << "yes ";

        cout << x;

        '
    options:
    - yes 5
    - '0'
    - yes 0
    - '5'
    answer: 0
    explanation: x = 5 stores 5 in x, and the value of that expression is 5, which counts as true. The condition
      both changed x and passed. Use == to compare. (Python and Java reject this form.)
    difficulty: 4
  - id: java-string-compare
    kind: output
    languages:
    - java
    prompt: In Java, == on two objects asks whether they are the very same object, not whether the text
      matches. What is printed?
    code:
      java: 'String a = new String("hi");

        String b = new String("hi");

        System.out.println((a == b) + " " + a.equals(b));

        '
    options:
    - false true
    - true true
    - true false
    - false false
    answer: 0
    explanation: Two separately created Strings are different objects even with the same letters, so ==
      is false. equals compares the characters and is what you almost always want.
    difficulty: 4
