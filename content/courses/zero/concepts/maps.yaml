id: maps
title: Dictionaries and maps
summary: Store key → value pairs and look values up instantly by key instead of searching.
module: collections
prerequisites: [strings]
difficulty: 2
estimated_minutes: 45
lesson: |
  ## The big idea

  A list answers "what is at position 3?". A **map** (Python **dictionary**) answers
  "what is stored for this *key*?" — for example, a word's count, a user's score, or a
  country's capital. Lookup by key is (on average) **instant**, no matter how many entries
  there are. That speed makes maps the most useful data structure in everyday programming.

  ```python
  ages = {"ada": 36, "alan": 41}
  ages["grace"] = 85            # add or update
  print(ages["ada"])            # 36
  print("bob" in ages)          # False
  print(ages.get("bob", 0))     # 0 (default when missing)
  for name, age in ages.items():
      print(name, age)
  ```

  ```cpp
  #include <unordered_map>
  unordered_map<string, int> ages = {{"ada", 36}, {"alan", 41}};
  ages["grace"] = 85;                       // add or update
  cout << ages["ada"] << "\n";              // 36
  cout << ages.count("bob") << "\n";        // 0 (not present)
  for (auto &[name, age] : ages) cout << name << " " << age << "\n";
  ```

  ```java
  import java.util.HashMap;
  HashMap<String, Integer> ages = new HashMap<>();
  ages.put("ada", 36);
  ages.put("grace", 85);                       // add or update
  System.out.println(ages.get("ada"));         // 36
  System.out.println(ages.containsKey("bob")); // false
  System.out.println(ages.getOrDefault("bob", 0));
  for (var e : ages.entrySet()) System.out.println(e.getKey() + " " + e.getValue());
  ```

  Keys are **unique**: assigning to an existing key replaces its value.

  ## Counting with a map

  The single most common use: count how often each thing appears.

  ```python
  counts = {}
  for word in input().split():
      counts[word] = counts.get(word, 0) + 1
  ```

  ```cpp
  unordered_map<string, int> counts;
  string word;
  while (cin >> word) counts[word]++;   // missing keys start at 0
  ```

  ```java
  HashMap<String, Integer> counts = new HashMap<>();
  for (String word : line.split(" ")) counts.merge(word, 1, Integer::sum);
  ```

  ## Ordered vs unordered

  Hash maps do not keep keys sorted. Python dictionaries remember **insertion order**.
  C++ `map` and Java `TreeMap` keep keys **sorted** (lookups take slightly longer). When a
  problem asks for output "in alphabetical order", either use a sorted map or sort the
  keys before printing.

  ## Sets

  A **set** is a map with keys only — perfect for "have I seen this before?":
  Python `set()`, C++ `unordered_set`, Java `HashSet`.

  ## Why it matters

  The question "does any earlier number pair with this one to make the target?" takes a
  nested loop with lists, but a single pass with a set. You will see this trick
  constantly in interviews.

  ## Worked walkthrough

  Count [4, 4, 2]. Start with an empty map. After each item it is {4:1}, {4:2}, then {4:2, 2:1}. The map records one entry per distinct value, while its counts sum to the total number of processed items. Check that equality after every iteration to catch forgotten increments or overwrites.

  ### Why this works

  A map associates each key with one current value. It is not a list of all occurrences. Updating an existing key replaces its associated value; use old_count + 1 for counting. Use a set when you only need membership.

  ### Things to watch for

  Missing and zero are different states in some tasks. Choose a default intentionally. Do not rely on iteration order when the output specification requires sorted keys; sorting is an additional operation.

  Looking up a key in a map is usually instant, however big the map is. Counting n items takes one quick step per item, and the map holds one entry per different key.

  ### Check your understanding

  How can you detect the first repeated value in one left-to-right pass? When should you insert into the seen set?

  Try it on paper before reading the reasoning below.

  > Check membership before inserting the current value. If present, it is a repeat of an earlier value. Inserting first would make every value appear repeated immediately.

key_points:
  - Maps store key → value pairs; keys are unique.
  - Lookup, insert and update by key are fast on average, regardless of size.
  - Counting occurrences is the classic map pattern.
  - Hash maps are unordered; use a sorted map or sort keys when order matters.
  - A set stores unique keys for fast "seen before?" checks.
pitfalls:
  - Reading a missing key (Python KeyError; C++ [] silently inserts 0).
  - Printing results in hash order when sorted order was required.
  - Using a list and searching it repeatedly when a map would be instant.
