id: recursion
title: Recursion
summary: Solve a problem by having a function call itself on a smaller version, until a simple base case.
module: functions-module
prerequisites: [functions]
difficulty: 3
estimated_minutes: 55
lesson: |
  ## The big idea

  A **recursive** function calls itself. It works when two things are true:

  1. **Base case** — a version of the problem small enough to answer directly.
  2. **Recursive step** — every other version is solved using the answer to a *smaller*
     version of the same problem.

  Factorial is the classic: `5! = 5 × 4!`, and `0! = 1`.

  ```python
  def factorial(n):
      if n == 0:            # base case
          return 1
      return n * factorial(n - 1)   # smaller problem
  ```

  ```cpp
  long long factorial(int n) {
      if (n == 0) return 1;              // base case
      return n * factorial(n - 1);       // smaller problem
  }
  ```

  ```java
  static long factorial(int n) {
      if (n == 0) return 1;              // base case
      return n * factorial(n - 1);       // smaller problem
  }
  ```

  ## How it actually runs: the call stack

  `factorial(3)` pauses while it waits for `factorial(2)`, which waits for `factorial(1)`,
  which waits for `factorial(0)`. Each waiting call is a **frame** on the *call stack*.
  `factorial(0)` returns 1, then the frames finish in reverse order:
  1 × 1 = 1, 2 × 1 = 2, 3 × 2 = 6.

  If the base case is missing or never reached, calls pile up forever until the stack runs
  out: a **stack overflow** (Python: `RecursionError`). Python allows roughly 1000 levels
  by default, so prefer loops for very deep chains.

  ## The leap of faith

  Do not trace every level in your head. Instead:

  1. Handle the base case.
  2. **Assume** the function already works for smaller inputs.
  3. Use that answer to build the answer for the current input.

  Example — sum of a list: the sum of `[a0, a1, ..., an]` is `a0 + sum(rest)`. Trust that
  `sum(rest)` is correct, and you are done.

  ## Branching recursion

  Some problems call themselves **more than once**. Counting the ways to climb `n` stairs
  taking 1 or 2 steps: `ways(n) = ways(n − 1) + ways(n − 2)`. Elegant, but naive branching
  recursion repeats the same work exponentially. Remembering answers you have already
  computed (**memoization**) fixes that — the doorway to *dynamic programming*.

  ```python
  memo = {}
  def ways(n):
      if n <= 1:
          return 1
      if n not in memo:
          memo[n] = ways(n - 1) + ways(n - 2)
      return memo[n]
  ```

  ```cpp
  vector<long long> memo(100, -1);
  long long ways(int n) {
      if (n <= 1) return 1;
      if (memo[n] != -1) return memo[n];
      return memo[n] = ways(n - 1) + ways(n - 2);
  }
  ```

  ```java
  static long[] memo = new long[100];
  static long ways(int n) {
      if (n <= 1) return 1;
      if (memo[n] != 0) return memo[n];
      return memo[n] = ways(n - 1) + ways(n - 2);
  }
  ```

  ## When to use recursion

  Recursion shines when the data or problem is itself recursive: trees, nested
  structures, "try every choice" searches (backtracking), and divide-and-conquer
  algorithms like merge sort. For simple counting, a loop is usually clearer.

  ## Worked walkthrough

  Trace factorial(3): the pending work is 3 × factorial(2), then 2 × factorial(1), then 1 × factorial(0). The base call returns 1. Unwinding gives 1, 2, then 6. Draw a separate frame for each call with its own n; the caller waits while the child computes its result.

  ### Why this works

  A recursive solution needs a base case and a smaller instance moving toward it. Assume the smaller call fulfils its contract, then explain how one local operation extends that result. This reasoning is more useful than trying to hold the entire call tree in your head.

  ### Things to watch for

  A correct recurrence can still exceed the call-stack limit on deep inputs. Negative factorial arguments do not approach the chosen base case. Reject invalid input or specify a valid domain instead of allowing infinite recursion.

  Factorial of n makes n calls, one waiting inside the other. A simple recursive Fibonacci calls itself twice each time and repeats the same work, so it gets slow fast; remembering answers you already found fixes that.

  ### Check your understanding

  How many calls does factorial(3) make when the base case is n=0? What remains on the stack at the deepest point?

  Try it on paper before reading the reasoning below.

  > There are four calls, for 3, 2, 1 and 0. Each caller retains its local n and the multiplication waiting for the returned result.

key_points:
  - Every recursive function needs a base case and a step toward it.
  - Each call gets its own frame on the call stack; frames finish in reverse order.
  - Trust the recursive call on smaller input (the leap of faith).
  - Branching recursion can repeat work; memoization remembers answers.
pitfalls:
  - Missing or unreachable base case — infinite recursion and stack overflow.
  - Recursing on input that does not get smaller.
  - Exponential time from naive branching recursion without memoization.
