id: programs-and-output
title: Programs and output
summary: A program is a precise list of instructions the computer runs top to bottom. Printing is how it talks back.
module: first-steps
difficulty: 1
estimated_minutes: 25
lesson: |
  ## The big idea

  A **program** is a list of instructions written so precisely that a computer can follow
  them without guessing. The computer starts at the top and runs one instruction after
  another, in order. It never skips ahead, never "gets the gist", and never fixes your
  typos for you — which is exactly why programs are reliable.

  The very first instruction most people learn is **print**: show some text on the screen.
  Printing is how your program reports what it is doing, and it is the most useful
  debugging tool you will ever have.

  ## Your first program

  ```python
  print("Hello, world!")
  print("I am learning to code.")
  ```

  ```cpp
  #include <iostream>

  int main() {
      std::cout << "Hello, world!" << "\n";
      std::cout << "I am learning to code." << "\n";
      return 0;
  }
  ```

  ```java
  public class Solution {
      public static void main(String[] args) {
          System.out.println("Hello, world!");
          System.out.println("I am learning to code.");
      }
  }
  ```

  Each line prints one message, and the messages appear **in the same order** as the
  instructions. Swap the two lines and the output swaps too.

  ## Text versus numbers

  Text inside quotes is called a **string**. The computer prints it exactly, character by
  character. Without quotes, the computer treats what you wrote as a calculation or a name:

  ```python
  print("2 + 3")   # prints the text: 2 + 3
  print(2 + 3)     # prints the number: 5
  ```

  ```cpp
  std::cout << "2 + 3" << "\n";  // prints the text: 2 + 3
  std::cout << 2 + 3 << "\n";    // prints the number: 5
  ```

  ```java
  System.out.println("2 + 3");  // prints the text: 2 + 3
  System.out.println(2 + 3);    // prints the number: 5
  ```

  ## How Python, C++ and Java differ here

  - **Python** runs your file line by line. `print` adds a new line automatically.
  - **C++** starts inside `main()`. `std::cout <<` sends output; `"\n"` ends the line.
  - **Java** starts inside `main` within a class. `System.out.println` prints and ends the line.

  The extra lines in C++ and Java (`#include`, `class`, `main`) are the "wrapper" every
  program needs. For now, treat them as the frame around your picture — you will
  understand each part soon.

  ## Several values in one print

  Python puts a space between the values you give `print`, then ends the line:

  ```python
  print("Total:", 5)          # Total: 5
  print("a", "b", sep="-")    # a-b   (sep goes between the values)
  print("no newline", end="") # end replaces the line break
  print("!")                  # so this continues: no newline!
  ```

  In C++ you choose every space yourself with `<<`, and `"\n"` ends the line. In Java,
  `System.out.print` keeps going on the same line and `System.out.println` ends it.

  ## Comments

  Lines starting with `#` (Python) or `//` (C++ and Java) are **comments**. The computer
  ignores them; they are notes for humans, including future you.

  ## Worked walkthrough

  Predict the output before you run it:

  ```python
  print("Hello, Priya")
  print("Total:", 2 + 3)
  ```

  ```cpp
  std::cout << "Hello, Priya" << "\n";
  std::cout << "Total: " << 2 + 3 << "\n";
  ```

  ```java
  System.out.println("Hello, Priya");
  System.out.println("Total: " + (2 + 3));
  ```

  The computer runs the first line and prints `Hello, Priya`, then moves to a new line. It
  runs the second line, works out `2 + 3`, and prints `Total: 5`. Two print instructions
  give two lines, in order. Now remove the space after `Total:` and predict again: you get
  `Total:5`.

  ### Why this works

  The computer follows your instructions exactly and in order. When Socrat checks your
  answer, it compares your output character by character, so an extra space or an extra
  message counts as a different answer. Print exactly what the task asks for.

  ### Things to watch for

  Try printing an empty line, a number in quotes (`"5"`) and a sum (`2 + 3`). Text in
  quotes is printed as it is; only numbers without quotes are calculated. If you print extra
  messages to check your work, remove them before you submit.

  ### Check your understanding

  Print two values on one line, then on separate lines. How many newline characters does each version emit?

  Try it on paper before reading the reasoning below.

  > The usual print operation ends with one newline. Two ordinary print calls emit two; one call with two values emits one. An explicit empty separator changes spacing, not the number of values.

key_points:
  - A program runs its instructions in order, top to bottom.
  - Printing shows output; the order of print statements is the order of output.
  - Quotes make text (a string); without quotes, expressions are calculated.
  - Comments are ignored by the computer and explain code to people.
pitfalls:
  - Forgetting the closing quote or bracket — the program will not run at all.
  - Expecting the computer to "understand what you meant". It does exactly what you wrote.
