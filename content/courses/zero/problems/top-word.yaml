id: top-word
title: Most popular word
concepts:
- maps
difficulty: medium
statement: |
  Count how often each word appears. Print the word that appears most often and its count. If
  several words are tied, print the one that comes first in alphabetical order. Words are
  lowercase letters, and capitals count as different from small letters only if the input has
  them (it does not).
input_format: |
  The first line contains n. The next lines contain the n words, separated by whitespace.
output_format: The winning word and its count, separated by a space.
constraints:
- 1 ≤ n ≤ 100000
- each word has 1 to 10 lowercase letters
examples:
- input: '6

    red blue red green blue red'
  output: red 3
- input: '4

    b a b a'
  output: a 2
  explanation: a and b both appear twice; a comes first alphabetically.
hints:
- A map from word to count gives you the counts in one pass.
- To find the winner, compare counts, and on a tie prefer the smaller word. Do not rely on the order the
  map gives its keys.
- 'One way: sort the (word, count) pairs by count descending, then word ascending, and take the first.'
approach: |
  Count with a dictionary. The answer is the entry with maximum count, with ties broken by the
  smallest word, found by a single scan comparing (count, then word). O(n).
reference: |
  import sys
  data = sys.stdin.read().split()
  n = int(data[0])
  cnt = {}
  for w in data[1:1 + n]:
      cnt[w] = cnt.get(w, 0) + 1
  best = min(cnt.items(), key=lambda kv: (-kv[1], kv[0]))
  print(best[0], best[1])
brute: |
  import sys
  data = sys.stdin.read().split()
  n = int(data[0])
  words = data[1:1 + n]
  best_w, best_c = None, 0
  for w in sorted(set(words)):
      c = words.count(w)
      if c > best_c:
          best_w, best_c = w, c
  print(best_w, best_c)
small_generator: |
  def cases(rng):
      for _ in range(60):
          n = rng.randint(1, 12)
          yield f"{n}\n" + " ".join(rng.choice(["a", "b", "ab", "c", "ba"]) for _ in range(n))
