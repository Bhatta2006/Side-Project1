id: first-not-smaller
title: First that is big enough
concepts:
- searching-and-sorting
difficulty: medium
statement: |
  A sorted list of `n` numbers is given (smallest first, repeats allowed). For each of `q` queries
  x, print the 0-based position of the FIRST item that is greater than or equal to x, or `n` if
  every item is smaller than x.
input_format: |
  The first line contains n and q. The second line contains the sorted list. The third line
  contains the q queries.
output_format: q numbers, separated by spaces.
constraints:
- 1 ≤ n, q ≤ 100000
- 0 ≤ values and x ≤ 10^6
examples:
- input: '5 4

    1 3 3 7 9

    3 4 0 10'
  output: 1 3 0 5
- input: '1 2

    5

    5 6'
  output: 0 1
hints:
- 'A linear scan per query would take n · q = 10^10 steps. The list is sorted: what does that allow?'
- 'Binary search: keep a range [lo, hi) and look at the middle. If the middle item is smaller than x,
  the answer lies to the right; otherwise it is at the middle or to the left.'
- Use the form `while lo < hi`, with `lo = mid + 1` when a[mid] < x and `hi = mid` otherwise. The final
  lo is the answer, and it equals n when no item is large enough.
approach: |
  Classic lower bound: lo = 0, hi = n; while lo < hi: mid = (lo + hi) // 2; if a[mid] < x then
  lo = mid + 1 else hi = mid. Answer lo. O((n + q) log n).
reference: |
  import sys
  data = sys.stdin.read().split()
  n, q = int(data[0]), int(data[1])
  a = list(map(int, data[2:2 + n]))
  out = []
  for x in map(int, data[2 + n:2 + n + q]):
      lo, hi = 0, n
      while lo < hi:
          mid = (lo + hi) // 2
          if a[mid] < x:
              lo = mid + 1
          else:
              hi = mid
      out.append(lo)
  print(*out)
brute: |
  import sys
  data = sys.stdin.read().split()
  n, q = int(data[0]), int(data[1])
  a = list(map(int, data[2:2 + n]))
  out = []
  for x in map(int, data[2 + n:2 + n + q]):
      pos = n
      for i in range(n):
          if a[i] >= x:
              pos = i
              break
      out.append(pos)
  print(*out)
small_generator: |
  def cases(rng):
      for _ in range(60):
          n, q = rng.randint(1, 8), rng.randint(1, 8)
          a = sorted(rng.randint(0, 10) for _ in range(n))
          yield f"{n} {q}\n" + " ".join(map(str, a)) + "\n" + " ".join(str(rng.randint(0, 11)) for _ in range(q))
