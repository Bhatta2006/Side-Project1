id: receipt-lines
title: Print the receipt
concepts:
- programs-and-output
difficulty: medium
statement: |
  A shop keeps prices in cents. For every purchased item, print one line in exactly this format:

  `name: qty x price = total`

  where `price` and `total` are written in dollars with exactly two digits after the point
  (for example 5 cents is `0.05`, and 1999 cents is `19.99`). After all items, print a last line
  `TOTAL sum` with the sum of all item totals in the same dollar format.
input_format: |
  The first line contains n. Each of the next n lines has a name (one word), a quantity and a
  price in cents.
output_format: n item lines followed by the TOTAL line.
constraints:
- 1 ≤ n ≤ 10^4
- 1 ≤ qty ≤ 10^5
- 0 ≤ price ≤ 10^6
examples:
- input: '2

    tea 3 250

    pen 1 5'
  output: 'tea: 3 x 2.50 = 7.50

    pen: 1 x 0.05 = 0.05

    TOTAL 7.55'
- input: '1

    gift 2 0'
  output: 'gift: 2 x 0.00 = 0.00

    TOTAL 0.00'
hints:
- 'Do not use decimal numbers for money: keep everything in whole cents and only format at the very end.'
- To print c cents as dollars, the dollar part is c // 100 and the cents part is c % 100, padded to two
  digits.
- The total of one line is qty · price cents, which can reach 10^11, so use a 64-bit integer in C++ and
  Java.
approach: |
  Keep integer cents. money(c) = f"{c // 100}.{c % 100:02d}". For each line the total is qty ·
  price; accumulate the grand total as a 64-bit integer and print it the same way. O(n).
reference: |
  import sys
  data = sys.stdin.read().split()
  n = int(data[0])
  money = lambda c: f"{c // 100}.{c % 100:02d}"
  total = 0
  out = []
  for i in range(n):
      name, qty, price = data[1 + 3 * i], int(data[2 + 3 * i]), int(data[3 + 3 * i])
      total += qty * price
      out.append(f"{name}: {qty} x {money(price)} = {money(qty * price)}")
  out.append(f"TOTAL {money(total)}")
  print("\n".join(out))
brute: |
  import sys
  from decimal import Decimal
  data = sys.stdin.read().split()
  n = int(data[0])
  total = Decimal(0)
  for i in range(n):
      name, qty, price = data[1 + 3 * i], int(data[2 + 3 * i]), Decimal(data[3 + 3 * i]) / 100
      line = qty * price
      total += line
      print(f"{name}: {qty} x {price:.2f} = {line:.2f}")
  print(f"TOTAL {total:.2f}")
small_generator: |
  def cases(rng):
      for _ in range(40):
          n = rng.randint(1, 6)
          rows = [f"item{i} {rng.randint(1, 20)} {rng.randint(0, 3000)}" for i in range(n)]
          yield f"{n}\n" + "\n".join(rows)
