  def cases(rng):
      yield "1 1\n-5\n2 1 1"
      yield "5 4\n2 -4 3 -1 2\n2 1 5\n1 2 10\n2 1 5\n2 4 4"
      n = q = 50000
      lines = [f"{n} {q}", " ".join(str(rng.randint(-10**9, 10**9)) for _ in range(n))]
      for _ in range(q):
          if rng.random() < 0.5:
              lines.append(f"1 {rng.randint(1, n)} {rng.randint(-10**9, 10**9)}")
          else:
              l = rng.randint(1, n)
              lines.append(f"2 {l} {rng.randint(l, n)}")
      yield "\n".join(lines)
      # All values negative: the best stretch is the single largest element.
      lines = [f"{n} {q}", " ".join(str(-rng.randint(1, 10**9)) for _ in range(n))]
      for _ in range(q):
          lines.append(f"2 1 {rng.randint(1, n)}")
      yield "\n".join(lines)
      for _ in range(6):
          n, q = rng.randint(1, 60), rng.randint(1, 60)
          lines = [f"{n} {q}", " ".join(str(rng.randint(-50, 50)) for _ in range(n))]
          for _ in range(q - 1):
              if rng.random() < 0.4:
                  lines.append(f"1 {rng.randint(1, n)} {rng.randint(-50, 50)}")
              else:
                  l = rng.randint(1, n)
                  lines.append(f"2 {l} {rng.randint(l, n)}")
