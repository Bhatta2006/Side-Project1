id: light-backpack
title: Heavy items, small prices
concepts: [dp-classics]
difficulty: medium
statement: |
  A shop sells `n` items. Item `i` weighs `w[i]` grams and is worth `v[i]` points. You can
  carry at most `W` grams and take each item at most once. Find the largest total worth you
  can carry.
input_format: |
  The first line contains n and W. Each of the next n lines contains w[i] and v[i].
output_format: The maximum total worth.
constraints:
  - 1 ≤ n ≤ 60
  - 1 ≤ W ≤ 10^9
  - 1 ≤ w[i] ≤ 10^9
  - 1 ≤ v[i] ≤ 500
examples:
  - input: "4 10\n6 30\n3 14\n4 16\n2 9"
    output: "46"
    explanation: Take the items weighing 6 and 4 for worth 46, or 3 + 4 + 2 for worth 39. Nothing better fits in 10 grams.
  - input: "2 5\n6 100\n7 200"
    output: "0"
hints:
  - The usual table indexed by capacity needs W cells, which is up to 10^9. Which other quantity is small here?
  - The total worth is at most 60 · 500 = 30000. Swap what the table stores and what it is indexed by.
  - dp[x] = the minimum weight needed to reach worth exactly x. Process items one at a time, going over x from high to low. The answer is the largest x with dp[x] ≤ W.
approach: |
  Knapsack with the roles swapped: dp[x] is the least weight achieving total worth exactly x
  (dp[0] = 0, others infinite). For each item, for x from S down to v: dp[x] = min(dp[x],
  dp[x − v] + w). The answer is the largest x with dp[x] ≤ W. S = sum of worths ≤ 30000, so
  O(n · S) ≈ 1.8·10^6 steps.
reference: |
  import sys
  data = sys.stdin.read().split()
  n, W = int(data[0]), int(data[1])
  items = [(int(data[2 + 2 * i]), int(data[3 + 2 * i])) for i in range(n)]
  S = sum(v for _, v in items)
  INF = float("inf")
  dp = [INF] * (S + 1)
  dp[0] = 0
  for w, v in items:
      for x in range(S, v - 1, -1):
          if dp[x - v] + w < dp[x]:
              dp[x] = dp[x - v] + w
  print(max(x for x in range(S + 1) if dp[x] <= W))
brute: |
  import sys
  data = sys.stdin.read().split()
  n, W = int(data[0]), int(data[1])
  items = [(int(data[2 + 2 * i]), int(data[3 + 2 * i])) for i in range(n)]
  best = 0
  for mask in range(1 << n):
      w = sum(items[i][0] for i in range(n) if mask >> i & 1)
      if w <= W:
          best = max(best, sum(items[i][1] for i in range(n) if mask >> i & 1))
  print(best)
small_generator: |
  def cases(rng):
      for _ in range(60):
          n = rng.randint(1, 10)
          W = rng.randint(1, 40)
          rows = [f"{rng.randint(1, 20)} {rng.randint(1, 9)}" for _ in range(n)]
          yield f"{n} {W}\n" + "\n".join(rows)
