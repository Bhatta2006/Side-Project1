id: segment-tree
title: Segment trees
summary: A tree over array ranges that answers range queries for any associative operation with point updates in O(log n).
module: range-structures
prerequisites: [fenwick-tree, zero:recursion]
difficulty: 5
estimated_minutes: 70
lesson: |
  ## The big idea

  A **segment tree** stores, for each node, the answer for a range of the array: the root
  covers everything, its children cover the two halves, and so on down to single elements.
  Any query range splits into O(log n) stored nodes, so queries and updates are
  **O(log n)** — for **any associative operation**: sum, min, max, gcd, XOR, or custom
  merges.

  ## Iterative bottom-up implementation

  The compact array version: leaves live at `size .. 2·size − 1`, and node `i` has children
  `2i` and `2i + 1`.

  ```python
  class SegTree:                        # range minimum, point assignment
      def __init__(self, a):
          self.size = 1
          while self.size < len(a):
              self.size *= 2
          self.t = [float("inf")] * (2 * self.size)
          self.t[self.size:self.size + len(a)] = a
          for i in range(self.size - 1, 0, -1):
              self.t[i] = min(self.t[2 * i], self.t[2 * i + 1])

      def set(self, i, value):          # 0-indexed
          i += self.size
          self.t[i] = value
          i //= 2
          while i:
              self.t[i] = min(self.t[2 * i], self.t[2 * i + 1])
              i //= 2

      def query(self, l, r):            # min over [l, r), 0-indexed
          res = float("inf")
          l += self.size
          r += self.size
          while l < r:
              if l & 1:
                  res = min(res, self.t[l]); l += 1
              if r & 1:
                  r -= 1; res = min(res, self.t[r])
              l //= 2; r //= 2
          return res
  ```

  ```cpp
  struct SegTree {                      // range minimum, point assignment
      int size; vector<long long> t;
      SegTree(const vector<long long>& a) {
          size = 1; while (size < (int)a.size()) size <<= 1;
          t.assign(2 * size, LLONG_MAX);
          for (int i = 0; i < (int)a.size(); i++) t[size + i] = a[i];
          for (int i = size - 1; i > 0; i--) t[i] = min(t[2 * i], t[2 * i + 1]);
      }
      void set(int i, long long v) {
          for (t[i += size] = v, i >>= 1; i; i >>= 1) t[i] = min(t[2 * i], t[2 * i + 1]);
      }
      long long query(int l, int r) {   // [l, r)
          long long res = LLONG_MAX;
          for (l += size, r += size; l < r; l >>= 1, r >>= 1) {
              if (l & 1) res = min(res, t[l++]);
              if (r & 1) res = min(res, t[--r]);
          }
          return res;
      }
  };
  ```

  ```java
  static int size;
  static long[] t;
  static void build(long[] a) {
      size = 1; while (size < a.length) size <<= 1;
      t = new long[2 * size];
      Arrays.fill(t, Long.MAX_VALUE);
      for (int i = 0; i < a.length; i++) t[size + i] = a[i];
      for (int i = size - 1; i > 0; i--) t[i] = Math.min(t[2 * i], t[2 * i + 1]);
  }
  static void set(int i, long v) {
      for (t[i += size] = v, i >>= 1; i > 0; i >>= 1) t[i] = Math.min(t[2 * i], t[2 * i + 1]);
  }
  static long query(int l, int r) {     // [l, r)
      long res = Long.MAX_VALUE;
      for (l += size, r += size; l < r; l >>= 1, r >>= 1) {
          if ((l & 1) == 1) res = Math.min(res, t[l++]);
          if ((r & 1) == 1) res = Math.min(res, t[--r]);
      }
      return res;
  }
  ```

  Swap `min` and the identity value (`inf`) for any other associative operation: sum with
  0, max with −inf, gcd with 0.

  ## Beyond the basics

  - **Custom node merges**: store (max subarray sum, best prefix, best suffix, total) per
    node to answer "maximum subarray in a range".
  - **Lazy propagation**: range updates (add v to [l, r]) in O(log n) by deferring work to
    children until needed.
  - **Walking the tree**: "first index ≥ l with value ≥ x" by descending from the root.

  ## When to choose what

  Static range sums → prefix sums. Sum with updates → Fenwick (simpler, faster). Min/max,
  custom merges, or lazy range updates → segment tree.

  ## Worked walkthrough

  For [2,5,1,4], store leaf values, then sums 7 and 5, then root 12. Query half-open [1,3) combines leaves 5 and 1, giving 6. Updating index two to 8 repairs its ancestors, changing the root to 19.

  ### Why this works

  Each node summarizes exactly its interval. Associativity permits combining disjoint interval pieces; an identity element handles no overlap. Noncommutative operations also require preserving left-to-right order.

  ### Boundary cases and cost

  Test single-element ranges and endpoints at n. Lazy tags need correct composition order; assigning then adding is different from adding then assigning.

  Point updates and interval queries cost O(log n), storage O(n). Lazy propagation supports suitable range updates with additional tag invariants.

  ### Check your understanding

  Why is zero a valid identity for sum but not always for maximum?

  Try it on paper before reading the reasoning below.

  > Adding zero changes nothing. A maximum query over negative values would be corrupted by a zero no-overlap result; use negative infinity instead.

key_points:
  - Each node stores the answer for its range; queries touch O(log n) nodes.
  - Works for any associative operation with an identity element.
  - Iterative bottom-up version - leaves at size + i, parent i/2, children 2i and 2i+1.
  - Lazy propagation adds range updates; custom merges answer complex range questions.
pitfalls:
  - Mixing inclusive and half-open query ranges.
  - Wrong identity element (e.g. 0 for min).
  - Recursive implementations that are too slow in Python for 10^5 queries.
