id: dp-classics
title: Classic contest DPs
summary: Knapsack, coin combinations and LIS in O(n log n) — the DP patterns every contestant must know cold.
module: dp-module
prerequisites: [dsa:dp-2d]
difficulty: 4
estimated_minutes: 65
lesson: |
  ## The big idea

  A few DP patterns appear in contests again and again. Knowing them cold — state,
  transition, loop order, and complexity — lets you recognise variants within minutes.

  ## 0/1 knapsack (each item at most once)

  `dp[c]` = best value with capacity c. Iterate items, and capacity **downwards**:

  ```python
  dp = [0] * (W + 1)
  for w, v in items:
      for c in range(W, w - 1, -1):
          dp[c] = max(dp[c], dp[c - w] + v)
  ```

  ```cpp
  vector<long long> dp(W + 1, 0);
  for (auto [w, v] : items)
      for (int c = W; c >= w; c--) dp[c] = max(dp[c], dp[c - w] + v);
  ```

  ```java
  long[] dp = new long[W + 1];
  for (int[] it : items)
      for (int c = W; c >= it[0]; c--) dp[c] = Math.max(dp[c], dp[c - it[0]] + it[1]);
  ```

  O(n·W). Only viable when W is small (≲ 10^5 – 10^6 operations-wise).

  ## Coin combinations: order matters or not?

  Counting ways to make sum x:

  - **Ordered** (1+2 ≠ 2+1): loop **sum outside**, coins inside.
  - **Unordered** (combinations): loop **coins outside**, sum inside (upwards).

  Swapping the loops changes the answer — a classic trap.

  ## Longest increasing subsequence in O(n log n)

  Keep `tails[k]` = the smallest possible tail of an increasing subsequence of length k+1.
  For each x, find the first tail ≥ x with binary search and replace it (or append if none).
  The length of `tails` is the LIS length.

  ```python
  from bisect import bisect_left
  def lis(a):
      tails = []
      for x in a:
          i = bisect_left(tails, x)       # strictly increasing
          if i == len(tails):
              tails.append(x)
          else:
              tails[i] = x
      return len(tails)
  ```

  ```cpp
  int lis(const vector<int>& a) {
      vector<int> tails;
      for (int x : a) {
          auto it = lower_bound(tails.begin(), tails.end(), x);
          if (it == tails.end()) tails.push_back(x); else *it = x;
      }
      return tails.size();
  }
  ```

  ```java
  static int lis(int[] a) {
      int[] tails = new int[a.length];
      int len = 0;
      for (int x : a) {
          int i = Arrays.binarySearch(tails, 0, len, x);
          if (i < 0) i = -(i + 1);
          tails[i] = x;
          if (i == len) len++;
      }
      return len;
  }
  ```

  For **non-decreasing** subsequences use `bisect_right` / `upper_bound`.

  ## Other must-knows

  - **Edit distance / LCS** (2D over prefixes).
  - **Interval DP**: `dp[l][r]` over subarrays, filled by increasing length (O(n³)).
  - **DP on digits** for "count numbers ≤ N with property P".

  ## Worked walkthrough

  For 0/1 knapsack with capacity 5 and items (weight,value) (2,3), (3,4), the best value is 7 using both. A state must specify whether it means exact used weight or best value within a capacity; base cases and unreachable states depend on that choice.

  ### Why this works

  Write state, transition, base cases, evaluation order and requested result before coding. For LIS, replacing a tails entry maintains best possible future extension but does not directly preserve one complete subsequence.

  ### Boundary cases and cost

  Test zero capacity, oversized items, equal values and empty input. An ascending in-place capacity loop can accidentally turn 0/1 knapsack into unbounded knapsack.

  Knapsack costs O(items×capacity), which is pseudopolynomial. LIS length can be O(n log n), but reconstruction needs predecessor information.

  ### Check your understanding

  Why does descending capacity prevent reusing the current item?

  Try it on paper before reading the reasoning below.

  > Every dependency at lower capacity still belongs to the previous item set when read.

key_points:
  - 0/1 knapsack - capacity loop downwards; unbounded - upwards.
  - Counting coin sums - sum-outer loop counts orderings, coin-outer counts combinations.
  - LIS in O(n log n) with tails + binary search (lower_bound for strict).
  - Check n × W (or n × sum) against the operation budget before choosing a DP.
pitfalls:
  - Wrong loop order changing what is counted.
  - Using lower_bound vs upper_bound incorrectly for strict vs non-strict LIS.
  - Forgetting modulo in counting DPs.
