quiz:
  - id: neg-mod-cpp
    kind: output
    languages:
    - cpp
    - java
    prompt: What does this print?
    code:
      cpp: 'int a = -7, m = 3;

        cout << a % m;

        '
      java: 'int a = -7, m = 3;

        System.out.println(a % m);

        '
    options:
    - '-1'
    - '2'
    - '1'
    - '-2'
    answer: 0
    explanation: 'In C++ and Java the remainder takes the sign of the dividend, so -7 % 3 = -1. Safe non-negative
      form: ((a % m) + m) % m = 2.'
    difficulty: 2
  - id: neg-mod-py
    kind: output
    languages:
    - python
    prompt: What does this print?
    code:
      python: 'a, m = -7, 3

        print(a % m)

        '
    options:
    - '2'
    - '-1'
    - '1'
    - '-2'
    answer: 0
    explanation: Python's % takes the sign of the divisor, so the result is always in [0, m). You do not
      need the + m fix-up, but it is harmless.
    difficulty: 2
  - id: pow-steps
    kind: mcq
    prompt: About how many modular multiplications does binary exponentiation need for an exponent near
      10^18?
    options:
    - About 120 (two per bit, 60 bits)
    - About 10^18, one multiplication per unit of the exponent
    - About 10^9, the square root of the exponent
    - About 18, one multiplication per decimal digit
    answer: 0
    explanation: 10^18 < 2^60, so there are at most 60 squarings and 60 multiplies. A loop over the exponent
      itself would never finish.
    difficulty: 2
  - id: when-inverse
    kind: mcq
    prompt: Which of these numbers has a multiplicative inverse modulo 15?
    options:
    - '4'
    - '6'
    - '9'
    - '10'
    answer: 0
    explanation: An inverse exists exactly when gcd(x, m) = 1. gcd(6, 15) = 3, gcd(9, 15) = 3, gcd(10, 15)
      = 5, but gcd(4, 15) = 1 (4·4 = 16 ≡ 1).
    difficulty: 3
  - id: mod-chain-output
    kind: output
    prompt: With M = 10^9 + 7 in 64-bit arithmetic, what does this print?
    code:
      python: 'M = 10**9 + 7

        a = b = M - 1

        print(a * b % M)

        '
      cpp: 'long long M = 1000000007LL;

        long long a = M - 1, b = M - 1;

        cout << a * b % M;

        '
      java: 'long M = 1_000_000_007L;

        long a = M - 1, b = M - 1;

        System.out.println(a * b % M);

        '
    options:
    - '1'
    - '0'
    - '1000000006'
    - '1000000007'
    answer: 0
    explanation: M − 1 ≡ −1 (mod M), so the product is (−1)² = 1. The product itself is about 10^18, which
      still fits in a signed 64-bit integer.
    difficulty: 3
  - id: divide-mod
    kind: mcq
    prompt: Modulo p = 7, what is 10 ÷ 4 (that is, 10 · 4^(-1))?
    options:
    - '6'
    - '3'
    - '2'
    - '5'
    answer: 0
    explanation: The inverse of 4 mod 7 is 2 (4·2 = 8 ≡ 1), and 10·2 = 20 ≡ 6. Plain integer division 10
      / 4 has no meaning here.
    difficulty: 3
  - id: fermat-condition
    kind: mcq
    prompt: When does x^(m−2) mod m give the modular inverse of x?
    options:
    - When m is prime and x is not a multiple of m
    - For every m, as long as x < m
    - Whenever x is prime, whatever m is
    - Only when m is a power of two
    answer: 0
    explanation: Fermat's little theorem needs a prime modulus. For composite m (say 12) use the extended
      Euclidean algorithm, which works whenever gcd(x, m) = 1.
    difficulty: 4
  - id: powmod-output
    kind: output
    prompt: What does this binary exponentiation print?
    code:
      python: "r, b, e = 1, 3, 100\nwhile e:\n    if e & 1:\n        r = r * b % 7\n    b = b * b % 7\n\
        \    e >>= 1\nprint(r)\n"
      cpp: "long long r = 1, b = 3, e = 100;\nwhile (e) {\n    if (e & 1) r = r * b % 7;\n    b = b * b\
        \ % 7;\n    e >>= 1;\n}\ncout << r;\n"
      java: "long r = 1, b = 3, e = 100;\nwhile (e > 0) {\n    if ((e & 1) == 1) r = r * b % 7;\n    b =\
        \ b * b % 7;\n    e >>= 1;\n}\nSystem.out.println(r);\n"
    options:
    - '4'
    - '1'
    - '3'
    - '2'
    answer: 0
    explanation: This is 3^100 mod 7. Since 3^6 ≡ 1, only 100 mod 6 = 4 matters, and 3^4 = 81 ≡ 4.
    difficulty: 4
  - id: sum-formula
    kind: mcq
    prompt: You need n(n+1)/2 mod p for n up to 10^18 and p = 10^9 + 7, in 64-bit integers. Which is correct?
    options:
    - Halve whichever of n and n + 1 is even first, then reduce each factor mod p and multiply
    - Compute n * (n + 1) / 2 in 64-bit and then take the result % p
    - Compute n * (n + 1) % p first and divide the remainder by 2 afterwards
    - Use floating point, because the exact value is far too large for integers
    answer: 0
    explanation: n(n+1) reaches 10^36, far beyond 64 bits, so the product overflows before any division.
      Dividing the even factor first (or multiplying by the inverse of 2 modulo p) keeps every value small.
    difficulty: 5
  - id: exponent-p-minus-one
    kind: bug
    prompt: The inverse of 3 modulo the prime 7 is 5 (3 * 5 = 15 = 1 mod 7). This code computes 3^(p - 1)
      mod p with a correct binary power. What does it print?
    code:
      python: "def power(b, e, m):\n    r = 1\n    b %= m\n    while e:\n        if e & 1:\n           \
        \ r = r * b % m\n        b = b * b % m\n        e >>= 1\n    return r\nprint(power(3, 7 - 1, 7))\n"
      cpp: "auto power = [](long long b, long long e, long long m) {\n    long long r = 1;\n    b %= m;\n\
        \    while (e) {\n        if (e & 1) r = r * b % m;\n        b = b * b % m;\n        e >>= 1;\n\
        \    }\n    return r;\n};\ncout << power(3, 7 - 1, 7);\n"
      java: "class T {\n    long power(long b, long e, long m) {\n        long r = 1;\n        b %= m;\n\
        \        while (e > 0) {\n            if ((e & 1) == 1) r = r * b % m;\n            b = b * b %\
        \ m;\n            e >>= 1;\n        }\n        return r;\n    }\n}\nSystem.out.println(new T().power(3,\
        \ 7 - 1, 7));\n"
    options:
    - '1'
    - '5'
    - '3'
    - '6'
    answer: 0
    explanation: Fermat says x^(p-1) = 1 for every x not divisible by p, which is useless as an inverse.
      The inverse is x^(p-2) = 3^5 mod 7 = 5, because x * x^(p-2) = x^(p-1) = 1.
    difficulty: 3
