quiz:
  - id: perm-feasible
    kind: mcq
    prompt: For n ≤ 10, is trying all permutations (with O(n) work each) feasible in C++?
    options: ["Yes — about 3.6·10^7 operations", "No — about 10^10 operations", "Only for n ≤ 5, about 600 steps", "Only in Python, using itertools"]
    answer: 0
    explanation: 10! ≈ 3.6·10^6 permutations × 10 ≈ 3.6·10^7.
    difficulty: 2
  - id: subset-count
    kind: mcq
    prompt: How many subsets does mask iterate over for n = 20?
    options: ["1,048,576", "400", "20", "2,432,902,008,176,640,000"]
    answer: 0
    explanation: 2^20 = 1,048,576.
    difficulty: 1
  - id: mitm
    kind: mcq
    prompt: Meet in the middle improves subset enumeration from O(2^n) to roughly...
    options: ["O(2^(n/2) · n)", "O(n · 2^(n/4))", "O(n² log n)", "O(2^n / n)"]
    answer: 0
    explanation: Two halves of 2^(n/2) sums each, combined after sorting.
    difficulty: 3
  - id: stress
    kind: mcq
    prompt: Your fast solution gets Wrong Answer on a hidden test. What's the most effective next step?
    options:
      - "Compare it with a brute force on many random small inputs"
      - "Resubmit it unchanged in case the judge was having trouble"
      - "Rewrite the whole solution in another programming language"
      - "Test it on bigger arrays, since the bug must be in large cases"
    answer: 0
    explanation: Stress testing finds a tiny counterexample you can trace by hand.
    difficulty: 2
  - id: search-bound
    kind: mcq
    prompt: "Roughly, what is the largest n for which trying all permutations of n items fits in about 10^8 simple steps?"
    options:
      - "n ≈ 11"
      - "n ≈ 20"
      - "n ≈ 30"
      - "n ≈ 100"
    answer: 0
    explanation: "11! ≈ 4·10^7 while 12! ≈ 4.8·10^8. Subsets reach n ≈ 25 (2^25 ≈ 3·10^7)."
    difficulty: 4
  - id: meet-in-middle
    kind: mcq
    prompt: "Subset sum with n = 40 is too big for 2^40. Meet in the middle runs in about"
    options:
      - "2^20 · 20 steps"
      - "2^40 / 2 steps"
      - "40^2 steps"
      - "2^39 steps"
    answer: 0
    explanation: "Enumerate 2^20 sums of each half, sort one list, and binary search or two-pointer it against the other."
    difficulty: 5
