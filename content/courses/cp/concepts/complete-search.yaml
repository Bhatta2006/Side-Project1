id: complete-search
title: Complete search
summary: When the input is small, try everything — systematically, and with an operation count that fits.
module: contest-basics
prerequisites: [simulation, dsa:backtracking]
difficulty: 3
estimated_minutes: 45
lesson: |
  ## The big idea

  Small constraints are a **hint**: n ≤ 8 invites trying all permutations (8! = 40,320);
  n ≤ 20 invites all subsets (2^20 ≈ 10^6); values ≤ 1000 invite trying every candidate
  answer. A complete search is usually the fastest correct solution to write — and always
  the best way to **verify** a clever one.

  ## Iterating permutations

  ```python
  from itertools import permutations
  best = min(cost(p) for p in permutations(range(n)))
  ```

  ```cpp
  vector<int> p(n);
  iota(p.begin(), p.end(), 0);           // start from the smallest permutation
  long long best = LLONG_MAX;
  do {
      best = min(best, cost(p));
  } while (next_permutation(p.begin(), p.end()));
  ```

  ```java
  // Java has no next_permutation: use recursion with a used[] array,
  // or implement next permutation manually.
  static void permute(int[] p, boolean[] used, int k) { /* choose, recurse, un-choose */ }
  ```

  ## Iterating subsets with bitmasks

  ```python
  for mask in range(1 << n):
      total = sum(a[i] for i in range(n) if mask >> i & 1)
  ```

  Total work: 2^n · n. For n = 20 that is 2·10^7 — fine in C++, slow in Python. In Python,
  prefer incremental sums or meet-in-the-middle for the upper end.

  ## Searching the answer space

  If the answer is an integer in a small range, test each candidate: "smallest x such
  that ...", "how many pairs (a, b) with a, b ≤ 1000 satisfy ...". Reduce the search with
  symmetry (only consider a ≤ b) and early termination.

  ## Meet in the middle

  For n ≈ 40 subsets, split the items in half, enumerate 2^20 sums of each half, sort one
  side, and combine with binary search or two pointers: O(2^(n/2) · n) instead of O(2^n).

  ## Brute force as a checker

  When a greedy or DP solution fails mysteriously, write a brute force for tiny inputs,
  generate random small tests, and compare outputs automatically. Finding the smallest
  counterexample usually reveals the bug in minutes. Strong competitors do this routinely.

  ## Worked walkthrough

  Enumerate subsets of three objects using masks 000 through 111. Each mask chooses exactly the positions whose bits are one, giving eight distinct subsets. Evaluate a candidate only after the choice is complete; keep the best feasible one rather than accepting the first feasible candidate.

  ### Why this works

  Exhaustive search is correct when the representation covers every candidate and the evaluation matches the objective. Small constraints are a reason to prefer this clear baseline.

  ### Boundary cases and cost

  Test no feasible candidate, duplicate values and the empty subset. Permutations and subsets have different counts and should not share an accidental enumeration.

  Subsets cost O(2ⁿ), permutations O(n!), before evaluation. Estimate the full candidate count against the maximum n.

  ### Check your understanding

  How does complete search help validate a faster algorithm?

  Try it on paper before reading the reasoning below.

  > On small random inputs it provides an independent oracle. Compare results and minimize a disagreement into a counterexample.

key_points:
  - Small constraints signal complete search - n ≤ 8 permutations, n ≤ 20 subsets.
  - Count the work (n! · n, 2^n · n) against the time limit before writing.
  - Use next_permutation / itertools / bitmasks to enumerate cleanly.
  - Meet in the middle halves the exponent for n ≈ 40.
  - Brute force on random small tests is the best way to find bugs in clever solutions.
pitfalls:
  - Forgetting to start next_permutation from the sorted order.
  - Underestimating the constant factor of 2^n · n in Python.
  - Missing symmetric duplicates that double the work.
