id: tree-techniques
title: Tree techniques
summary: Root a general tree, compute subtree DP bottom-up, flatten it with an Euler tour, and find its diameter.
module: graph-module
prerequisites: [dsa:binary-trees, dsa:graph-traversal]
difficulty: 4
estimated_minutes: 60
lesson: |
  ## The big idea

  Contest trees are usually given as `n − 1` undirected edges, not as left/right children.
  Root the tree at node 1, and suddenly every tree question becomes "compute something for
  each subtree from its children" — **tree DP**.

  ## Rooting without recursion

  Deep trees (a chain of 2·10^5 nodes) overflow recursion in Python and Java, and sometimes
  C++. Use an iterative BFS/DFS to get a parent array and a visiting order; then process
  nodes in **reverse order** so children are always done before parents.

  ```python
  def root_tree(n, adj, root=1):
      parent = [0] * (n + 1)
      order = [root]
      parent[root] = -1
      for u in order:                       # BFS order; the list grows as we go
          for v in adj[u]:
              if v != parent[u]:
                  parent[v] = u
                  order.append(v)
      return parent, order

  # subtree sizes, bottom-up
  size = [1] * (n + 1)
  for u in reversed(order):
      if parent[u] > 0:
          size[parent[u]] += size[u]
  ```

  ```cpp
  vector<int> parent(n + 1, 0), order{1}, sz(n + 1, 1);
  parent[1] = -1;
  for (int i = 0; i < (int)order.size(); i++) {
      int u = order[i];
      for (int v : adj[u]) if (v != parent[u]) { parent[v] = u; order.push_back(v); }
  }
  for (int i = n - 1; i > 0; i--) sz[parent[order[i]]] += sz[order[i]];
  ```

  ```java
  int[] parent = new int[n + 1], order = new int[n], sz = new int[n + 1];
  int head = 0, tail = 0;
  order[tail++] = 1; parent[1] = -1;
  while (head < tail) {
      int u = order[head++];
      for (int v : adj.get(u)) if (v != parent[u]) { parent[v] = u; order[tail++] = v; }
  }
  Arrays.fill(sz, 1);
  for (int i = n - 1; i > 0; i--) sz[parent[order[i]]] += sz[order[i]];
  ```

  ## Classic tree DPs

  - **Subtree size / sum** — add each child into its parent.
  - **Maximum independent set / matching** — two states per node (taken / not taken).
  - **Diameter** — the longest path. Two BFS passes: BFS from any node to find the farthest
    node A; BFS from A; the farthest distance is the diameter.

  ## Euler tour (flattening)

  Record the time each node is **entered** (tin) and the time its subtree **ends** (tout)
  in a DFS. Then the subtree of u is exactly the contiguous range `[tin[u], tout[u]]`, so
  **subtree queries become range queries** — combine with a Fenwick tree for "update a node,
  query a subtree sum".

  ## Rerooting

  To answer something "for every possible root" (e.g. sum of distances from each node),
  compute the answer for root 1, then move the root across each edge in O(1) using the
  subtree sizes: `ans[child] = ans[parent] − size[child] + (n − size[child])`.

  ## Worked walkthrough

  Root a tree with edges 0-1, 0-2, 1-3 at zero. Subtree sizes are size[3]=1, size[1]=2, size[2]=1, size[0]=4. Postorder combines completed child results; the parent edge must be excluded in an undirected adjacency list.

  ### Why this works

  A rooted tree gives each nonroot vertex one parent. Subtree intervals, sizes and dynamic programs all rely on that orientation. Rerooting separates information from children and from the parent side.

  ### Boundary cases and cost

  Test a chain, a star and a single vertex. Recursive DFS can overflow on a long chain; an explicit stack with enter/exit phases preserves postorder.

  Typical tree traversals take O(n). Rerooting is linear only when combining or excluding each child's contribution is efficient.

  ### Check your understanding

  Why does a DFS entry-time interval represent a whole subtree?

  Try it on paper before reading the reasoning below.

  > DFS finishes all descendants before moving to the next sibling, so those entry times are contiguous.

key_points:
  - Root the tree, then compute subtree values bottom-up in reverse BFS order.
  - Iterative traversal avoids recursion limits on deep trees.
  - Diameter via two BFS passes.
  - Euler tour turns subtrees into contiguous ranges.
  - Rerooting computes all-roots answers in O(n).
pitfalls:
  - Recursive DFS overflowing on chain-shaped trees.
  - Treating the undirected edge back to the parent as a child.
  - Forgetting 64-bit for sums of distances (can reach ~10^10 or more).
