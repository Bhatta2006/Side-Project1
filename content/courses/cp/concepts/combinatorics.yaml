id: combinatorics
title: Counting and binomial coefficients
summary: Count arrangements with factorials, nCr modulo a prime, and the classic counting principles.
module: math
prerequisites: [modular-arithmetic]
difficulty: 4
estimated_minutes: 50
lesson: |
  ## The big idea

  "In how many ways...?" problems are about **counting without listing**. Two principles
  and one formula carry you far:

  - **Product rule**: independent choices multiply (3 shirts × 4 pants = 12 outfits).
  - **Sum rule**: disjoint cases add.
  - **Binomial coefficient** `C(n, k) = n! / (k! (n − k)!)` — the number of ways to choose
    k items from n.

  ## nCr modulo a prime, fast

  Precompute factorials and inverse factorials once; then each `C(n, k)` is O(1):

  ```python
  MOD = 10**9 + 7
  N = 10**6
  fact = [1] * (N + 1)
  for i in range(1, N + 1):
      fact[i] = fact[i - 1] * i % MOD
  inv_fact = [1] * (N + 1)
  inv_fact[N] = pow(fact[N], MOD - 2, MOD)
  for i in range(N, 0, -1):
      inv_fact[i - 1] = inv_fact[i] * i % MOD

  def C(n, k):
      if k < 0 or k > n:
          return 0
      return fact[n] * inv_fact[k] % MOD * inv_fact[n - k] % MOD
  ```

  ```cpp
  const long long MOD = 1e9 + 7;
  const int N = 1000000;
  long long fact[N + 1], invFact[N + 1];
  long long power(long long a, long long b) { long long r = 1; a %= MOD; for (; b; b >>= 1, a = a * a % MOD) if (b & 1) r = r * a % MOD; return r; }
  void init() {
      fact[0] = 1;
      for (int i = 1; i <= N; i++) fact[i] = fact[i - 1] * i % MOD;
      invFact[N] = power(fact[N], MOD - 2);
      for (int i = N; i > 0; i--) invFact[i - 1] = invFact[i] * i % MOD;
  }
  long long C(int n, int k) { return k < 0 || k > n ? 0 : fact[n] * invFact[k] % MOD * invFact[n - k] % MOD; }
  ```

  ```java
  static final long MOD = 1_000_000_007L;
  static long[] fact, invFact;
  static void init(int n) {
      fact = new long[n + 1]; invFact = new long[n + 1];
      fact[0] = 1;
      for (int i = 1; i <= n; i++) fact[i] = fact[i - 1] * i % MOD;
      invFact[n] = power(fact[n], MOD - 2);
      for (int i = n; i > 0; i--) invFact[i - 1] = invFact[i] * i % MOD;
  }
  static long C(int n, int k) { return k < 0 || k > n ? 0 : fact[n] * invFact[k] % MOD * invFact[n - k] % MOD; }
  ```

  Computing one inverse (of `fact[N]`) and walking down is O(N) total.

  ## Classic counting patterns

  - **Grid paths**: right/down paths in an a × b grid: `C(a + b, a)`.
  - **Stars and bars**: ways to split n identical items into k groups (possibly empty):
    `C(n + k − 1, k − 1)`.
  - **Complement counting**: count everything, subtract the bad cases.
  - **Inclusion–exclusion**: |A ∪ B| = |A| + |B| − |A ∩ B|, and its generalisations.
  - **Pascal's rule**: `C(n, k) = C(n−1, k−1) + C(n−1, k)` — a DP table when the modulus is
    not prime or n is small.

  ## Worked walkthrough

  Choose two positions from four. List pairs 01,02,03,12,13,23: six choices. If order mattered there would be twelve. Before selecting a formula, decide whether items are distinct, repetition is allowed and order matters.

  ### Why this works

  A counting argument needs a bijection or disjoint exhaustive cases. The product rule combines sequential choices; the sum rule combines alternatives that must not overlap.

  ### Boundary cases and cost

  Factorial formulas under a modulus need valid inverses. For prime modulus p, factorials reaching p become zero modulo p and the usual inverse-factorial method no longer applies directly.

  Precomputed factorials give O(1) binomial queries after O(n) work, subject to the modulus assumptions.

  ### Check your understanding

  Why does multiplying n choices by n−1 choices overcount unordered pairs?

  Try it on paper before reading the reasoning below.

  > Each pair appears in two orders. Divide by two over integers, or use a valid modular inverse when working modulo a suitable modulus.

key_points:
  - Product rule for independent choices; sum rule for disjoint cases.
  - C(n, k) = n! / (k!(n − k)!); precompute factorials and inverse factorials for O(1) queries.
  - Grid paths are C(a + b, a); stars and bars gives C(n + k − 1, k − 1).
  - Complement counting and inclusion–exclusion simplify "at least one" questions.
pitfalls:
  - Returning garbage for k > n or k < 0 instead of 0.
  - Computing an inverse for every query instead of precomputing.
  - Using Fermat inverses with a non-prime modulus.
