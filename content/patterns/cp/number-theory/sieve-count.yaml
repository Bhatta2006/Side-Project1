id: cp:number-theory/sieve-count
concept: cp:number-theory
title: Sieve of Eratosthenes (all primes up to n)
tracks: [competitive, interview]
recognise:
  - Many primality questions over a range up to about 10^7
  - Factorising many numbers, which a smallest-prime-factor table makes fast
  - A count or sum over primes up to n
state: "is_prime[k] for every k up to n; i is the next number to test as a prime"
transition: "if i is still prime, cross out i·i, i·i + i, … up to n"
base_cases: ["0 and 1 are not prime", "everything else starts as prime"]
complexity: {time: "O(n log log n)", space: "O(n)"}
template:
  python: |
    import sys

    n = int(sys.stdin.read())
    is_prime = [True] * (n + 1)
    is_prime[0] = is_prime[1] = False
    i = 2
    while i * i <= n:
        if is_prime[i]:
            for j in range(i * i, n + 1, i):  # smaller multiples are already gone
                is_prime[j] = False
        i += 1
    print(sum(is_prime))
  cpp: |
    #include <bits/stdc++.h>
    using namespace std;

    int main() {
        int n;
        cin >> n;
        vector<bool> is_prime(n + 1, true);
        is_prime[0] = false;
        if (n >= 1) is_prime[1] = false;
        for (long long i = 2; i * i <= n; i++) {
            if (is_prime[i]) {
                for (long long j = i * i; j <= n; j += i) is_prime[j] = false;
            }
        }
        cout << count(is_prime.begin(), is_prime.end(), true) << "\n";
    }
  java: |
    import java.util.*;

    public class Solution {
        public static void main(String[] args) {
            Scanner in = new Scanner(System.in);
            int n = in.nextInt();
            boolean[] isPrime = new boolean[n + 1];
            Arrays.fill(isPrime, true);
            isPrime[0] = false;
            if (n >= 1) isPrime[1] = false;
            for (long i = 2; i * i <= n; i++) {
                if (isPrime[(int) i]) {
                    for (long j = i * i; j <= n; j += i) isPrime[(int) j] = false;
                }
            }
            int count = 0;
            for (boolean p : isPrime) if (p) count++;
            System.out.println(count);
        }
    }
